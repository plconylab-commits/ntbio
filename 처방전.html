// ══ 처방전 PDF 불러오기 ══════════════════════════

function showRxToast(msg, duration) {
  let t = document.getElementById('rxToast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'rxToast';
    t.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#2A8A88;color:#fff;padding:10px 24px;border-radius:8px;font-size:14px;font-weight:600;z-index:99999;box-shadow:0 4px 12px rgba(0,0,0,.3);transition:opacity .3s;';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.style.opacity = '0'; }, duration || 2500);
}

// ── 페이지별 텍스트 배열 반환 (##RX## 감지용) ──
function extractRxPdfText(data) {
  return pdfjsLib.getDocument({ data }).promise.then(pdf => {
    const pages = [];
    for (let i = 1; i <= pdf.numPages; i++) pages.push(
      pdf.getPage(i).then(p => p.getTextContent()).then(tc => tc.items.map(it => it.str).join(' '))
    );
    return Promise.all(pages); // string[] — 페이지별
  });
}

// ── 좌표 기반 텍스트 추출 (처방 단계 자동 인식) ──────────────────
const RX_LEFT_X_MAX         = 160;  // 좌측 열 X 임계값 (scale=1.0)
const RX_ROW_Y_MERGE        = 10;   // 같은 행 Y 허용 오차 (px)
const RX_STAGE_Y_GAP        = 50;   // 좌측 그룹 사이 간격 (px)
const RX_COUNT_UNITS_RE     = /포|병|봉|통|개/;
const RX_PAGE_TITLE_Y_GAP   = 60;   // v16: 첫 좌측 아이템 ↔ 다음 좌측 아이템 gap > 이 값 → pageTitle 후보
const RX_PAGE_Y_MAX         = 800;  // 이 Y 이상은 푸터 영역으로 간주 → 수집 제외
// ── 사용법 셀 파싱 전용 푸터 필터 ────────────────────────────────
// 용도: PDF에서 추출한 텍스트가 처방 내용이 아닌 업체 공통정보일 때 수집 제외
// ⚠ 이 필터는 parseRxPdfCoords() 내부 rightDetailItems 수집에만 사용
//   → 화면 하단 page-footer-bar(logo + 업체정보) HTML 렌더링과는 완전히 별개
const RX_FOOTER_RE = new RegExp([
  '담당자',                         // "담당자:010-..."
  '1577-\\d{4}',                    // 대표번호 전체 (1577-5963 등)
  '천연바이오',                     // 업체명
  '\\b0\\d{1,2}-\\d{3,4}-\\d{4}\\b', // 전화번호 형식: 010-1234-5678 / 02-123-4567
].join('|'));
// v16: 좌측 열 테이블 헤더/구조 텍스트 필터 (단계명 오염 방지)
const RX_LEFT_TABLE_HDR_RE  = /^(시기\s*[\/\/]?\s*단계|처방\s*단계|단계명?|시기명?|품\s*목|규\s*격|수\s*량|제품명?|용\s*량|사용량|물량\s*[\/\/]?\s*평수|합\s*계|소\s*계|비\s*고|구\s*분|내\s*용|번호|No\.)$/i;

async function extractRxPdfCoords(pdfDoc) {
  const allItems = [];
  // 비용 페이지는 포/병/봉/통/개 단위가 없어 파서가 자동 스킵 → 전체 페이지 처리
  const lastPage = pdfDoc.numPages;
  for (let p = 1; p <= lastPage; p++) {
    const page = await pdfDoc.getPage(p);
    const vp   = page.getViewport({ scale: 1.0 });
    const tc   = await page.getTextContent();
    tc.items.forEach(it => {
      if (!it.str.trim()) return;
      const [,,,, x, y] = pdfjsLib.Util.transform(vp.transform, it.transform);
      // v16: it.width = 폰트 유닛 advance width; transform[0] = font size scale
      const w = Math.abs((it.width || 0) * (it.transform ? Math.abs(it.transform[0]) : 1));
      allItems.push({ text: it.str.trim(), x: Math.round(x), y: Math.round(y), w: Math.round(w), page: p });
    });
  }
  allItems.sort((a, b) => a.page - b.page || a.y - b.y || a.x - b.x);
  return allItems;
}


function detectTypeFromParsedLabel(label, products) {
  const text = [label || '', ...(products || []).map(p => p.key || ''), ...(products || []).map(p => p.desc || '')].join(' ');
  if (/엽면/.test(text)) return '엽면';
  if (/관주/.test(text)) return '관주';
  // 기비용 제품(옥스팜/뉴천연팜/옥토팜) 포함 단계 → 기비 (헤더 텍스트 무관)
  if ((products || []).some(p => /옥스팜|뉴천연팜|옥토팜/.test(p.key || ''))) return '기비';
  if (/감사|수확/.test(text)) return '감사비료';
  if (/기비|밑거름|기본시비|토양|경운/.test(text)) return '기비';
  if (/추비/.test(text)) return '추비';
  return '';
}

// ── v16 헬퍼: 좌측 행 분류 (pdfParser.js의 classifyLeftRow와 동일 로직) ──
function rxClassifyLeftRow(text) {
  const t = text.trim();
  if (!t) return 'empty';
  // stage_core: 단계 시작 키워드 (관주/엽면 등 전체 단어 포함 여부)
  if (typeof classifyLeftRow === 'function') return classifyLeftRow(t);
  // fallback: rxNormalizer.js 미로드 시 자체 판정
  if (/관주|엽면|기비|밑거름|토양처리|정식|추비|감사|수확/.test(t)) return 'stage_core';
  if (/\d+\s*월|\d+\s*[-~]\s*\d+\s*월/.test(t)) return 'date';
  if (/^(및|and|or|또는|그리고|after|before)$/i.test(t)) return 'connector';
  return 'note';
}

/**
 * PDF 텍스트 아이템 조인 후 공백 정리
 * - 괄호 앞뒤 공백 제거: "발효계분 (55%)" → "발효계분(55%)"
 * - 슬래시 앞뒤 공백 제거: "견운모 / 고령토" → "견운모/고령토"
 * - 마침표 앞 공백 제거: "경운합니다 ." → "경운합니다."
 */
function cleanDetailText(text) {
  return text
    .replace(/\s+\(/g, '(')              // 여는 괄호 앞 공백 제거: "발효계분 (" → "발효계분("
    .replace(/\(\s+/g, '(')              // 여는 괄호 뒤 공백 제거: "( 55%)" → "(55%)"
    .replace(/\s+\)/g, ')')              // 닫는 괄호 앞 공백 제거: "(55% )" → "(55%)"
    .replace(/\s*\/\s*/g, '/')           // 슬래시 앞뒤 공백 제거: "A / B" → "A/B"
    .replace(/\s+\./g, '.')              // 마침표 앞 공백 제거: "합니다 ." → "합니다."
    .replace(/(\d)\s+([가-힣])/g, '$1$2') // 숫자+한글 단위 공백 제거: "30 분" → "30분", "50 말" → "50말"
    .replace(/\s{2,}/g, ' ')             // 연속 공백 → 단일 공백
    .trim();
}

function parseRxPdfCoords(items) {
  // ── 1. 행으로 묶기 (러닝 평균 Y) ──────────────────────────────────
  const rows = [];
  for (const it of items) {
    const last = rows[rows.length - 1];
    if (last && last.page === it.page && Math.abs(it.y - last.yAvg) <= RX_ROW_Y_MERGE) {
      last.items.push(it);
      last.yAvg = last.items.reduce((s, i) => s + i.y, 0) / last.items.length;
      last.yMax = Math.max(last.yMax, it.y);
    } else {
      rows.push({ y: it.y, yAvg: it.y, yMax: it.y, page: it.page, items: [it] });
    }
  }

  // ── 2. pageTitle 감지 ─────────────────────────────────────────────
  const pageTitles  = {};
  const titleRowSet = new Set();

  // 방법 A: xMin < LEFT_X_MAX && xMax(with w) > LEFT_X_MAX+50 → 전체폭 행
  const pageTopY = {};
  rows.forEach((row, ri) => {
    const pg = row.page;
    if (pageTopY[pg] === undefined) pageTopY[pg] = row.yAvg;
    if (row.yAvg - pageTopY[pg] > 80) return;
    const xMin = Math.min(...row.items.map(it => it.x));
    const xMax = Math.max(...row.items.map(it => it.x + (it.w || it.text.length * 7)));
    if (xMin < RX_LEFT_X_MAX && xMax > RX_LEFT_X_MAX + 50) {
      const titleText = row.items.map(it => it.text).join(' ').trim();
      // 제품 성분 설명 행 제외: 옥스팜/뉴천연팜/옥토팜 등 포함 시 pageTitle 불가
      const isProductDesc = /옥스팜|뉴천연팜|옥토팜|휴믹산|풀빅산|부식산|발효계분|견운모|고령토/.test(titleText);
      if (titleText.length > 3 && !RX_LEFT_TABLE_HDR_RE.test(titleText) && !isProductDesc) {
        pageTitles[pg] = pageTitles[pg] ? pageTitles[pg] + ' ' + titleText : titleText;
        titleRowSet.add(ri);
        console.log(`[Parser v16] page ${pg} pageTitle (A): "${titleText}"`);
      } else if (isProductDesc) {
        // 성분 설명 행은 pageTitle에서 제외하지만 titleRowSet에는 추가해 좌측 아이템 오염 방지
        titleRowSet.add(ri);
      }
    }
  });

  // 방법 B: Y-gap 기반 fallback (단일 아이템 제목행 감지)
  const pageLeftRows = {};
  rows.forEach((row, ri) => {
    if (titleRowSet.has(ri)) return;
    const pg = row.page;
    const hasLeft = row.items.some(it => it.x < RX_LEFT_X_MAX);
    if (!hasLeft) return;
    if (!pageLeftRows[pg]) pageLeftRows[pg] = [];
    pageLeftRows[pg].push({ y: row.yAvg, rowIdx: ri, row });
  });
  Object.entries(pageLeftRows).forEach(([pgStr, entries]) => {
    if (entries.length < 2) return;
    const pg  = parseInt(pgStr);
    const gap = entries[1].y - entries[0].y;
    if (gap <= RX_PAGE_TITLE_Y_GAP) return;
    const { rowIdx, row } = entries[0];
    if (titleRowSet.has(rowIdx)) return;
    if (row.items.some(it => it.x >= RX_LEFT_X_MAX)) return;
    const candidateText = row.items.map(it => it.text).join(' ').trim();
    if (candidateText.length > 10 && !RX_COUNT_UNITS_RE.test(candidateText) &&
        !RX_LEFT_TABLE_HDR_RE.test(candidateText)) {
      pageTitles[pg] = pageTitles[pg] ? pageTitles[pg] + ' ' + candidateText : candidateText;
      titleRowSet.add(rowIdx);
      console.log(`[Parser v16] page ${pg} pageTitle (B Y-gap=${gap}px): "${candidateText}"`);
    }
  });

  // ── 3. 좌/우 분리 (pageTitle 행 제외) ────────────────────────────
  // rightProductItems: 처방 수량 단위(포|병|봉|통|개) 포함 행 → 제품행
  // rightDetailItems: 단위 없는 우측 행 → usage/composition/instruction 후보
  const leftItems = [], rightProductItems = [], rightDetailItems = [];
  rows.forEach((row, ri) => {
    if (titleRowSet.has(ri)) return;
    const leftRow  = row.items.filter(it => it.x < RX_LEFT_X_MAX);
    const rightRow = row.items.filter(it => it.x >= RX_LEFT_X_MAX);

    // 같은 행의 좌측 아이템을 하나로 합쳐 push (개별 문자 분리 방지)
    if (leftRow.length > 0) {
      const rowText = leftRow
        .filter(it => !RX_LEFT_TABLE_HDR_RE.test(it.text.trim()))
        .map(it => it.text)
        .join(' ')
        .trim();
      if (rowText) leftItems.push({ y: row.yAvg, page: row.page, text: rowText });
    }

    if (rightRow.length > 0) {
      // ④ 페이지 하단 푸터 영역 제외 (Y > RX_PAGE_Y_MAX)
      if (row.yAvg > RX_PAGE_Y_MAX) return;

      const rightText = rightRow.map(i => i.text).join(' ');
      if (RX_COUNT_UNITS_RE.test(rightText)) {
        // ── 수량 토큰 위치 기준으로 제품열(좌)/사용법열(우) 분리 ──
        // pdfjs는 x 오름차순으로 항목을 주므로 이미 좌→우 순서
        const sortedRight = rightRow.slice().sort((a, b) => a.x - b.x);
        let qtyIdx = -1;
        for (let ri = 0; ri < sortedRight.length; ri++) {
          if (/^(반)?(포|병|봉|통|개)$/.test(sortedRight[ri].text.trim()) ||
              /^\d+(?:\.\d+)?\s*(포|병|봉|통|개)$/.test(sortedRight[ri].text.trim())) {
            qtyIdx = ri;
            break;
          }
        }
        sortedRight.forEach((it, ri) => {
          if (qtyIdx < 0 || ri <= qtyIdx) {
            // 제품명·규격·수량 → rightProductItems
            rightProductItems.push({ y: row.yAvg, page: row.page, text: it.text });
          } else {
            // 수량 뒤 = 사용법/설명 컬럼 → rightDetailItems (제품명 오염 방지)
            const detailText = cleanDetailText(it.text);
            if (!RX_FOOTER_RE.test(detailText) && detailText.length > 2 &&
                !/^\d+(\.\d+)?(kg|g|L|ml)?$/.test(detailText)) {
              rightDetailItems.push({ y: row.yAvg, page: row.page, text: detailText, xMin: it.x });
            }
          }
        });
      } else {
        // 단위 없는 우측 행: detail 후보 (usage/composition/instruction)
        const detailText = cleanDetailText(rightText);
        // ① 사용법 셀 한정: 업체정보·연락처 제외 (HTML 푸터 레이아웃과 무관)
        if (RX_FOOTER_RE.test(detailText)) return;
        // 단순 숫자·단위·좌표 제외, 의미있는 텍스트만 수집
        // ② 행마다 별도 push → prodDescMap에서 \n 으로 조인되어 줄바꿈 보존
        if (detailText.length > 2 && !/^\d+(\.\d+)?(kg|g|L|ml|㎖|㎏)?$/.test(detailText)) {
          const xMin = rightRow.length > 0 ? Math.min(...rightRow.map(it => it.x)) : 0;
          rightDetailItems.push({ y: row.yAvg, page: row.page, text: detailText, xMin });
        }
      }
    }
  });

  // ── 4. 좌측 덩어리(stage 그룹) 묶기 ─────────────────────────────
  const stageBlocks = [];
  let cur = null;
  for (const li of leftItems) {
    if (!cur || li.page !== cur.page || (li.y - cur.yMax) > RX_STAGE_Y_GAP) {
      cur = { texts: [], yMin: li.y, yMax: li.y, page: li.page };
      stageBlocks.push(cur);
    }
    cur.texts.push(li.text);
    cur.yMax = li.y;
  }

  // ── 4b. 좌측 열 없는 페이지 → 더미 블록 ─────────────────────────
  if (stageBlocks.length === 0) {
    const pageSet = [...new Set(rightProductItems.map(i => i.page))].sort((a, b) => a - b);
    if (pageSet.length === 0) return [];
    pageSet.forEach(pg => {
      const pgItems = rightProductItems.filter(i => i.page === pg);
      const yVals   = pgItems.map(i => i.y);
      stageBlocks.push({ texts: [], yMin: Math.min(...yVals), yMax: Math.max(...yVals), page: pg });
    });
  }

  // ── 4c. orphan 첫 블록 승격 (방법A/B 모두 놓쳤을 때 최후 방어선) ─
  const orphanPromoted = new Set();
  const pageFirstBlock = {};
  stageBlocks.forEach((sb, idx) => {
    if (pageFirstBlock[sb.page] === undefined) pageFirstBlock[sb.page] = idx;
  });
  Object.values(pageFirstBlock).forEach(idx => {
    const sb = stageBlocks[idx];
    // stage_core가 없는 첫 블록 = orphan 후보
    const hasCore = sb.texts.some(t => rxClassifyLeftRow(t) === 'stage_core');
    if (!hasCore && sb.texts.length > 0) {
      // v17: 같은 페이지에 실제 stage_core / date 블록이 있는지 확인
      // 있으면 → 이 블록은 pageTitle로 승격
      // 없으면 → 이 블록이 유일한 stage일 수 있으므로 승격하지 않음
      const pageHasRealStageBlocks = stageBlocks.some((other, otherIdx) => {
        if (otherIdx === idx) return false;
        if (other.page !== sb.page) return false;
        if (orphanPromoted.has(otherIdx)) return false;
        return other.texts.some(t => {
          const type = rxClassifyLeftRow(t);
          return type === 'stage_core' || type === 'date';
        });
      });
      if (!pageHasRealStageBlocks) {
        console.log(`[Parser v17] page ${sb.page} orphan NOT promoted (페이지에 다른 stage 블록 없음): "${sb.texts.join('|')}"`);
        return; // 승격 안 함 — 실제 stage 블록으로 남겨둠
      }
      const orphanText = sb.texts.filter(t => t.trim() && !RX_LEFT_TABLE_HDR_RE.test(t)).join(' ').trim();
      if (orphanText.length > 5) {
        const pg = sb.page;
        pageTitles[pg] = pageTitles[pg] ? pageTitles[pg] + ' ' + orphanText : orphanText;
        orphanPromoted.add(idx);
        console.log(`[Parser v17] page ${pg} pageTitle (orphan promoted): "${orphanText}"`);
      }
    }
  });

  // ── 5. 우측 제품 행 재그룹화 ─────────────────────────────────────
  const productRows = [];
  let lastPR = null;
  for (const ri of rightProductItems) {
    if (!lastPR || lastPR.page !== ri.page || Math.abs(ri.y - lastPR.yAvg) > RX_ROW_Y_MERGE) {
      lastPR = { y: ri.y, yAvg: ri.y, page: ri.page, texts: [] };
      productRows.push(lastPR);
    } else {
      lastPR.texts.push(ri.text);
      const cnt = lastPR.texts.length;
      lastPR.yAvg = (lastPR.yAvg * (cnt - 1) + ri.y) / cnt;
      continue;
    }
    lastPR.texts.push(ri.text);
  }

  // ── 6. stageBlock 배정 헬퍼 (중간값 경계 기반) ──────────────────────
  // 단계 사이 Y 중간값을 경계로 삼아 제품 행을 올바른 단계에 배정
  // 예) 엽면(1번) yMax=207, 관주(2번) yMin=290 → 경계=248.5
  //    y=277 제품 → 경계(248.5) 초과 → 관주(2번) ✓
  function assignToBlock(y, page) {
    // 페이지 내 유효 블록을 yMin 오름차순으로 정렬
    const pageBlocks = [];
    stageBlocks.forEach((sb, idx) => {
      if (orphanPromoted.has(idx)) return;
      if (sb.page !== page) return;
      pageBlocks.push({ idx, yMin: sb.yMin, yMax: sb.yMax });
    });
    if (pageBlocks.length === 0) return -1;
    pageBlocks.sort((a, b) => a.yMin - b.yMin);
    // 각 블록의 상한 = 현재 블록 yMax와 다음 블록 yMin의 중간값
    for (let i = 0; i < pageBlocks.length; i++) {
      const cur  = pageBlocks[i];
      const next = pageBlocks[i + 1];
      const upperBound = next ? (cur.yMax + next.yMin) / 2 : Infinity;
      if (y <= upperBound) return cur.idx;
    }
    return pageBlocks[pageBlocks.length - 1].idx;
  }

  // ── 7. 제품 행 → stageBlock 배정 ─────────────────────────────────
  const blockProducts = stageBlocks.map(() => []);
  productRows.forEach(rr => {
    const idx = assignToBlock(rr.yAvg, rr.page);
    if (idx >= 0) blockProducts[idx].push(rr);
  });

  // ── 7b. 텍스트 전용 페이지 폴백 ─────────────────────────────────────
  // rightProductItems 없는 페이지(텍스트 레이아웃 페이지)에서
  // 좌열 아이템 중 수량단위 포함 행 → 가상의 rightProductItems로 처리
  {
    const pagesWithRightProds = new Set(rightProductItems.map(r => r.page));
    const pagesWithLeftItems  = new Set(leftItems.map(l => l.page));
    pagesWithLeftItems.forEach(pg => {
      if (pagesWithRightProds.has(pg)) return; // 표 페이지는 이미 처리됨
      // 이 페이지의 좌열 아이템 중 수량단위 포함 행 = 제품 행
      const leftPgItems = leftItems.filter(l => l.page === pg);
      leftPgItems.forEach(li => {
        if (!RX_COUNT_UNITS_RE.test(li.text)) return;
        // 수량단위 포함 아이템 → 가상 productRow로 등록
        rightProductItems.push({ y: li.y, page: li.page, text: li.text });
      });
    });
    // productRows를 다시 빌드 (추가된 항목 포함)
    productRows.length = 0;
    let lastPR2 = null;
    const sortedRPI = rightProductItems.slice().sort((a, b) => a.page - b.page || a.y - b.y || a.x - b.x);
    for (const ri of sortedRPI) {
      if (!lastPR2 || lastPR2.page !== ri.page || Math.abs(ri.y - lastPR2.yAvg) > RX_ROW_Y_MERGE) {
        lastPR2 = { y: ri.y, yAvg: ri.y, page: ri.page, texts: [] };
        productRows.push(lastPR2);
      } else {
        const cnt = lastPR2.texts.length;
        lastPR2.yAvg = (lastPR2.yAvg * cnt + ri.y) / (cnt + 1);
      }
      lastPR2.texts.push(ri.text);
    }
    // blockProducts 재배정
    blockProducts.forEach(b => b.length = 0);
    productRows.forEach(rr => {
      const idx = assignToBlock(rr.yAvg, rr.page);
      if (idx >= 0) blockProducts[idx].push(rr);
    });
  }

  // ── 8. detail 행 → stageBlock 배정 (Y 포함 객체 보존) ──────────────
  const blockDetailItems = stageBlocks.map(() => []);
  rightDetailItems.forEach(di => {
    const idx = assignToBlock(di.y, di.page);
    if (idx >= 0) blockDetailItems[idx].push({ y: di.y, text: di.text, xMin: di.xMin || 0 });
  });

  // ── 9. pageTitles에서 평수 추출 ──────────────────────────────────
  const pageTitleAreas = {};
  Object.entries(pageTitles).forEach(([pg, title]) => {
    const m = title.match(/[（\(](\d+)\s*평[）\)]/);
    if (m) pageTitleAreas[parseInt(pg)] = Number(m[1]);
  });

  // ── 10. stage 생성 ─────────────────────────────────────────────────
  const stages = [];
  stageBlocks.forEach((sb, idx) => {
    if (orphanPromoted.has(idx)) return;
    const assigned = blockProducts[idx];
    if (!assigned.length) return;

    // stageRawCell: 좌측 셀 원문 전체 (중복 제거 후 줄바꿈 보존)
    const dedupedTexts = sb.texts.filter((t, i, arr) => i === 0 || t !== arr[i - 1]);
    const stageRawCell = dedupedTexts.join('\n').trim();

    // stageDisplayText (표시용): 전체 좌측 텍스트 (note 필터 제거 — "3월 4월" 등 날짜 보존)
    const noteLines = dedupedTexts.filter(t => rxClassifyLeftRow(t) === 'note');
    const stageDisplayText = dedupedTexts.join('\n').trim();

    // detailCellRaw: 이 stage 전체 detail 텍스트 (stageMeta용)
    const detailCellRaw = blockDetailItems[idx].map(d => d.text).join('\n').trim();
    const detailCellType = (typeof classifyDetailCell === 'function')
      ? classifyDetailCell(detailCellRaw)
      : (detailCellRaw ? 'instruction' : 'empty');

    // ── Y 기반 detail → 제품별 배정 (경계선 방식: 다음 제품 Y 직전까지) ──
    // detail 아이템을 Y 오름차순 정렬
    const sortedDetailObjs = blockDetailItems[idx]
      .map((di, i) => ({ y: di.y, text: di.text, xMin: di.xMin || 0, _id: i }))
      .sort((a, b) => a.y - b.y);
    // 제품 행을 Y 오름차순 정렬
    const sortedProdRows = assigned.slice().sort((a, b) => a.yAvg - b.yAvg);
    // 제품별 detail 라인 버킷 초기화
    const prodDescMap = new Map();
    sortedProdRows.forEach(rr => prodDescMap.set(rr.yAvg, []));
    // 각 detail 아이템 → "가장 가까운 위쪽 제품" 배정
    // 핵심: break 없이 끝까지 순회하여 조건을 만족하는 마지막(가장 아래) 제품을 선택
    // → 오버랩 구간에서 항상 더 아래(더 가까운) 제품이 이김
    const DETAIL_Y_BUFFER = 20; // 제품명보다 최대 20px 위에 있는 설명도 해당 제품으로 허용
    sortedDetailObjs.forEach(di => {
      let assignedRr = sortedProdRows[0]; // 기본: 첫 번째 제품 (설명이 맨 위에 있을 때)
      for (const rr of sortedProdRows) {
        if (rr.yAvg - DETAIL_Y_BUFFER <= di.y) {
          assignedRr = rr; // 조건 만족 시 계속 갱신 (break 없음 — 마지막 매칭이 최종)
        }
      }
      prodDescMap.get(assignedRr.yAvg).push({ y: di.y, text: di.text, xMin: di.xMin || 0 });
    });

    // 제품 파싱
    const products = [];
    assigned.forEach(rr => {
      const line = rr.texts.join(' ');
      const halfM  = line.match(/반\s*(포|병|봉|통|개)/);
      const countM = line.match(/(\d+(?:\.\d+)?)\s*(포|병|봉|통|개)/);
      if (!halfM && !countM) return;

      const qty  = halfM ? 0.5 : Number(countM[1]);
      const unit = halfM ? halfM[1] : countM[2];

      // prodArea: N평 추출 (제거 전에 저장)
      const prodAreaM = line.match(/(\d+(?:\.\d+)?)\s*평/);
      const prodArea  = prodAreaM ? Number(prodAreaM[1]) : null;

      // ── capacity(용량) 추출: namePart 정제 전에 먼저 저장 ──────────
      // 예) "1kg", "500g", "10L", "500ml", "1ℓ" → capacity 필드
      const capacityM = line.match(/(\d+(?:\.\d+)?)\s*(L|ℓ|ml|㎖|kg|g|㎏|cc)\b/i);
      const capacity  = capacityM ? capacityM[0].replace(/\s+/g, '').toUpperCase()
                                                 .replace('ML','ml').replace('L','L')
                                  : '';

      const namePart = line
        .replace(/반\s*(포|병|봉|통|개)/g, '')
        .replace(/\d+(?:\.\d+)?\s*(포|병|봉|통|개)/g, '')
        .replace(/\d+(?:\.\d+)?\s*평/g, '')
        .replace(/\d+(?:\.\d+)?\s*(kg|g|L|ml|ℓ|㎖|㎏|cc)/gi, '')
        .replace(/\s+/g, ' ').trim();

      console.log(`[Capacity Check] 제품: ${namePart || line} | 추출된 용량: ${capacity || '(없음)'} | 원본: ${line}`);

      if (namePart.length <= 1) return;

      const sizeM = namePart.match(/^(.+?)\s*[\(（](.+?)[\)）]$/);
      const key   = sizeM
        ? `${sizeM[1].trim()}||${sizeM[2].trim()}`
        : `${namePart}||`;

      // 이 제품 행에 배정된 detail 텍스트 — word-wrap 감지: x시작이 같으면(≤12px) space로 연결
      const rawItems = (prodDescMap.get(rr.yAvg) || []).filter(it => it.text && it.text.trim());
      const prodDesc = (() => {
        if (!rawItems.length) return '';
        const lines = [];
        let cur = rawItems[0].text.trim();
        for (let k = 1; k < rawItems.length; k++) {
          const prev = rawItems[k - 1], curr = rawItems[k];
          const xDiff = Math.abs((curr.xMin || 0) - (prev.xMin || 0));
          const yGap  = curr.y - prev.y;
          if (xDiff <= 12 && yGap <= 35) {
            cur += ' ' + curr.text.trim();   // word-wrap → 공백으로 연결
          } else {
            lines.push(cur); cur = curr.text.trim();
          }
        }
        lines.push(cur);
        return lines.filter(l => l).join('\n');
      })();

      products.push({
        key, qty, unit,
        capacity,              // 용량: "1kg", "500g", "10L" 등
        // 새 필드
        productTextRaw: line,
        productName: namePart,
        detailCellRaw: prodDesc,
        detailCellType: prodDesc ? detailCellType : 'empty',
        prodArea,
        // 하위 호환
        desc: prodDesc || '',
      });
    });

    // area 우선순위
    const allProdAreas = products.map(p => p.prodArea).filter(Boolean);
    const areaFreq = {};
    allProdAreas.forEach(a => { areaFreq[a] = (areaFreq[a] || 0) + 1; });
    const dominantProdArea = allProdAreas.length
      ? Number(Object.entries(areaFreq).sort((a, b) => b[1] - a[1])[0][0])
      : null;
    const area = dominantProdArea || pageTitleAreas[sb.page] || null;

    const inferredType = detectTypeFromParsedLabel(stageDisplayText, products);

    stages.push({
      // ── 핵심 분리 필드 (pageTitle과 절대 분리) ──
      stageRawCell,           // 원문 병합 셀 (줄바꿈 보존)
      stageDisplayText,       // 표시용 (core 행만)
      stageMeta: {
        notes: noteLines.join('\n'),
        rawTexts: dedupedTexts,
        detailCellRaw,
        detailCellType,
      },
      // ── 하위 호환 ──
      // v17: stageRawCell이 아닌 stageDisplayText 사용 — stageRawCell에 오염 방지
      stageLabelOverride: stageDisplayText || '',
      stageLabel: '',
      pageTitle: pageTitles[sb.page] || '',  // groupLabel 전용, stageLabel과 절대 분리
      type: inferredType,
      month: 0,
      sourcePage: sb.page,
      pageGroup: 1000 + sb.page,
      pageType: inferredType,
      days: '', dateRange: '', purpose: '',
      funcTags: [], funcColor: '#ffffff',
      typeNumOverride: 0, typeNumWord: '',
      area,
      products
    });

    console.log(`[Parser v20] page=${sb.page} stageDisplayText="${stageDisplayText.replace(/\n/g,'|')}" | products=${products.length} | area=${area}`);
    products.forEach((p, pi) => {
      console.log(`  [v20] product[${pi}] name="${p.productName}" descLen=${p.desc.length} desc="${p.desc.replace(/\n/g,'↵')}"`);
    });
  });

  return stages.filter(s => s.products.length > 0);
}

// ── PDF 비용 페이지 인라인 추출 ────────────────────────────────────────────
// pdfParser.js와 별개로, 처방전.html 내에서 직접 pdfDoc에서 비용 정보를 추출한다.
const _COST_KW       = ['소매가','공급가','단가','합계','총액','금액','계','평당'];
const _COST_KW_MIN   = 3;

/**
 * 행 아이템 배열을 텍스트로 합친다 (extractRxPdfCoords와 독립적으로 동작).
 * @param {{ text:string, x:number }[]} items
 * @returns {string}
 */
function _joinRowTextInline(items) {
  if (!items.length) return '';
  const sorted = [...items].sort((a, b) => a.x - b.x);
  let out = sorted[0].text;
  for (let i = 1; i < sorted.length; i++) {
    out += ' ' + sorted[i].text;
  }
  return out.trim();
}

/**
 * 페이지 텍스트 배열이 비용 요약 페이지인지 판별한다.
 * @param {string[]} texts
 * @returns {boolean}
 */
function _isCostPage(texts) {
  const all = texts.join(' ');
  return _COST_KW.filter(kw => all.includes(kw)).length >= _COST_KW_MIN;
}

/**
 * 비용 페이지에서 totalCost, unitPricePerPyeong, breakdown을 추출한다.
 * @param {string[]} texts — 행별 텍스트 배열 (Object.values(rowMap) 순서 — 소문자 Y 오름차순, 즉 페이지 하단부터)
 * @returns {{ totalCost:number|null, unitPricePerPyeong:number|null, breakdown:Array }}
 */
function _extractCostFromTexts(texts) {
  const PYEONG_RE = /평\s*당/;
  const TOTAL_RE  = /합\s*계|총\s*액|총\s*계|총\s*금\s*액/;
  const LABEL_RE  = /^(기비용|합\s*계|총\s*계|총\s*액|(\d{1,2})\s*월)/;
  let totalCost = null, unitPrice = null, totalRowUnitPrice = null;
  const breakdown = [];

  for (const text of texts) {
    const nums = () => (text.match(/[\d,]+/g) || [])
      .map(n => parseInt(n.replace(/,/g, ''), 10))
      .filter(n => !isNaN(n));

    const isTotal  = TOTAL_RE.test(text);
    const hasPyeong = PYEONG_RE.test(text);

    if (hasPyeong) {
      const ns = nums().filter(n => n > 100 && n < 10_000_000);
      if (ns.length) {
        unitPrice = ns[ns.length - 1];
        // 합계 행의 평당가 → 최우선 확정값으로 보존 (기비용 행이 나중에 덮어쓰지 못하도록)
        if (isTotal) totalRowUnitPrice = unitPrice;
      }
    }
    if (isTotal) {
      const ns = nums().filter(n => n > 10_000);
      if (ns.length) { const mx = Math.max(...ns); if (!totalCost || mx > totalCost) totalCost = mx; }
    }

    // 행별 breakdown 추출 (기비용 / N월 / 합계 행)
    const labelMatch = text.match(LABEL_RE);
    if (labelMatch) {
      // 공백 제거 정규화: "3 월" → "3월", "합 계" → "합계"
      const lbl      = labelMatch[1].replace(/\s+/g, '');
      const bigNums  = nums().filter(n => n >= 10_000);
      const smallNums = nums().filter(n => n > 100 && n < 10_000);
      if (bigNums.length) {
        const rowCost  = Math.max(...bigNums);
        const rowUnit  = hasPyeong && smallNums.length ? smallNums[smallNums.length - 1] : null;
        // 중복 레이블 방지
        if (!breakdown.find(r => r.label === lbl)) {
          breakdown.push({ label: lbl, cost: rowCost, unitPrice: rowUnit });
        }
      }
    }
  }

  // 합계 행에서 평당가 추출 성공 시 우선 사용 (rowMap 정렬로 인해 기비용 행이 마지막으로 처리되어
  // unitPrice가 1,454로 덮어쓰이는 버그를 방지)
  if (totalRowUnitPrice !== null) unitPrice = totalRowUnitPrice;

  // 합계 행 없으면 큰 숫자 중 최대값을 totalCost 후보로
  if (!totalCost) {
    const candidates = texts.flatMap(t =>
      (t.match(/[\d,]+/g) || []).map(n => parseInt(n.replace(/,/g,''),10)).filter(n => n >= 50_000 && n < 100_000_000)
    );
    if (candidates.length) totalCost = Math.max(...candidates);
  }

  // breakdown 정렬: 기비용 → N월 오름차순 → 합계
  breakdown.sort((a, b) => {
    const rank = l => {
      if (l === '기비용') return 0;
      const m = l.match(/^(\d+)월$/);
      if (m) return parseInt(m[1]);
      return 99;
    };
    return rank(a.label) - rank(b.label);
  });

  return { totalCost, unitPricePerPyeong: unitPrice, breakdown };
}

/**
 * pdfDoc을 스캔해 비용 페이지를 감지하고 데이터를 반환한다.
 * @param {object} pdfDoc — pdf.js 문서 객체
 * @returns {Promise<{ totalCost:number|null, unitPricePerPyeong:number|null, isCalculated:boolean }|null>}
 */
async function extractCostFromPdfDoc(pdfDoc) {
  const totalPages = Math.min(pdfDoc.numPages, 10);
  for (let p = 1; p <= totalPages; p++) {
    const page  = await pdfDoc.getPage(p);
    const tc    = await page.getTextContent();
    const texts = [];
    // 행으로 묶기 (Y 좌표 기준 ±8px)
    const rowMap = {};
    tc.items.forEach(it => {
      if (!it.str.trim()) return;
      const y = Math.round(it.transform[5]);
      const key = Object.keys(rowMap).find(k => Math.abs(parseInt(k) - y) <= 8);
      if (key) rowMap[key] += ' ' + it.str;
      else      rowMap[y]   = it.str;
    });
    Object.values(rowMap).forEach(t => t.trim() && texts.push(t.trim()));

    if (!_isCostPage(texts)) continue;

    console.log(`[CostExtract] page ${p} → 비용 페이지 감지`);
    const raw = _extractCostFromTexts(texts);
    const area = parseFloat(document.getElementById('bArea')?.value) || 0;

    let isCalculated = false;
    if (!raw.unitPricePerPyeong && raw.totalCost && area > 0) {
      raw.unitPricePerPyeong = Math.round(raw.totalCost / area);
      isCalculated = true;
    }

    console.log('[CostExtract] 결과:', raw);
    return { ...raw, isCalculated, breakdown: raw.breakdown || [] };
  }
  return null;
}

// 처방전 파일명에서 고객명·작물·평수 파싱 (표지가 이미지여서 pdfParser 파싱 불가)
function _parseRxFilenameInfo(filename) {
  const base = filename.replace(/\.pdf$/i, '');
  const result = { farmName: null, cropName: null, totalArea: null };
  const areaMatch = base.match(/\((\d+)평\)/);
  if (areaMatch) result.totalArea = parseInt(areaMatch[1], 10);
  const cropMatch = base.match(/([가-힣]+)\s*\(\d+평\)/);
  if (cropMatch) result.cropName = cropMatch[1];
  const nameMatches = [...base.matchAll(/([가-힣]{2,6})님/g)];
  if (nameMatches.length > 0) {
    result.farmName = nameMatches[nameMatches.length - 1][1];
  } else if (result.cropName) {
    const beforeCrop = base.replace(/\s*[가-힣]+\s*\(\d+평\).*/, '').trim();
    const fallbackMatch = beforeCrop.match(/([가-힣]{2,8})\s*$/);
    if (fallbackMatch) result.farmName = fallbackMatch[1];
  }
  return result;
}

// PDF 표지(1페이지) 텍스트에서 고객명·작물·평수 추출
// 표지 형식: "[작물] ([평수] 평) 농사 처방전 : [고객명]님"
async function _parseCoverPageInfo(pdfDoc) {
  const result = { farmName: null, cropName: null, totalArea: null };
  try {
    const page = await pdfDoc.getPage(1);
    const tc = await page.getTextContent();
    const tokens = tc.items.map(it => it.str.trim()).filter(Boolean);
    const joined = tokens.join(' ');
    // 고객명: "처방전 : XXX님" 또는 "처방전: XXX님"
    const nameMatch = joined.match(/처방전\s*:\s*([가-힣]{2,8})님?/);
    if (nameMatch) result.farmName = nameMatch[1].replace(/님$/, '');
    // 작물: 평수 앞에 오는 한글
    const cropMatch = joined.match(/([가-힣]{2,8})\s*\(\s*(\d+)\s*평\s*\)/);
    if (cropMatch) {
      result.cropName = cropMatch[1];
      result.totalArea = parseInt(cropMatch[2], 10);
    }
    // 평수만 있는 경우 fallback
    if (!result.totalArea) {
      const areaMatch = joined.match(/\(\s*(\d+)\s*평\s*\)/);
      if (areaMatch) result.totalArea = parseInt(areaMatch[1], 10);
    }
  } catch (e) { /* 표지 파싱 실패는 무시 */ }
  return result;
}

async function onRxPdfSelected(input) {
  const file = input.files[0];
  if (!file) return;
  input.value = '';
  showRxToast('PDF 분석 중...');

  try {
    // Safari DataCloneError 방지: File 객체 대신 순수 ArrayBuffer를 전달
    const arrayBuffer = await file.arrayBuffer();
    // pdfDoc을 한 번만 로드 — ArrayBuffer 이중 전송 방지
    const pdfDoc  = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;

    // 표지(1페이지)에서 고객명·작물·평수 추출 — 파일명 의존 제거
    const coverInfo = await _parseCoverPageInfo(pdfDoc);
    function _applyCoverField(domId, value, rxKey) {
      if (!value) return;
      const el = document.getElementById(domId);
      if (!el) return;
      if (domId === 'bCrop') {
        // select 요소: option 텍스트 매칭
        for (let i = 0; i < el.options.length; i++) {
          if (el.options[i].text.includes(value) || value.includes(el.options[i].text)) {
            el.selectedIndex = i; break;
          }
        }
      } else {
        el.value = value;
      }
      rxData[rxKey] = domId === 'bCrop' ? (el.value || value) : value;
    }
    _applyCoverField('bName',   coverInfo.farmName,  'name');
    _applyCoverField('bCrop',   coverInfo.cropName,  'crop');
    if (coverInfo.totalArea) {
      _applyCoverField('bArea', String(coverInfo.totalArea), 'area');
    }

    // 1순위: ##RX## 인코딩 데이터 (자체 처방전 PDF) — 이미 로드된 pdfDoc 재사용
    const pageTxts = [];
    for (let i = 1; i <= pdfDoc.numPages; i++) {
      const page = await pdfDoc.getPage(i);
      const tc   = await page.getTextContent();
      pageTxts.push(tc.items.map(it => it.str).join(' '));
    }
    const compact = pageTxts.join(' ').replace(/\s+/g, '');
    const rxm     = compact.match(/##RX##([A-Za-z0-9+/=%]+)##RX##/);
    if (rxm) {
      const d = JSON.parse(decodeURIComponent(atob(rxm[1])));
      applyRxData(d);
      showRxToast('처방전 불러오기 완료 ✓');
      return;
    }

    // 2순위: 좌표 기반 파싱 (외부 처방전 PDF) — 동일 pdfDoc 재사용
    const items   = await extractRxPdfCoords(pdfDoc);
    const parsed  = parseRxPdfCoords(items);

    // 비용 페이지 추출 (처방 단계 파싱과 독립적으로 실행)
    const costExtracted = await extractCostFromPdfDoc(pdfDoc);
    if (costExtracted) {
      rxData.extractedTotalCost  = costExtracted.totalCost;
      rxData.extractedUnitPrice  = costExtracted.unitPricePerPyeong;
      rxData.extractedBreakdown  = costExtracted.breakdown || [];
      _saveRxStages();
      const priceStr = costExtracted.unitPricePerPyeong
        ? costExtracted.unitPricePerPyeong.toLocaleString() + '원/평'
        : '(계산 불가)';
      const calcNote = costExtracted.isCalculated ? ' (자동계산)' : '';
      showRxToast(`💰 비용 페이지 인식 — 평당 ${priceStr}${calcNote}`, 4000);
      // 추출된 평당가를 미리보기(비용 페이지)에 즉시 자동 반영
      schedulePreview();
      // 비용 모달이 열려 있으면 즉시 갱신
      if (document.getElementById('costOverlay')?.classList.contains('on')) {
        showCostModal();
      }
    }

    if (parsed.length > 0) {
      stageIdCnt = 0;
      stages = parsed.map(s => ({ ...s, id: ++stageIdCnt }));

      // AUTO-02: 단계 area 빈도 분석으로 totalArea 추론 → bArea 자동 기입
      const areaFreq = {};
      stages.forEach(s => { if (s.area) areaFreq[s.area] = (areaFreq[s.area] || 0) + 1; });
      const inferredArea = Object.entries(areaFreq).sort((a, b) => b[1] - a[1])[0]?.[0];
      if (inferredArea) {
        const bAreaEl = document.getElementById('bArea');
        if (bAreaEl && !bAreaEl.value) { bAreaEl.value = inferredArea; }
        if (!rxData.area) rxData.area = String(inferredArea);
      }

      // 제품 키 정규화: cart와 공백·특수문자 차이 보정
      _normalizeStageProductKeys(stages);
      // cart가 비어 있으면 stage 제품에서 자동 생성 → 재고 현황 즉시 표시
      _autoCartFromStages(stages);
      syncGroupOrder();
      renderStages();
      renderInventory();   // ← 재고 현황 즉시 갱신
      schedulePreview();
      _saveRxStages();
      showRxToast(`처방전 파싱 완료 — ${parsed.length}단계 인식`);
    } else if (!costExtracted) {
      alert('처방 단계를 인식하지 못했습니다.\n텍스트 레이어가 없는 스캔 PDF는 지원되지 않습니다.');
    }
  } catch (e) {
    console.error('RX PDF 오류:', e);
    alert('PDF 처리 중 오류가 발생했습니다.');
  }
}

// ── ##RX## 데이터 적용 ──
function applyRxData(d) {
  rxData = {
    name: d.n||'', region: d.rg||'', area: d.ar||'', crop: d.cr||'', areaType: d.at||'농사',
    cart: (d.cart||[]).map(c => ({ name:c[0], size:c[1], qty:Math.ceil(c[2]||1), retail:c[3]||0, sp:c[4]||0 }))
  };

  // 빌더 입력 채우기
  document.getElementById('bName').value = d.n || '';
  document.getElementById('bRegion').value = d.rg || '';
  document.getElementById('bArea').value = d.ar || '';
  if (d.cr) {
    const sel = document.getElementById('bCrop');
    for (let i = 0; i < sel.options.length; i++) {
      if (sel.options[i].value === d.cr) { sel.selectedIndex = i; break; }
    }
  }
  // areaType
  const at = d.at || '농사';
  const stdTypes = ['농사','하우스','노지'];
  const atSel = document.getElementById('bAreaType');
  if (stdTypes.includes(at)) {
    atSel.value = at;
    document.getElementById('bAreaTypeDirect').style.display = 'none';
  } else {
    atSel.value = '직접입력';
    document.getElementById('bAreaTypeDirect').style.display = 'block';
    document.getElementById('bAreaTypeDirect').value = at;
  }

  // stages 복원
  stageIdCnt = 0;
  stages = (d.st||[]).map(s => ({
    id: ++stageIdCnt, month: s.m||0, pageGroup: s.pg ?? null, sourcePage: s.sp ?? null, pageType: s.pt || '', type: s.t||'', days: s.d||'',
    dateRange: s.dr||'', purpose: s.p||'', funcTags: s.ft||[], funcColor: s.fc||'#ffffff',
    typeNumOverride: s.to||0, typeNumWord: s.tw||'',
    stageLabelOverride: s.sl||'', stageLabel: s.lb||'',
    // v18: 표시 텍스트 3종 복원
    stageDisplayText: s.sdt||'', stageRawCell: s.src||'', stageDisplayOverride: s.sdo||'',
    products: (s.pr||[]).map(p => {
      let desc = p[3] || '';
      if (!desc && s.t !== '엽면') {
        const prodName = (p[0]||'').split('||')[0];
        const mk = Object.keys(PRODUCT_DEFAULT_DESCS).find(k => prodName.includes(k));
        if (mk) desc = PRODUCT_DEFAULT_DESCS[mk];
      }
      return { key:p[0], qty:p[1]||0, unit:p[2]||'개', desc, prodArea:p[4]||null, capacity:p[5]||'' };
    }),
    area: s.a||null
  }));

  pageOrder = d.po || [];
  costVisible = d.cv || false;
  if (d.po2) priceOverrides = d.po2;
  if (d.gl) groupLabels = d.gl;
  if (d.go) stageGroupOrder = d.go;

  // rxStages 단일 저장소에 모든 상태 저장 (rxData 키는 index.html 전달 전용이므로 쓰지 않음)
  _saveRxStages();

  renderStages();
  renderInventory();
  schedulePreview();
}

// ── 외부 PDF 텍스트 파싱 (페이지별 처리) ──
function parseRxPdfText(pageTexts) {
  // 문자열 하나면 배열로 감싸기 (하위호환)
  if (typeof pageTexts === 'string') pageTexts = pageTexts.split('\n\n').filter(Boolean);

  // ── pdfjs 토큰 병합 전처리 ──
  // 브라우저 pdfjs가 분리한 토큰을 재결합: 옥토팜 ( 펠렛 ) → 옥토팜(펠렛), 10 L → 10L, 반 통 → 반통 등
  pageTexts = pageTexts.map(pg => {
    const toks = pg.split(/\s+/).filter(Boolean);
    const out = [];
    for (let i = 0; i < toks.length; ) {
      const t0=toks[i], t1=toks[i+1]||'', t2=toks[i+2]||'', t3=toks[i+3]||'';
      // word + ( + content + ) → word(content)  [예: 옥토팜 ( 펠렛 ) → 옥토팜(펠렛)]
      if (t1==='(' && t3===')' && t2 && !/^\d/.test(t2) && /[가-힣A-Za-z]/.test(t2)) {
        out.push(t0+'('+t2+')'); i+=4;
      // N + 평 → N평
      } else if (/^\d+$/.test(t0) && t1==='평') {
        out.push(t0+'평'); i+=2;
      // N + 부피/무게단위 → N단위  [예: 10 L → 10L, 500 g → 500g]
      } else if (/^\d+(?:\.\d+)?$/.test(t0) && /^(kg|g|L|ml|cc|리터)$/i.test(t1)) {
        out.push(t0+t1); i+=2;
      // N + 수량단위 → N수량단위  [예: 30 포 → 30포, 1 봉 → 1봉]
      } else if (/^\d+(?:\.\d+)?$/.test(t0) && /^(봉|병|통|포|개|팩|박스|캔)$/.test(t1)) {
        out.push(t0+t1); i+=2;
      // 반 + 수량단위 → 반수량단위  [예: 반 통 → 반통, 반 병 → 반병]
      } else if (t0==='반' && /^(봉|병|통|포|개|팩|박스)$/.test(t1)) {
        out.push('반'+t1); i+=2;
      } else { out.push(t0); i++; }
    }
    return out.join(' ');
  });

  const result = { name:'', region:'', area:'', crop:'', areaType:'농사', stages:[], cart:[] };
  const allText = pageTexts.join('\n');

  // ── 표지 파싱 (전체 텍스트에서) ──
  const rxNameM = allText.match(/처방전\s*[:\uff1a]\s*([가-힣]+?)님?(?:\s|$)/);
  if (rxNameM) result.name = rxNameM[1];
  if (!result.name) {
    const altNameM = allText.match(/[가-힣]+\s*[:\uff1a]\s*([가-힣]{2,})님/);
    if (altNameM) result.name = altNameM[1];
  }

  const regionM = allText.match(/(전북|전남|충북|충남|경북|경남|강원|제주|서울|경기|인천|대전|대구|광주|부산|울산|세종)\s*[:\uff1a]?\s*([가-힣()（）]*)/);
  if (regionM) result.region = regionM[2] ? regionM[1] + ':' + regionM[2].replace(/[()（）]/g,'') : regionM[1];
  if (!result.region) {
    const cityM = allText.match(/(천안|익산|청주|진천|제주|서귀포|전주|군산|김제|남원|순천|여수|목포|안동|포항|구미|창원|김해|거제|춘천|원주|강릉|속초|평택|화성|용인|수원|성남|고양|파주)\s*[:\uff1a]?\s*([가-힣()（）]*)/);
    if (cityM) result.region = cityM[2] ? cityM[1] + ':' + cityM[2].replace(/[()（）]/g,'') : cityM[1];
  }

  const cropList = '고추|감자|마늘|양파|배추|딸기|수박|참외|토마토|포도|사과|배|감귤|블루베리|인삼|메론|멜론|오이|호박|깻잎|상추|레드향|샤인|한라봉|천혜향|레몬|무|당근|시금치|부추|파|생강|고구마|옥수수';
  const cropRe = new RegExp('(' + cropList + ')\\s*[\\(（]?\\s*(\\d+)\\s*평\\s*[\\)）]?\\s*(농사|하우스|노지)?');
  const cropM = allText.match(cropRe);
  if (cropM) {
    result.crop = cropM[1]; result.area = cropM[2];
    if (cropM[3]) result.areaType = cropM[3];
  } else {
    const cropOnly = allText.match(new RegExp('(' + cropList + ')\\s*[\\(（]\\s*(농사|하우스|노지)\\s*[\\)）]'));
    if (cropOnly) { result.crop = cropOnly[1]; result.areaType = cropOnly[2]; }
  }

  // ── 단계+제품 파싱 (PDF 페이지별 처리 — 원본 장수 유지) ──
  const productMap = {};
  const noiseNames = new Set(['발효계분','종합광물','휴믹산','풀빅산','부식산','미강','만나','유기물','물량','평수','합계','소계','총계']);

  function _extractProds(section, stage, defaultDesc) {
    let pm;
    // Pattern A: 이름(형태) [중량] [N평] N수량unit  (예: 옥토팜(펠렛) 20kg 50포, 천연팜(분상) 400평 20포)
    const reA = /([가-힣A-Za-z0-9+\-]{2,})\s*[\(（]\s*([가-힣A-Za-z0-9\-]{2,})\s*[\)）]\s+(?:\d+(?:\.\d+)?\s*(?:kg|g|L|ml|cc|리터)\s+)?(?:\d+\s*평\s+)?(\d+(?:\.\d+)?)\s*(포|병|봉|개|팩|박스|통)/g;
    while ((pm = reA.exec(section)) !== null) {
      const name = pm[1], size = pm[2], qty = parseFloat(pm[3])||1, unit = pm[4];
      if (/[%/]/.test(size)) continue;
      if (noiseNames.has(name) || noiseNames.has(size)) continue;
      const key = name + '||' + size;
      if (!stage.products.find(p => p.key === key)) {
        stage.products.push({ key, qty, unit, desc: defaultDesc || '' });
        if (!productMap[key]) productMap[key] = { name, size, qty: 0 };
        productMap[key].qty += qty;
      }
    }
    // Pattern A2: 이름(형태) [N평] 반unit  (예: 지오팜(분상) 550평 반통, 옥토팜(펠렛) 반포)
    const reA2 = /([가-힣A-Za-z0-9+\-]{2,})\s*[\(（]\s*([가-힣A-Za-z0-9\-]{2,})\s*[\)）]\s+(?:\d+\s*평\s+)?반(포|병|봉|개|팩|박스|통)/g;
    while ((pm = reA2.exec(section)) !== null) {
      const name = pm[1], size = pm[2], unit = pm[3];
      if (/[%/]/.test(size)) continue;
      if (noiseNames.has(name) || noiseNames.has(size)) continue;
      const key = name + '||' + size;
      if (!stage.products.find(p => p.key === key)) {
        stage.products.push({ key, qty: 0.5, unit, desc: defaultDesc || '' });
        if (!productMap[key]) productMap[key] = { name, size, qty: 0 };
        productMap[key].qty += 0.5;
      }
    }
    const reB = /([가-힣A-Za-z0-9+\-]{2,})\s+(\d+(?:\.\d+)?)\s*(ml|cc|L|g|kg|리터)\s+(\d+(?:\.\d+)?)\s*(포|병|봉|개|팩|박스|통)/gi;
    while ((pm = reB.exec(section)) !== null) {
      let name = pm[1], size = pm[2] + pm[3], qty = parseFloat(pm[4])||1, unit = pm[5];
      if (/^(경운|정식|관주|엽면|첫물|두덕|살포|수확)/.test(name)) continue;
      if (noiseNames.has(name)) continue;
      const beforeM = section.slice(0, pm.index).trimEnd().match(/([가-힣+]{2,})$/);
      if (beforeM && /^[A-Za-z0-9\-]/.test(name)) name = beforeM[1] + name;
      const key = name + '||' + size;
      if (!stage.products.find(p => p.key === key)) {
        stage.products.push({ key, qty, unit, desc: defaultDesc || '' });
        if (!productMap[key]) productMap[key] = { name, size, qty: 0 };
        productMap[key].qty += qty;
      }
    }
    const reD = /([가-힣A-Za-z0-9+\-]{2,})\s+(\d+(?:\.\d+)?)\s*(ml|cc|L|g|kg|리터)\s+반(포|병|봉|개|팩|박스|통)/gi;
    while ((pm = reD.exec(section)) !== null) {
      let name = pm[1], size = pm[2] + pm[3], unit = pm[4];
      if (/^(경운|정식|관주|엽면|살포|수확)/.test(name)) continue;
      if (noiseNames.has(name)) continue;
      const key = name + '||' + size;
      if (!stage.products.find(p => p.key === key)) {
        stage.products.push({ key, qty: 0.5, unit, desc: defaultDesc || '' });
        if (!productMap[key]) productMap[key] = { name, size, qty: 0 };
        productMap[key].qty += 0.5;
      }
    }
    // Pattern E: 이름(단위) 반unit  (예: 양자식물에너지(500ml) 반병)
    const reE = /([가-힣A-Za-z0-9+\-]{2,})\s*[\(（]\s*(\d+(?:\.\d+)?(?:ml|cc|L|g|kg|리터))\s*[\)）]\s+반(포|병|봉|개|팩|박스|통)/gi;
    while ((pm = reE.exec(section)) !== null) {
      let name = pm[1]; const size = pm[2], unit = pm[3];
      if (/^(경운|정식|관주|엽면|살포|수확)/.test(name)) continue;
      if (noiseNames.has(name)) continue;
      const key = name + '||' + size;
      if (!stage.products.find(p => p.key === key)) {
        stage.products.push({ key, qty: 0.5, unit, desc: defaultDesc || '' });
        if (!productMap[key]) productMap[key] = { name, size, qty: 0 };
        productMap[key].qty += 0.5;
      }
    }
    const reC = /([가-힣A-Za-z0-9+\-]{2,})\s*[\(（]\s*([가-힣A-Za-z0-9\-]{2,})\s*[\)）]\s+\d+\s*평\s+없음/g;
    while ((pm = reC.exec(section)) !== null) {
      const name = pm[1], size = pm[2];
      if (/[%/]/.test(size)) continue;
      if (noiseNames.has(name) || noiseNames.has(size)) continue;
      const key = name + '||' + size;
      if (!stage.products.find(p => p.key === key)) {
        stage.products.push({ key, qty: 0, unit: '개', desc: '서비스' });
        if (!productMap[key]) productMap[key] = { name, size, qty: 0 };
      }
    }
  }

  // 각 PDF 페이지를 별도로 처리 → 원본 장수 그대로 복원
  // pageTexts 순서: [표지, 기비/내용...페이지, 비용표]
  // 표지(0)는 stage 없음, 비용표(마지막)는 stage 없음 → 자동으로 스킵됨

  // 단계 키워드 정규식 — 정형 패턴
  const stageKeyRe = /수확\s*[:\uFF1a]\s*후|수확\s+후(?!\s*기비)|경운\s*[\u201c"\u201d\u2018\u2019]*\s*전[\u201c"\u201d\u2018\u2019]*|경운\s*[\u201c"\u201d\u2018\u2019]*\s*후[\u201c"\u201d\u2018\u2019]*|정식\s*[+＋]?\s*당일|정식\s*[\u201c"\u201d\u2018\u2019]*\s*후[\u201c"\u201d\u2018\u2019]*\s*(?:\d+\s*일?)?|관주\s*[\(（]\s*\d+\s*[번안]?\s*[\)）]|엽면\s*[\(（]\s*\d+\s*[번안]?\s*[\)）]/g;

  // 비정형 단계 키워드 (단독 등장) — 스테이지 분리 없이 타입·라벨 추론에만 사용
  const inferTypeFromPage = (text) => {
    const t = text.replace(/\s+/g,'');
    if (/감사비료|기비(?!용)|밑거름|수확후기비/.test(t)) return { type:'경운후', label:'감사비료' };
    if (/추비/.test(t)) return { type:'정식후', label:'추비' };
    if (/엽면/.test(t)) return { type:'엽면', label:'엽면' };
    if (/관주/.test(t)) return { type:'관주', label:'관주' };
    return null;
  };

  // 이미 사용된 월 번호 추적 (같은 월이 여러 페이지에 걸쳐 있으면 다른 그룹으로)
  const usedMonths = {};

  pageTexts.forEach((rawPage) => {
    const pg = rawPage.replace(/\n/g, ' ');

    // 이 페이지의 단계 키워드 위치 수집
    stageKeyRe.lastIndex = 0;
    const hits = [];
    let sm;
    while ((sm = stageKeyRe.exec(pg)) !== null) {
      const raw = sm[0].replace(/\s+/g,'');
      let type = '';
      if (/수확.*후/.test(raw)) type = '경운후';
      else if (/경운.*전/.test(raw)) type = '경운전';
      else if (/경운.*후/.test(raw)) type = '경운후';
      else if (/정식.*당일/.test(raw)) type = '정식당일';
      else if (/정식.*후/.test(raw)) type = '정식후';
      else if (/관주/.test(raw)) type = '관주';
      else if (/엽면/.test(raw)) type = '엽면';
      if (type) {
        // 키워드 앞 텍스트에서 단계 라벨 힌트 포착 (예: "감사비료 수확:후" → label='감사비료')
        const before = pg.slice(Math.max(0, sm.index - 20), sm.index).trim();
        const labelM = before.match(/([가-힣]{2,8})$/);
        const skipWords = new Set(['및','또는','후에','전에','이며','경운','정식','관주','엽면']);
        const label = (labelM && !skipWords.has(labelM[1])) ? labelM[1] : '';
        hits.push({ type, pos: sm.index, end: sm.index + sm[0].length, label });
      }
    }

    // ── 단계 키워드가 없는 페이지 → 제품 행으로 폴백 ──
    if (hits.length === 0) {
      // 제품 패턴 존재 여부 확인 (이름(형태) N포/봉/통 등)
      const hasProdRows = /[가-힣A-Za-z]{2,}\s*[\(（][가-힣A-Za-z]{2,}[\)）]\s+(?:\d+\s*평\s+)?\d+\s*(포|봉|병|통|개)/.test(pg);
      if (!hasProdRows) return; // 제품도 없으면 표지/비용표 → 스킵
      // 단계 타입·라벨 추론
      const inferred = inferTypeFromPage(pg);
      if (!inferred) return; // 추론 불가 → 스킵
      // 월 추출
      const mm = pg.match(/(\d{1,2})월/);
      const month = (mm && inferred.type !== '경운후') ? parseInt(mm[1]) : 0;
      if (usedMonths[month] !== undefined && inferred.type !== '경운후') return;
      usedMonths[month] = true;
      const stage = { type: inferred.type, month, products:[], purpose: inferred.label,
        days:'', dateRange:'', funcTags:[], funcColor:'#ffffff', area:null };
      result.stages.push(stage);
      _extractProds(pg, stage, '');
      const funcMs = pg.match(/[가-힣]{2,}(?:\+[가-힣]{2,})+/g);
      if (funcMs) stage.funcTags = funcMs.flatMap(m=>m.split('+'));
      return;
    }

    // 이 페이지의 대표 월 결정
    // 경운전/경운후(기비)는 month=0 고정
    const isBasePage = hits.every(h => h.type === '경운전' || h.type === '경운후');
    let pageMonth = 0;
    let realPageMonth = 0; // 요약카드용 진짜 월 (가짜 월 할당 전 보존)
    if (!isBasePage) {
      const mm = pg.match(/(\d{1,2})월/);
      pageMonth = mm ? parseInt(mm[1]) : 0;
      realPageMonth = pageMonth; // ← 진짜 월 기억
      // 같은 월이 이미 다른 페이지에서 사용됐으면 가상의 고유 월 부여 (100+페이지인덱스)
      if (usedMonths[pageMonth] !== undefined) {
        pageMonth = 100 + result.stages.length;
      }
      usedMonths[pageMonth] = true;
    }

    const stagesThisPage = [];
    for (let si = 0; si < hits.length; si++) {
      const sh = hits[si];
      const nextPos = si + 1 < hits.length ? hits[si + 1].pos : pg.length;
      const section = pg.slice(sh.end, nextPos);

      // sh.label이 있으면 purpose로 사용 (없으면 기비 페이지에서 나중에 채워짐)
      // realMonth: 요약카드에서 "5월" 레이블 추출용 (가짜 pageGroup 번호와 무관)
      const stage = { type: sh.type, month: pageMonth, realMonth: realPageMonth, products: [], purpose: sh.label || '', days: '', dateRange: '', funcTags: [], funcColor: '#ffffff', area: null };
      result.stages.push(stage);
      stagesThisPage.push(stage);

      const drM = section.match(/(\d+일)\s*[-~]\s*(\d+일)/);
      if (drM) stage.dateRange = drM[1] + '-' + drM[2];

      // 물량/사용방법 추출 (예: 물(10말), 물(5-10말))
      const waterM = section.match(/물\s*[\(（]\s*([\d\-~]+\s*말[^)）]{0,15})\s*[\)）]/);
      const stageDesc = waterM ? '물(' + waterM[1].trim() + ')' : '';
      _extractProds(section, stage, stageDesc);
    }

    // 제품기능 태그 추출 (페이지 헤더 텍스트에서 + 구분 태그)
    const headerText = pg.slice(0, hits[0].pos);
    const funcMatches = headerText.match(/[가-힣]{2,}(?:\+[가-힣]{2,})+/g);
    if (funcMatches && stagesThisPage.length > 0) {
      const funcTags = funcMatches.flatMap(m => m.split('+'));
      stagesThisPage.forEach(s => { s.funcTags = funcTags; });
    }

    // 월 없는 페이지(기비 등): 헤더에서 purpose 추출 → 페이지 타이틀로 사용
    if (pageMonth === 0 && stagesThisPage.length > 0) {
      const baseKeyM = pg.match(/감사\s*비료|기비(?!\s*용)|밑거름|수확\s*후\s*기비|수확후기비|파종\s*전|정식\s*전/);
      const purposeText = baseKeyM ? baseKeyM[0].replace(/\s/g,'') : '기비';
      stagesThisPage.forEach(s => { if (!s.purpose) s.purpose = purposeText; });
    }

    // 첫 번째 키워드 이전 텍스트의 제품 → 이 페이지 첫 번째 stage에 추가
    const preText = pg.slice(0, hits[0].pos);
    if (preText.trim()) {
      const tmp = { products: [] };
      _extractProds(preText, tmp);
      if (tmp.products.length > 0) {
        stagesThisPage[0].products = [...tmp.products, ...stagesThisPage[0].products];
      }
    }
  });

  // cart 구성
  result.cart = Object.values(productMap).map(p => ({
    name: p.name, size: p.size, qty: Math.ceil(p.qty), retail: 0, sp: 0
  }));

  return result;
}

// ── 파싱된 외부 PDF 데이터 적용 ──
function applyParsedRx(parsed) {
  // cart가 있으면 그대로 사용, 없으면 stages에서 자동 생성
  const initCart = (parsed.cart && parsed.cart.length > 0) ? parsed.cart : [];
  rxData = {
    name: parsed.name, region: parsed.region, area: parsed.area,
    crop: parsed.crop, areaType: parsed.areaType,
    cart: initCart
  };

  document.getElementById('bName').value = parsed.name;
  document.getElementById('bRegion').value = parsed.region;
  document.getElementById('bArea').value = parsed.area;
  if (parsed.crop) {
    // 작물명 별칭 처리
    const cropAlias = { '메론':'멜론', '한라봉':'레드향', '셀러리':'청경채' };
    const cropVal = cropAlias[parsed.crop] || parsed.crop;
    const sel = document.getElementById('bCrop');
    let found = false;
    for (let i = 0; i < sel.options.length; i++) {
      if (sel.options[i].value === cropVal) { sel.selectedIndex = i; found = true; break; }
    }
    if (!found) {
      for (let i = 0; i < sel.options.length; i++) {
        if (sel.options[i].value === '기타') { sel.selectedIndex = i; break; }
      }
    }
  }
  const at = parsed.areaType || '농사';
  const stdTypes = ['농사','하우스','노지'];
  const atSel = document.getElementById('bAreaType');
  if (stdTypes.includes(at)) {
    atSel.value = at;
  } else {
    atSel.value = '직접입력';
    document.getElementById('bAreaTypeDirect').style.display = 'block';
    document.getElementById('bAreaTypeDirect').value = at;
  }

  // stages 복원
  stageIdCnt = 0;
  stages = parsed.stages.map(s => ({
    id: ++stageIdCnt,
    month: s.month || 0,
    // ★ 페이지 추적 메타데이터 — parseRxPdfCoords 에서 채워진 값을 보존
    pageGroup:  s.pageGroup  ?? null,
    sourcePage: s.sourcePage ?? null,
    pageType:   s.pageType   || '',
    type: s.type,
    days: s.days || '',
    dateRange: s.dateRange || '',
    purpose: s.purpose || '',
    funcTags: s.funcTags || [],
    funcColor: s.funcColor || '#ffffff',
    typeNumOverride: s.typeNumOverride || 0,
    typeNumWord:     s.typeNumWord     || '',
    stageLabel:          s.stageLabel          || '',
    stageRawCell:        s.stageRawCell        || '',
    stageDisplayOverride: s.stageDisplayOverride || '',
    // v17: stageDisplayText 없으면 stageRawCell에서 복원 (migration)
    stageDisplayText:    s.stageDisplayText    || s.stageRawCell || '',
    // v17: stageLabelOverride가 stageRawCell과 같으면 구버전 오염 → stageDisplayText로 교체
    stageLabelOverride:  (s.stageLabelOverride && s.stageLabelOverride !== s.stageRawCell)
                           ? s.stageLabelOverride
                           : (s.stageDisplayText || s.stageRawCell || ''),
    stageMeta:           s.stageMeta           || null,
    products: (s.products || []).map(p => {
      if (!p.desc && !p.detailCellRaw && s.type !== '엽면') {
        const prodName = (p.key||'').split('||')[0];
        const mk = Object.keys(PRODUCT_DEFAULT_DESCS).find(k => prodName.includes(k));
        if (mk) p.desc = PRODUCT_DEFAULT_DESCS[mk];
      }
      return p;
    }),
    area: s.area || null
  }));

  pageOrder = [];
  costVisible = false;
  priceOverrides = {};

  // 제품 키 정규화: cart와 공백·괄호 차이 보정
  _normalizeStageProductKeys(stages);
  // cart가 비어 있으면 stage 제품에서 자동 생성 → 재고 현황 즉시 표시
  _autoCartFromStages(stages);

  // PDF 로드 직후 즉시 저장 — 거래명세표 이동해도 유실 없음
  _saveRxStages();

  renderStages();
  renderInventory();   // 재고 현황 즉시 갱신
  schedulePreview();
}

function editCoverLine(field) {
  _editorCtx = { type: 'cover', field };
  const ed = document.getElementById('coverEditor');
  const ccText = rxData.coverCustomText || {};
  const ccFs   = rxData.coverCustomFs   || {};
  const titles = { region:'지역 편집', cropArea:'작물/평수 편집', rx:'고객명 편집' };
  const hints  = {
    region: '지역 텍스트 · 엔터로 줄바꿈 가능',
    cropArea: '작물/평수 텍스트 · 엔터로 줄바꿈 가능',
    rx: '고객명만 입력 (처방전: 접두어 자동 표시)'
  };
  ed.querySelector('.ce-title').textContent = titles[field];
  ed.querySelector('.ce-hint').textContent  = hints[field];
  let curText = '';
  if (field === 'region') {
    curText = ccText.region !== undefined ? ccText.region : (document.getElementById('bRegion').value||'');
  } else if (field === 'cropArea') {
    if (ccText.cropArea !== undefined) { curText = ccText.cropArea; }
    else {
      const crop = document.getElementById('bCrop').value;
      const area = document.getElementById('bArea').value;
      curText = crop ? crop + (area ? `(${area}평)` : '') + getBAreaType() : '';
    }
  } else {
    curText = ccText.rx !== undefined ? ccText.rx : (document.getElementById('bName').value||'');
  }
  ed.querySelector('#ceText').value = curText;
  const allLines = [
    ccText.region !== undefined ? ccText.region : (document.getElementById('bRegion').value||''),
    ccText.cropArea !== undefined ? ccText.cropArea : '',
    '처방전:' + (ccText.rx !== undefined ? ccText.rx : (document.getElementById('bName').value||'고객명'))
  ].filter(Boolean);
  const autoFs = allLines.length ? Math.min(...allLines.map(t=>coverFontSize(t))) : 46;

  ed.querySelector('.ce-clear-btn').style.display = '';
  ed.style.display = 'block';
  setTimeout(()=>ed.querySelector('#ceText').focus(),50);
}

function _rxAutoGrowCell(cell) {
  const table = cell.closest('.rx-table');
  if (!table) return;
  const tr = cell.closest('tr');
  if (!tr) return;
  const trs = [...table.querySelectorAll('tr')];
  const trIdx = trs.indexOf(tr);
  if (trIdx >= trs.length - 1) return; // 마지막 행(푸터) 제외

  const needed  = cell.scrollHeight + 6;
  const current = parseFloat(tr.style.height) || tr.getBoundingClientRect().height;
  const delta   = needed - current;
  if (delta <= 2) return;

  // ── 페이지 경계 체크 ──────────────────────────────────────────────
  const card  = table.closest('[data-pagekey]');
  const ci    = card?.querySelector('.content-inner');
  const ciH   = ci ? ci.clientHeight : 1096;
  const totalH = trs.reduce((s, t) => s + (parseFloat(t.style.height) || t.getBoundingClientRect().height), 0);
  const pageSlack = Math.max(0, ciH - totalH - 6);

  // 아래 행에서 뺏어올 수 있는 공간 (푸터 제외)
  const trsStealable = trs.slice(trIdx + 1, trs.length - 1);
  const stealable = trsStealable.reduce((sum, t) => {
    const h = parseFloat(t.style.height) || t.getBoundingClientRect().height;
    return sum + Math.max(0, h - _MIN_ROW_H);
  }, 0);

  const maxGrow   = stealable + pageSlack;
  const actualGrow = Math.min(delta, maxGrow);

  if (actualGrow < 2) {
    // 더 이상 확장 불가 — 셀 내부 스크롤로 전환
    cell.style.overflowY = 'auto';
    return;
  }

  // 아래 행에서 우선 빼앗고, 부족하면 pageSlack 활용
  const fromBelow = Math.min(actualGrow, stealable);
  if (fromBelow > 0 && trsStealable.length > 0) {
    const totalBelow = trsStealable.reduce((s, t) => s + (parseFloat(t.style.height) || t.getBoundingClientRect().height), 0);
    trsStealable.forEach(t => {
      const h = parseFloat(t.style.height) || t.getBoundingClientRect().height;
      const ratio = totalBelow > 0 ? h / totalBelow : 1 / trsStealable.length;
      t.style.height = Math.max(_MIN_ROW_H, h - fromBelow * ratio) + 'px';
    });
  }

  tr.style.height = (current + actualGrow) + 'px';
  cell.style.overflowY = '';  // 확장 성공 — 스크롤 해제

  const k = _rxTableKey(table);
  trs.forEach((t, i) => {
    if (t.classList.contains('rx-spacer-tr')) return; // spacer만 제외, 푸터는 포함
    _rxResizeStore.rows[k + '_r' + i] = t.style.height || '';
  });
}

// ── 인라인 편집 상태 ──
let _inlineEditing = false;
let _pendingPreview = false;

function openRxEdit(el, e) {
  // modifier key → 선택 모드 (편집창 열지 않음)
  if (e && (e.ctrlKey || e.metaKey || e.shiftKey)) {
    _rxCellSelect(el, e);
    return;
  }
  // 이미 편집 중인 셀이면 무시
  if (el.getAttribute('contenteditable') === 'true') return;
  _rxClearSel();
  // 기존 팝업 닫기
  const ed = document.getElementById('coverEditor');
  if (ed) ed.style.display = 'none';

  const type = el.dataset.edit;
  const si   = parseInt(el.dataset.si);
  const pi   = parseInt(el.dataset.pi);
  const mk   = el.dataset.monthkey !== undefined ? parseInt(el.dataset.monthkey) : null;

  // 편집할 원시 텍스트 가져오기
  const getters = {
    'page-title': () => groupLabels[mk] || '',
    'func-tags':  () => (stages[si].funcTags||[]).join('+'),
    // ★ getStageLabelRaw 사용: 편집창에 날짜 포함 원문 그대로 표시
    //   buildGroupPage의 label 소스와 완전히 동일 → 클릭 전·후 텍스트 일치
    'stage-date': () => getStageLabelRaw(stages[si]),
    'prod-desc':  () => { const p=stages[si].products[pi]; return p.detailCellDisplayOverride || p.detailCellRaw || p.desc || ''; },
    'prod-qty':   () => String(stages[si].products[pi].qty||''),
    'prod-name':  () => stages[si].products[pi].key.split('||')[0],
    'prod-size':  () => { const p=stages[si].products[pi]; return p.capacity || p.key.split('||')[1] || ''; },
  };
  const getter = getters[type];
  if (!getter) return;
  const rawVal = getter();

  _rxHistoryCapture(); // 편집 시작 전 상태 저장 (Ctrl+Z 복원용)

  // 원본 HTML 저장 (Esc 복원용)
  el._origHtml = el.innerHTML;

  // 셀을 contenteditable로 전환
  _inlineEditing = true;
  el.setAttribute('contenteditable', 'true');
  el.classList.add('rx-editing');
  // stage-date: <strong> 래퍼 없이 순수 텍스트만 표시 (편집 편의 + 표시 일치)
  // 다른 셀: 기존 방식 그대로
  el.innerHTML = rawVal.replace(/\n/g, '<br>');
  // 편집 모드: 스크롤 허용으로 텍스트 잘림 방지
  el._origHeight = el.style.height;    // 원본 높이 저장
  el.style.height = 'auto';            // 편집 중 높이 제한 해제
  el.style.overflow = 'auto';
  el.style.minHeight = el._origHeight || '';
  el.focus();
  _rxShowToolbar(el);
  _tbActiveCell = el;

  // 커서를 맨 뒤로
  try {
    const range = document.createRange();
    const sel = window.getSelection();
    range.selectNodeContents(el);
    range.collapse(false);
    sel.removeAllRanges();
    sel.addRange(range);
  } catch(_){}

  // blur → 저장
  const finishEdit = (save) => {
    el.removeEventListener('blur', onBlur);
    el.removeEventListener('keydown', onKey);
    el.removeAttribute('contenteditable');
    el.classList.remove('rx-editing');
    el.style.height    = el._origHeight || '';  // 원본 높이 복원
    el.style.overflow  = '';
    el.style.minHeight = '';
    _inlineEditing = false;
    _rxHideToolbar();

    if (save) {
      const newVal = el.innerText.trim();
      _saveInlineEdit(type, si, pi, mk, newVal);
      // 즉시 셀 표시 복원
      _restoreCellHtml(el, type, si, pi, mk);
      // 셀 내용이 넘치면 아래 행들에서 높이를 빼앗아 자동으로 늘림
      requestAnimationFrame(() => _rxAutoGrowCell(el));
    } else {
      el.innerHTML = el._origHtml;
    }
    // 보류된 preview 포함 항상 갱신
    if (_pendingPreview || save) {
      _pendingPreview = false;
      schedulePreview();
    }
  };

  const onBlur = () => finishEdit(true);
  const onKey  = (ev) => {
    if (ev.key === 'Enter' && !ev.shiftKey) {
      ev.preventDefault();
      el.blur(); // → onBlur → finishEdit(true)
    }
    if (ev.key === 'Escape') {
      ev.preventDefault();
      finishEdit(false);
    }
    // Tab → 다음/이전 셀로 이동
    if (ev.key === 'Tab') {
      ev.preventDefault();
      el.blur();
      const allCells = [...document.querySelectorAll('.rx-table td.rx-editable, .rx-table th.rx-editable')];
      const idx = allCells.indexOf(el);
      const next = allCells[ev.shiftKey ? idx - 1 : idx + 1];
      if (next) setTimeout(() => next.click(), 50);
    }
  };

  el.addEventListener('blur', onBlur);
  el.addEventListener('keydown', onKey);
}

// ── 인라인 편집 데이터 저장 ──
function _saveInlineEdit(type, si, pi, mk, val) {
  if (type === 'page-title') {
    groupLabels[mk] = val;
    const inp = document.querySelector(`#monthGrp_${mk} .group-label-input`);
    if (inp) inp.value = val;
    const ta = document.getElementById(`groupTitleArea_${mk}`);
    if (ta) ta.value = val;
  } else if (type === 'func-tags') {
    stages[si].funcTags = val ? val.split('+').map(t=>t.trim()).filter(Boolean) : [];
  } else if (type === 'stage-date') {
    stages[si].stageDisplayOverride = val;
    const snArea = document.getElementById(`stageNameArea_${si}`);
    if (snArea) snArea.value = val;
  } else if (type === 'prod-desc') {
    stages[si].products[pi].detailCellDisplayOverride = val;
    stages[si].products[pi].desc = val;
  } else if (type === 'prod-qty') {
    const qty = parseFloat(val);
    if (!isNaN(qty)) stages[si].products[pi].qty = qty;
  } else if (type === 'prod-name') {
    const p = stages[si].products[pi];
    p.key = val.trim() + '||' + (p.key.split('||')[1]||'');
  } else if (type === 'prod-size') {
    const p = stages[si].products[pi];
    p.capacity = val.trim();
    // key의 size 부분도 갱신
    const name = p.key.split('||')[0];
    p.key = name + '||' + val.trim();
  }
}

// ── 셀 HTML 즉시 복원 (전체 re-render 전 임시 표시) ──
function _restoreCellHtml(el, type, si, pi, mk) {
  if (type === 'stage-date') {
    // ★ getStageLabelRaw: buildGroupPage/openRxEdit과 동일 소스로 날짜 보존
    el.innerHTML = '<strong>' + getStageLabelRaw(stages[si]).replace(/\n/g,'<br>') + '</strong>';
  } else if (type === 'prod-name') {
    const p = stages[si].products[pi];
    const name = p.key.split('||')[0];
    const areaLine = p.prodArea ? `<br><span style="font-size:0.9em;font-weight:700;color:#333;">(${p.prodArea}평)</span>` : '';
    el.innerHTML = name + areaLine;
  } else if (type === 'prod-qty') {
    const p = stages[si].products[pi];
    el.textContent = p.qty ? formatQty(p.qty, p.unit) : '—';
  } else if (type === 'prod-size') {
    const p = stages[si].products[pi];
    el.textContent = p.capacity || p.key.split('||')[1] || '';
  } else if (type === 'prod-desc') {
    const p = stages[si].products[pi];
    const desc = p.detailCellDisplayOverride || p.detailCellRaw || p.desc || '';
    el.innerHTML = `<div class="desc-inner">${desc ? desc.replace(/\n/g,'<br>') : '<span style="color:#ccc;font-size:11px;">+</span>'}</div>`;
  } else if (type === 'page-title') {
    el.textContent = groupLabels[mk] || '';
  } else if (type === 'func-tags') {
    el.innerHTML = (stages[si].funcTags||[]).join('&nbsp;&nbsp;·&nbsp;&nbsp;');
  }
}

function onCeTextInput() {
  const val = document.getElementById('ceText').value;
  if (!_editorCtx) return;
  const { type, field, si, pi, mk } = _editorCtx;
  if (type === 'cover') {
    if (!rxData.coverCustomText) rxData.coverCustomText = {};
    rxData.coverCustomText[field] = val;
    if (field === 'region') document.getElementById('bRegion').value = val.replace(/\n/g,' ');
    else if (field === 'rx') document.getElementById('bName').value  = val.replace(/\n/g,' ');
  } else if (type === 'page-title') {
    groupLabels[mk] = val;
    // 그룹 헤더 입력 필드 동기화
    const inp = document.querySelector(`#monthGrp_${mk} .group-label-input`);
    if (inp) inp.value = val;
    // 그룹 페이지 제목 textarea 동기화
    const ta = document.getElementById(`groupTitleArea_${mk}`);
    if (ta) ta.value = val;
  } else if (type === 'func-tags') {
    stages[si].funcTags = val ? val.split('+').map(t=>t.trim()).filter(Boolean) : [];
  } else if (type === 'stage-date') {
    // stage 셀 클릭 → 시기/단계명 편집
    // stageDisplayOverride에만 저장 — stageLabelOverride 동기화 금지 (오염 방지)
    stages[si].stageDisplayOverride = val;
    // 스테이지 카드의 시기/단계명 textarea도 실시간 동기화
    const snArea = document.getElementById(`stageNameArea_${si}`);
    if (snArea) snArea.value = val;
  } else if (type === 'prod-desc') {
    stages[si].products[pi].detailCellDisplayOverride = val;  // 수정값은 override에 저장
    stages[si].products[pi].desc = val;  // 하위 호환 유지
  } else if (type === 'prod-qty') {
    const qty = parseFloat(val);
    if (!isNaN(qty)) stages[si].products[pi].qty = qty;
  } else if (type === 'prod-name') {
    const p = stages[si].products[pi];
    p.key = val.trim() + '||' + (p.key.split('||')[1]||'');
  }
  schedulePreview();
}

function onCeFsInput() {
  const fs = parseInt(document.getElementById('ceFsNum').value);
  if (!fs || fs < 8 || fs > 120 || !_editorCtx || _editorCtx.type !== 'cover') return;
  if (!rxData.coverCustomFs) rxData.coverCustomFs = {};
  rxData.coverCustomFs[_editorCtx.field] = fs;
  schedulePreview();
}

function resetCoverFs() {
  if (!rxData.coverCustomFs || !_editorCtx) return;
  delete rxData.coverCustomFs[_editorCtx.field];
  const allLines = [document.getElementById('bRegion').value||'', '처방전:'+(document.getElementById('bName').value||'고객명')].filter(Boolean);
  document.getElementById('ceFsNum').value = Math.min(...allLines.map(t=>coverFontSize(t)));
  schedulePreview();
}

function clearCoverLine() {
  if (!_editorCtx || _editorCtx.type !== 'cover') return;
  const field = _editorCtx.field;
  if (!rxData.coverCustomText) rxData.coverCustomText = {};
  delete rxData.coverCustomText[field];
  document.getElementById('ceText').value = '';
  if (field === 'region') document.getElementById('bRegion').value = '';
  else if (field === 'cropArea') { document.getElementById('bCrop').value = ''; document.getElementById('bArea').value = ''; }
  schedulePreview();
}

function closeCoverEditor() {
  document.getElementById('coverEditor').style.display = 'none';
  _editorCtx = null;
}

// ── 거래명세표로 이동 전 cart 수량 동기화 ──
function goBackToCart() {
  // 단계별 제품 수량 합산
  const totals = {};
  stages.forEach(st => {
    (st.products || []).forEach(p => {
      if (!p.key) return;
      totals[p.key] = (totals[p.key] || 0) + (p.qty || 0);
    });
  });

  // 기존 cart 수량 업데이트
  const updatedCart = (rxData.cart || []).map(c => {
    const key = c.name + '||' + c.size;
    const stageQty = Math.ceil(totals[key] || 0);
    return { ...c, qty: stageQty > 0 ? stageQty : c.qty };
  });

  // stages에는 있지만 cart에 없는 제품 추가
  Object.entries(totals).forEach(([key, qty]) => {
    if (!updatedCart.find(c => c.name + '||' + c.size === key)) {
      const parts = key.split('||');
      updatedCart.push({ name: parts[0], size: parts[1] || '', qty: Math.ceil(qty), retail: 0, sp: 0 });
    }
  });

  rxData.cart = updatedCart;
  // 이동 직전 현재 상태 전체 저장 (복귀 시 stages 등 모두 복원됨)
  _saveRxStages();
  // index.html 로 cart 전달 (일회성 크로스-페이지 전달 키)
  localStorage.setItem('rxData', JSON.stringify(rxData));
  location.href = 'index.html';
}

function _saveRxStages() {
  try {
    localStorage.setItem('rxStages', JSON.stringify({
      stages: stages.map(s => ({
        type: s.type, month: s.month||0, realMonth: s.realMonth??null, pageGroup: s.pageGroup ?? null, sourcePage: s.sourcePage ?? null, pageType: s.pageType||'', days: s.days||'', dateRange: s.dateRange||'',
        purpose: s.purpose||'', funcTags: s.funcTags||[], funcColor: s.funcColor||'#ffffff',
        products: s.products||[], area: s.area||null,
        typeNumOverride: s.typeNumOverride||0, typeNumWord: s.typeNumWord||'',
        stageLabelOverride: s.stageLabelOverride||'', stageLabel: s.stageLabel||'',
        stageRawCell: s.stageRawCell||'', stageDisplayOverride: s.stageDisplayOverride||'',
        stageDisplayText: s.stageDisplayText||'', stageMeta: s.stageMeta||null,
        pageTitle: s.pageTitle||''
      })),
      pageOrder, costVisible, priceOverrides,
      groupLabels, stageGroupOrder,
      coverCustomFs: rxData.coverCustomFs || {},
      coverCustomText: rxData.coverCustomText || {},
      // ★ rxData 핵심 필드 함께 저장 → 새로고침 후에도 복원 가능
      // DOM 값 우선 (처방전.html 직접 업로드 시 rxData.name/crop이 비어있을 수 있음)
      rxCart:     rxData.cart     || [],
      rxName:     document.getElementById('bName')?.value   || rxData.name   || '',
      rxRegion:   document.getElementById('bRegion')?.value || rxData.region || '',
      rxArea:     document.getElementById('bArea')?.value   || rxData.area   || '',
      rxCrop:     document.getElementById('bCrop')?.value   || rxData.crop   || '',
      rxAreaType: rxData.areaType || '농사',
      rxPhone:    rxData.phone    || '',
      rxAddr:     rxData.addr     || '',
      // PDF 비용 페이지 추출 데이터
      extractedTotalCost: rxData.extractedTotalCost ?? null,
      extractedUnitPrice: rxData.extractedUnitPrice ?? null,
      extractedBreakdown: rxData.extractedBreakdown ?? null
    }));
  } catch(e) {}
}

// ── 통합 저장 (rxData + stages) ─────────────────────────────────────────────
// saveRxData() — 외부에서 호출 가능한 공통 저장 입구
// ※ localStorage.rxData 는 index.html 전달 전용이므로 여기서는 쓰지 않음
//    모든 영속은 rxStages 단일 저장소로 통일
function saveRxData() {
  _saveRxStages();
}

// 입력 필드 변경 시 debounce 자동 저장 (타이핑 중 불필요한 쓰기 방지)
let _autoSaveTimer = null;
function _scheduleAutoSave() {
  clearTimeout(_autoSaveTimer);
  _autoSaveTimer = setTimeout(() => {
    // 폼 값 → rxData 동기화 후 저장
    rxData.name     = document.getElementById('bName')?.value    || rxData.name    || '';
    rxData.region   = document.getElementById('bRegion')?.value  || rxData.region  || '';
    rxData.area     = document.getElementById('bArea')?.value    || rxData.area    || '';
    rxData.crop     = document.getElementById('bCrop')?.value    || rxData.crop    || '';
    const at = document.getElementById('bAreaType')?.value || '';
    rxData.areaType = at === '직접입력'
      ? (document.getElementById('bAreaTypeDirect')?.value || '') : (at || rxData.areaType || '농사');
    _saveRxStages();
  }, 800);
}
</script>

<!-- 표지 줄 편집 패널 -->
<div id="coverEditor">
  <div style="display:flex;justify-content:space-between;align-items:center;">
    <span class="ce-title">줄 편집</span>
    <button class="ce-close" onclick="closeCoverEditor()">×</button>
  </div>
  <label for="ceText" style="margin-top:6px;">내용</label>
  <textarea id="ceText" rows="2" oninput="onCeTextInput()" placeholder="텍스트 입력"></textarea>
  <div class="optional-hint ce-hint"></div>
  <div class="ce-fs-row" style="margin-top:12px;">
    <label>폰트 크기</label>
    <input type="number" id="ceFsNum" class="ce-fs-num" min="12" max="80" step="1" oninput="onCeFsInput()">
    <span style="font-size:12px;color:#888;">px</span>
    <button class="ce-auto-btn" onclick="resetCoverFs()">자동</button>
  </div>
  <div style="display:flex;gap:8px;margin-top:14px;">
    <button class="ce-clear-btn" onclick="clearCoverLine()" style="flex:1;padding:7px 0;border:1px solid #eee;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;background:#fff8f8;color:#c55;">줄 지우기</button>
    <button onclick="closeCoverEditor()" style="flex:1;padding:7px 0;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;background:var(--teal);color:#fff;">확인</button>
  </div>
</div>
