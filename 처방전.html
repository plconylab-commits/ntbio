}

function formatQty(qty, unit) {
  if (!qty) return '';
  const u = unit || '개';
  const whole = Math.floor(qty);
  const half = Math.abs(qty - whole - 0.5) < 0.001; // qty의 소수부가 0.5인지
  if (half) {
    return whole > 0 ? `${whole}${u}반` : `반${u}`;
  }
  return `${qty}${u}`;
}

function delStage(si) {
  _pushHistory();
  stages.splice(si, 1);
  renderStages();
  renderInventory();
  _saveRxStages();
}

// ── 단계 합치기 (si와 si+1 병합) ─────────────────────────────────
function mergeStages(si) {
  if (si < 0 || si + 1 >= stages.length) return;
  _pushHistory();
  const a = stages[si];
  const b = stages[si + 1];
  // 라벨: 두 override를 개행으로 합친 뒤 _cleanStageLabel로 정제
  const parts = [a.stageLabelOverride || a.stageLabel, b.stageLabelOverride || b.stageLabel].filter(Boolean);
  a.stageLabelOverride = _cleanStageLabel(parts.join('\n'));
  a.stageLabel = '';
  // 제품: 중복 key는 수량 합산, 새 제품은 뒤에 추가
  (b.products || []).forEach(bp => {
    const existing = (a.products || []).find(ap => ap.key === bp.key);
    if (existing) {
      existing.qty = (Number(existing.qty) || 0) + (Number(bp.qty) || 0);
    } else {
      a.products.push({ ...bp });
    }
  });
  // 날짜 범위: 빈 것 우선 채움
  if (!a.dateRange && b.dateRange) a.dateRange = b.dateRange;
  // 기능 태그: 중복 없이 합산
  const allTags = [...(a.funcTags || []), ...(b.funcTags || [])];
  a.funcTags = [...new Set(allTags)];
  stages.splice(si + 1, 1);
  renderStages();
  renderInventory();
  _saveRxStages();
}

// ── 단계 나누기 (si 단계를 product index splitAt 기준으로 2개로 분리) ──
function splitStage(si, splitAt) {
  const st = stages[si];
  if (!st || !st.products || splitAt <= 0 || splitAt >= st.products.length) return;
  _pushHistory();
  const prodsA = st.products.slice(0, splitAt);
  const prodsB = st.products.slice(splitAt);
  const newStage = {
    ...JSON.parse(JSON.stringify(st)),
    products: prodsB,
    stageLabelOverride: st.stageLabelOverride || st.stageLabel,
    stageLabel: '',
    id: Date.now() + Math.random()
  };
  st.products = prodsA;
  stages.splice(si + 1, 0, newStage);
  renderStages();
  renderInventory();
  _saveRxStages();
}

// ── rx 셀 선택 UI ────────────────────────────────────────────────

/* ═══════════════════════════════════════════════════════════════════
   RX TABLE — 엑셀 수준 셀 선택 · 합치기 · 분할
   ═══════════════════════════════════════════════════════════════════ */

// _rxSelSi / selectedCells / _rxLastSelSi 는 위 상태 블록에서 선언됨

let _rxDrag      = { on:false, startRow:-1, endRow:-1, startCol:0, endCol:0, tbody:null };
let _rxDragMoved = false;   // 실제 이동 여부 (단순 클릭과 구분)
let _rxEvtBound  = false;   // 이벤트 중복 방지
let _rxCellMapCache = null; // buildCellMap 캐시

// ── data-si 추출 ────────────────────────────────────────────────────
function _rxGetSi(el) {
  const v = el && el.dataset ? el.dataset.si : undefined;
  return (v !== undefined && v !== '') ? parseInt(v) : null;
}

// ── rowspan/colspan 고려 2D 셀 맵 ────────────────────────────────────
// cellMap[rowIdx][colIdx] = td (병합 셀은 같은 참조)
function _rxBuildCellMap(tbody) {
  if (_rxCellMapCache && _rxCellMapCache.tbody === tbody) return _rxCellMapCache;
  const trs = [...tbody.querySelectorAll(':scope > tr')];
  const map  = trs.map(() => ({}));
  trs.forEach((tr, ri) => {
    let ci = 0;
    [...tr.children].forEach(td => {
      while (map[ri][ci]) ci++;
      const rs = Math.min(parseInt(td.getAttribute('rowspan')||'1'), trs.length - ri);
      const cs = parseInt(td.getAttribute('colspan')||'1');
      for (let r = ri; r < ri + rs; r++)
        for (let c = ci; c < ci + cs; c++)
          if (map[r]) map[r][c] = td;
      ci += cs;
    });
  });
  _rxCellMapCache = { tbody, map, trs };
  return _rxCellMapCache;
}
function _rxInvalidateCellMap() { _rxCellMapCache = null; }

// td → {row, col} — data-row/data-col 우선, fallback: 2D cellMap
function _rxCellPos(td, tbody) {
  const dr = td.dataset.row, dc = td.dataset.col;
  if (dr !== undefined && dc !== undefined) return { row: parseInt(dr), col: parseInt(dc) };
  const { map } = _rxBuildCellMap(tbody);
  for (let r = 0; r < map.length; r++)
    for (const c in map[r])
      if (map[r][c] === td) return { row: r, col: parseInt(c) };
  return null;
}

// ── 이벤트 바인딩 (.preview-area 위임, 1회만) ────────────────────────
function _rxBindTableEvents() {
  if (_rxEvtBound) return;
  _rxEvtBound = true;
  const pa = document.querySelector('.preview-area');
  if (!pa) return;

  // mousedown: 드래그 준비 (modifier 키 없을 때만)
  pa.addEventListener('mousedown', e => {
    if (e.button !== 0 || e.ctrlKey || e.metaKey || e.shiftKey) return;
    // 격자 리사이즈 핸들 클릭 시 셀 드래그 무시
    if (e.target.closest('.col-resize-handle') || e.target.closest('.row-resize-handle')) return;
    const td = e.target.closest('.rx-table tbody td');
    if (!td) return;
    const tbody = td.closest('tbody');
    const pos   = _rxCellPos(td, tbody);
    if (!pos) return;
    _rxDrag      = { on:true, startRow:pos.row, endRow:pos.row,
                     startCol:pos.col, endCol:pos.col, tbody };
    _rxDragMoved = false;
  });

  // mousemove: 드래그 범위 갱신 (row + col 모두 추적)
  pa.addEventListener('mousemove', e => {
    if (!_rxDrag.on) return;
    const td = e.target.closest('.rx-table tbody td');
    if (!td || td.closest('tbody') !== _rxDrag.tbody) return;
    const pos = _rxCellPos(td, _rxDrag.tbody);
    if (!pos) return;
    if (pos.row !== _rxDrag.startRow || pos.col !== _rxDrag.startCol) _rxDragMoved = true;
    if (pos.row !== _rxDrag.endRow || pos.col !== _rxDrag.endCol) {
      _rxDrag.endRow = pos.row;
      _rxDrag.endCol = pos.col;
      _rxUpdateDragHighlight();
    }
  });

  // mouseup: 이동 있었으면 선택 확정
  document.addEventListener('mouseup', () => {
    if (!_rxDrag.on) return;
    _rxDrag.on = false;
    if (_rxDragMoved) _rxFinalizeDragSel();
    else              _rxClearDragHighlight();
    _rxDragMoved = false;
  });

  // 바깥 클릭 → 선택 해제 (툴바/편집 셀 클릭 제외)
  document.addEventListener('click', e => {
    if (!_rxSelSi.size && !selectedCells.length) return;
    if (e.target.closest('#rxFloatToolbar') || e.target.closest('.rx-editable')) return;
    _rxClearSel();
  }, true);

  // ── 열 리사이즈 (유기적 드래그: 좌 열 ↔ 우 열 폭 교환) ──────────────
  _rxInitColResize(pa);
}

// ══════════════════════════════════════════════════════════════════════
// ══════════════════════════════════════════════════════════════════════
//  격자(Grid) 리사이즈 엔진 v4
//  ① <col width> / <tr style="height"> 직접 제어 — div/padding 조절 없음
//  ② 클릭 차단 없음 — drag threshold(4px) 통과 후에만 resize 활성화
//  ③ Zero-sum — 행 경계선 이동 시 인접 행(위아래) 합산 고정
//  ④ 마지막 행 하단: 위 tr가 보상 (합산 고정), footer 최소 높이 보호
//  ⑤ Undo/Redo — mousedown/mouseup 두 시점 innerHTML 스냅샷
// ══════════════════════════════════════════════════════════════════════
let _gridCol      = null;   // 열 드래그 상태
let _gridRow      = null;   // 행 드래그 상태
let _pendingDrag  = null;   // 드래그 확정 대기 (threshold 통과 전)
const _BORDER_HIT  = 6;     // border 감지 범위 px — 6px로 넓혀 핸들 찾기 쉽게
const _DRAG_THRESH = 4;     // 이 px 이상 이동해야 resize 활성화
const _MIN_COL_W   = 28;
const _MIN_ROW_H   = 32;   // 최소 행 높이 — 내용물 잘림 방지
const _FOOTER_MIN  = 36;

// ── 영구 저장소 ──────────────────────────────────────────────────────
const _rxResizeStore = {
  cols: {},  // { pagekey: { colIdx: 'Xpx' } }
  rows: {},  // { 'pagekey_rN': 'Xpx' }
};

function _rxTableKey(table) {
  return table?.closest('[data-pagekey]')?.dataset.pagekey || '_';
}

function _rxRestoreResize() {
  document.querySelectorAll('.rx-table').forEach(table => {
    const k = _rxTableKey(table);
    const sc = _rxResizeStore.cols[k];
    if (sc) {
      const cols = [...table.querySelectorAll('colgroup col')];
      Object.entries(sc).forEach(([i, w]) => { if (cols[+i]) cols[+i].style.width = w; });
    }
    const trs = [...table.querySelectorAll('tr')];
    trs.forEach((tr, idx) => {
      const h = _rxResizeStore.rows[k + '_r' + idx];
      if (h) tr.style.height = h;
      if (tr.classList.contains('rx-footer-tr')) {
        const ftd = tr.querySelector('td.page-footer-bar');
        const fh  = _rxResizeStore.rows[k + '_ftd'];
        if (ftd && fh) ftd.style.height = fh;
      }
    });
  });
}

// ── 초기화 — 컬럼 너비만 잠금, 행 높이는 브라우저 auto 유지 ─────────
function _rxInitTableSizes() {
  document.querySelectorAll('.rx-table').forEach(table => {
    const k    = _rxTableKey(table);
    const cols = [...table.querySelectorAll('colgroup col')];

    // ① col 너비만 처리 (저장값 없으면 rx-header-row th 실측)
    const hasCols = _rxResizeStore.cols[k] && Object.keys(_rxResizeStore.cols[k]).length;
    if (!hasCols) {
      const ths = [...table.querySelectorAll('.rx-header-row th')];
      const map = {};
      ths.forEach((th, i) => {
        if (!cols[i]) return;
        const w = th.getBoundingClientRect().width;
        if (w > 0) { cols[i].style.width = w + 'px'; map[i] = w + 'px'; }
      });
      if (Object.keys(map).length) _rxResizeStore.cols[k] = map;
    } else {
      Object.entries(_rxResizeStore.cols[k]).forEach(([i, w]) => { if (cols[+i]) cols[+i].style.width = w; });
    }

    // ② 행 높이: 사용자가 직접 조절한 값만 복원
    const trs = [...table.querySelectorAll('tr')];
    trs.forEach((tr, i) => {
      const stored = _rxResizeStore.rows[k + '_r' + i];
      if (stored) tr.style.height = stored;
      if (tr.classList.contains('rx-footer-tr')) {
        const ftd = tr.querySelector('td.page-footer-bar');
        const fh  = _rxResizeStore.rows[k + '_ftd'];
        if (ftd && fh) ftd.style.height = fh;
      }
    });

  });
}

// ── Undo / Redo — 완전 상태 스냅샷 (리사이즈 + 텍스트 + 서식 모두 포함) ──
const _rxUndoStack = [];
const _rxRedoStackFull = [];
const _RX_HISTORY_MAX = 50;

function _rxSnapState() {
  // stages / groupLabels는 전역 변수 (싱글 파일 구조 보장)
  return {
    stagesJSON:      JSON.stringify(typeof stages !== 'undefined' ? stages : []),
    labelsJSON:      JSON.stringify(typeof groupLabels !== 'undefined' ? groupLabels : {}),
    resizeCols:      JSON.parse(JSON.stringify(_rxResizeStore.cols)),
    resizeRows:      JSON.parse(JSON.stringify(_rxResizeStore.rows)),
    tablesHTML:      [...document.querySelectorAll('.rx-table')].map(t => ({
                       key: _rxTableKey(t), html: t.innerHTML
                     })),
  };
}

function _rxHistoryCapture() {
  const snap = _rxSnapState();
  _rxUndoStack.push(snap);
  if (_rxUndoStack.length > _RX_HISTORY_MAX) _rxUndoStack.shift();
  _rxRedoStackFull.length = 0;
}

function _rxApplySnap(snap) {
  // 리사이즈 저장소 먼저 복원 (generatePreview 후 _rxRestoreResize 에서 참조됨)
  _rxResizeStore.cols = snap.resizeCols;
  _rxResizeStore.rows = snap.resizeRows;

  // 텍스트/서식 변경이 없으면 DOM만 복원 (빠른 경로)
  const hasDomOnly = snap.tablesHTML && snap.tablesHTML.length;
  const stCur = JSON.stringify(typeof stages !== 'undefined' ? stages : []);
  const lbCur = JSON.stringify(typeof groupLabels !== 'undefined' ? groupLabels : {});

  if (snap.stagesJSON === stCur && snap.labelsJSON === lbCur) {
    // 데이터 변경 없음 — DOM 스냅샷만 복원
    snap.tablesHTML.forEach(({ key, html }) => {
      const table = document.querySelector(`[data-pagekey="${key}"] .rx-table`);
      if (!table) return;
      table.innerHTML = html;
      const cols = [...table.querySelectorAll('colgroup col')];
      const cm = {}; cols.forEach((c, i) => { if (c.style.width) cm[i] = c.style.width; });
      _rxResizeStore.cols[key] = cm;
      [...table.querySelectorAll('tr')].forEach((tr, i) => {
        _rxResizeStore.rows[key + '_r' + i] = tr.style.height || '';
      });
    });
    return;
  }

  // 데이터 변경 있음 — 전체 재생성
  try {
    const restoredStages = JSON.parse(snap.stagesJSON);
    if (typeof stages !== 'undefined') stages.splice(0, stages.length, ...restoredStages);
    const restoredLabels = JSON.parse(snap.labelsJSON);
    if (typeof groupLabels !== 'undefined') {
      Object.keys(groupLabels).forEach(k => delete groupLabels[k]);
      Object.assign(groupLabels, restoredLabels);
    }
    if (typeof generatePreview === 'function') generatePreview();
  } catch(e) { console.warn('Undo restore failed:', e); }
}

function _rxUndo() {
  if (!_rxUndoStack.length) return;
  _rxRedoStackFull.push(_rxSnapState());
  _rxApplySnap(_rxUndoStack.pop());
}

function _rxRedo() {
  if (!_rxRedoStackFull.length) return;
  _rxUndoStack.push(_rxSnapState());
  _rxApplySnap(_rxRedoStackFull.pop());
}

// ── <col> 인덱스 계산 ────────────────────────────────────────────────
function _rxGetColIdx(cell) {
  if (cell.dataset.col !== undefined) return parseInt(cell.dataset.col);
  let idx = 0;
  for (const c of cell.parentElement.children) {
    if (c === cell) return idx;
    idx += (parseInt(c.getAttribute('colspan')) || 1);
  }
  return 0;
}

// ── mousemove → border 근접 판정 ────────────────────────────────────
function _rxGridHitTest(e) {
  const cell = e.target.closest('.rx-table th, .rx-table td');
  if (!cell) return null;
  const r     = cell.getBoundingClientRect();
  // Math.round → 서브픽셀 오차 제거, 리사이즈 핸들 좌표 정수 스냅
  const nearR = e.clientX >= Math.round(r.right)  - _BORDER_HIT;
  const nearB = e.clientY >= Math.round(r.bottom) - _BORDER_HIT;
  if (!nearR && !nearB) return null;

  const table      = cell.closest('table');
  const cols       = [...table.querySelectorAll('colgroup col')];
  const colIdx     = _rxGetColIdx(cell);
  const cellColspan = parseInt(cell.getAttribute('colspan')) || 1;
  // colspan 셀은 col resize 불가 (제목/헤더/푸터 행)
  const canCol = nearR && cellColspan === 1 && colIdx < cols.length - 1;
  if (canCol) return { mode:'col', cell, table, cols, colIdx };

  if (nearB) {
    const allTrs = [...table.querySelectorAll('tr')];
    const cellTr    = cell.closest('tr');
    const rowspan   = parseInt(cell.getAttribute('rowspan')) || 1;
    const cellTrIdx = allTrs.indexOf(cellTr);

    // 푸터 행 하단: 완전 차단 (테이블 외곽선 — 드래그 불가)
    if (cellTr.classList.contains('rx-footer-tr')) return null;

    // rowspan 병합셀: 핸들은 오직 마지막 병합 행의 바닥에만 (유령 핸들 방지)
    const lastTrIdx = Math.min(cellTrIdx + rowspan - 1, allTrs.length - 1);
    // rowspan > 1 인 셀을 중간 행에서 hover 하면 핸들 차단 (마지막 행 바닥에서만 허용)
    if (rowspan > 1) {
      const cellRect = cell.getBoundingClientRect();
      // 실제 셀 바닥(rowspan 끝)에서 _BORDER_HIT px 이내가 아니면 무시
      if (e.clientY < Math.round(cellRect.bottom) - _BORDER_HIT) return null;
    }
    const tr    = allTrs[lastTrIdx];
    const trIdx = lastTrIdx;
    if (trIdx === allTrs.length - 1) return null;  // 마지막 행 하단 리사이즈 불가
    const trBelow = allTrs[trIdx + 1];

    // ② trBelow 가 스페이서·푸터이면 단독 리사이즈 (spacer 가 여백 흡수, 합계 유지 불요)
    if (trBelow.classList.contains('rx-spacer-tr') ||
        trBelow.classList.contains('rx-footer-tr')) {
      return { mode:'row', cell, table, tr, trIdx, trBelow: null };
    }

    return { mode:'row', cell, table, tr, trIdx, trBelow };
  }
  return null;
}

// ── 리사이즈 엔진 초기화 ─────────────────────────────────────────────
function _rxInitColResize(container) {

  // 1) cursor 표시 (mousemove)
  container.addEventListener('mousemove', e => {
    if (_gridCol || _gridRow || _pendingDrag) return;
    const hit  = _rxGridHitTest(e);
    const cell = e.target.closest('.rx-table th, .rx-table td');
    // 이전 hint 클래스 제거
    container.querySelectorAll('.rx-row-hint,.rx-col-hint')
      .forEach(el => el.classList.remove('rx-row-hint','rx-col-hint'));
    if (!cell) return;
    if (hit) {
      cell.style.cursor = hit.mode === 'col' ? 'col-resize' : 'row-resize';
      cell.classList.add(hit.mode === 'col' ? 'rx-col-hint' : 'rx-row-hint');
    } else {
      cell.style.cursor = '';
    }
  });
  container.addEventListener('mouseleave', () => {
    if (_gridCol || _gridRow) return;
    container.querySelectorAll('.rx-row-hint,.rx-col-hint,.rx-table th[style*="cursor"],.rx-table td[style*="cursor"]')
      .forEach(el => { el.classList.remove('rx-row-hint','rx-col-hint'); el.style.cursor=''; });
  });

  // 2) mousedown — threshold 대기 시작 (click 이벤트 방해 안 함)
  container.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    const hit = _rxGridHitTest(e);
    if (!hit) return;
    // preventDefault/stopPropagation 하지 않음 → click 정상 동작
    _pendingDrag = { hit, startX: e.clientX, startY: e.clientY };
  });

  // 3) mousemove — threshold 초과 시 resize 활성화 + 실시간 갱신
  document.addEventListener('mousemove', e => {
    // threshold 체크 → resize 활성화
    if (_pendingDrag && !_gridCol && !_gridRow) {
      const dx = e.clientX - _pendingDrag.startX;
      const dy = e.clientY - _pendingDrag.startY;
      if (Math.abs(dx) >= _DRAG_THRESH || Math.abs(dy) >= _DRAG_THRESH) {
        e.preventDefault();
        _rxHistoryCapture(); // undo: 드래그 확정 직전 스냅샷
        const hit = _pendingDrag.hit;
        _pendingDrag = null;

        if (hit.mode === 'col') {
          // col 초기화: rx-header-row th 실측값으로 모든 col 고정
          const ths = hit.table.querySelectorAll('.rx-header-row th');
          hit.cols.forEach((col, i) => {
            if (ths[i]) col.style.width = ths[i].getBoundingClientRect().width + 'px';
          });
          document.body.classList.add('col-resizing');
          _gridCol = {
            table:   hit.table,
            colL:    hit.cols[hit.colIdx],
            colR:    hit.cols[hit.colIdx + 1],
            startX:  e.clientX,
            startWL: parseFloat(hit.cols[hit.colIdx].style.width),
            startWR: parseFloat(hit.cols[hit.colIdx + 1]?.style.width || '0'),
          };
        } else {
          // Math.round → 1px 미만 오차 제거 (선 끊김 방지)
          const startH = Math.round(hit.tr.getBoundingClientRect().height);
          hit.tr.style.height = startH + 'px';
          let startHBelow = 0;
          if (hit.trBelow) {
            startHBelow = Math.round(hit.trBelow.getBoundingClientRect().height);
            hit.trBelow.style.height = startHBelow + 'px';
            // 푸터 행이면 td.style.height 도 함께 고정
            if (hit.trBelow.classList.contains('rx-footer-tr')) {
              const ftd = hit.trBelow.querySelector('td.page-footer-bar');
              if (ftd) ftd.style.height = startHBelow + 'px';
            }
          }
          document.body.classList.add('row-resizing');
          _gridRow = {
            table: hit.table, tr: hit.tr, trBelow: hit.trBelow,
            startY: e.clientY, startH, startHBelow,
          };
        }
      }
    }

    // col resize 실시간 갱신
    if (_gridCol) {
      e.preventDefault();
      const d = e.clientX - _gridCol.startX;
      let wL = _gridCol.startWL + d, wR = _gridCol.startWR - d;
      if (wL < _MIN_COL_W) { wL = _MIN_COL_W; wR = _gridCol.startWL + _gridCol.startWR - _MIN_COL_W; }
      if (wR < _MIN_COL_W) { wR = _MIN_COL_W; wL = _gridCol.startWL + _gridCol.startWR - _MIN_COL_W; }
      _gridCol.colL.style.width = wL + 'px';
      if (_gridCol.colR) _gridCol.colR.style.width = wR + 'px';
    }

    // row resize 실시간 갱신 — Push-Pull (스페이서가 여백 흡수)
    if (_gridRow) {
      e.preventDefault();
      const Δ = e.clientY - _gridRow.startY;
      let newH = _gridRow.startH + Δ;

      if (_gridRow.trBelow) {
        // ── 두 행 합 고정 교환 (Zero-sum)
        // trBelow 가 푸터인 경우 → 최솟값을 _FOOTER_MIN 으로 보호
        const minBelow = _gridRow.trBelow.classList.contains('rx-footer-tr')
          ? _FOOTER_MIN : _MIN_ROW_H;
        let newHP = _gridRow.startHBelow - (newH - _gridRow.startH);
        if (newHP < minBelow)  { newHP = minBelow;   newH = _gridRow.startH + _gridRow.startHBelow - minBelow; }
        if (newH  < _MIN_ROW_H){ newH  = _MIN_ROW_H; newHP = _gridRow.startH + _gridRow.startHBelow - _MIN_ROW_H; }
        _gridRow.tr.style.height      = Math.round(newH)  + 'px';
        _gridRow.trBelow.style.height = Math.round(newHP) + 'px';
        // 푸터 td 높이도 직접 동기화 (display:table-cell + vertical-align:middle 이 중앙 처리)
        if (_gridRow.trBelow.classList.contains('rx-footer-tr')) {
          const _ftd = _gridRow.trBelow.querySelector('td.page-footer-bar');
          if (_ftd) _ftd.style.height = Math.round(newHP) + 'px';
        }
      } else {
        // trBelow 없는 경우: 해당 행만 단독 조절 (최솟값 보호)
        newH = Math.max(_MIN_ROW_H, newH);
        _gridRow.tr.style.height = Math.round(newH) + 'px';
      }
    }
  });

  // 4) mouseup — 저장소 보존, undo 스택에 변경 후 스냅샷도 추가
  document.addEventListener('mouseup', () => {
    _pendingDrag = null;
    if (_gridCol) {
      const k = _rxTableKey(_gridCol.table);
      const cols = [..._gridCol.table.querySelectorAll('colgroup col')];
      const map = {}; cols.forEach((c, i) => { if (c.style.width) map[i] = c.style.width; });
      _rxResizeStore.cols[k] = map;
      document.body.classList.remove('col-resizing');
      _gridCol = null;
    }
    if (_gridRow) {
      const k = _rxTableKey(_gridRow.table);
      [..._gridRow.table.querySelectorAll('tr')].forEach((tr, i) => {
        _rxResizeStore.rows[k + '_r' + i] = tr.style.height || '';
        if (tr.classList.contains('rx-footer-tr')) {
          const ftd = tr.querySelector('td.page-footer-bar');
          if (ftd && ftd.style.height) _rxResizeStore.rows[k + '_ftd'] = ftd.style.height;
        }
      });
      document.body.classList.remove('row-resizing');
      _gridRow = null;
    }
  });

  // 5) 키보드 — Undo/Redo + 블록선택 Delete/Ctrl+C
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) {
      if (typeof _inlineEditing !== 'undefined' && _inlineEditing) return;
      e.preventDefault(); _rxUndo(); return;
    }
    if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.key === 'z' && e.shiftKey))) {
      if (typeof _inlineEditing !== 'undefined' && _inlineEditing) return;
      e.preventDefault(); _rxRedo(); return;
    }
    const sel = [...document.querySelectorAll('.rx-table td.drag-selecting,.rx-table td.selected')];
    if (!sel.length) return;
    if (e.key === 'Delete' || e.key === 'Backspace') {
      e.preventDefault();
      sel.forEach(td => {
        const si = parseInt(td.dataset.si), pi = parseInt(td.dataset.pi);
        const type = td.dataset.edit;
        if (isNaN(si)) return;
        if (type === 'prod-desc' && !isNaN(pi)) {
          stages[si].products[pi].detailCellDisplayOverride = '';
          stages[si].products[pi].desc = '';
        } else if (type === 'prod-qty' && !isNaN(pi)) {
          stages[si].products[pi].qty = 0;
        }
      });
      schedulePreview();
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 'c') {
      navigator.clipboard.writeText(sel.map(td => td.innerText.trim()).join('\t')).catch(() => {});
    }
  });
}

function _rxInjectRowHandles() { /* no-op */ }

// ══════════════════════════════════════════════════════════════════════
//  서식 툴바 — 셀 편집 시 자동 표시
// ══════════════════════════════════════════════════════════════════════
let _tbActiveCell = null;

function _rxCreateToolbar() {
  if (document.getElementById('rxFloatToolbar')) return;
  const tb = document.createElement('div');
  tb.id = 'rxFloatToolbar';
  tb.innerHTML = `
    <select id="tbFont" title="폰트">
      <option value="">폰트 선택</option>
      <option value="'Noto Sans KR',sans-serif">Noto Sans KR</option>
      <option value="'NanumGothic',sans-serif">나눔고딕</option>
      <option value="'Malgun Gothic',sans-serif">맑은 고딕</option>
      <option value="Arial,sans-serif">Arial</option>
      <option value="'Times New Roman',serif">Times New Roman</option>
    </select>
    <input type="number" class="tb-num" id="tbSize" min="8" max="72" placeholder="크기" title="글자 크기(px)">
    <span class="tb-sep"></span>
    <button class="tb-btn" id="tbBold" onmousedown="event.preventDefault();event.stopPropagation();" onclick="rxTbExec('bold')" title="굵게 (Ctrl+B)"><b>B</b></button>
    <button class="tb-btn" id="tbItalic" onmousedown="event.preventDefault();event.stopPropagation();" onclick="rxTbExec('italic')" title="기울임 (Ctrl+I)"><i>I</i></button>
    <button class="tb-btn" id="tbUnder" onmousedown="event.preventDefault();event.stopPropagation();" onclick="rxTbExec('underline')" title="밑줄 (Ctrl+U)"><u>U</u></button>
    <span class="tb-sep"></span>
    <label class="tb-clr-wrap" title="글자색" onmousedown="event.preventDefault();event.stopPropagation();">
      <span style="text-decoration:underline;text-decoration-color:var(--tc,#111);">A</span>
      <input type="color" id="tbTextColor" value="#111111" onmousedown="event.preventDefault();event.stopPropagation();" oninput="rxTbColor('foreColor',this.value)">
    </label>
    <label class="tb-clr-wrap" title="배경색" onmousedown="event.preventDefault();event.stopPropagation();">
      <span style="background:var(--bc,#fff);padding:0 2px;">배</span>
      <input type="color" id="tbBgColor" value="#ffffff" onmousedown="event.preventDefault();event.stopPropagation();" oninput="rxTbColor('hiliteColor',this.value)">
    </label>
    <span class="tb-sep"></span>
    <button class="tb-btn tb-merge-btn" id="tbMerge" disabled
      onmousedown="event.preventDefault();event.stopPropagation();"
      onclick="_rxMergeSel()" title="드래그로 선택한 셀 합치기">🔗 합치기</button>
    <button class="tb-btn tb-split-btn" id="tbSplit" disabled
      onmousedown="event.preventDefault();event.stopPropagation();"
      onclick="_rxSplitSel()" title="선택한 셀 분할">✂ 분할</button>
    <span class="tb-sep"></span>
    <button class="tb-btn" onmousedown="event.preventDefault();event.stopPropagation();" onclick="_rxHideToolbar()" title="닫기" style="font-size:11px;padding:2px 6px;">✕</button>
  `;
  document.body.appendChild(tb);
  // stopPropagation: 툴바 클릭이 document의 포커스-블러 이벤트로 전파되지 않도록
  // preventDefault: 브라우저가 편집 셀의 포커스를 뺏지 않도록
  tb.addEventListener('mousedown', e => { e.preventDefault(); e.stopPropagation(); });
  document.getElementById('tbFont').addEventListener('change', rxTbFontFamily);
  document.getElementById('tbSize').addEventListener('change', rxTbFontSize);
  document.getElementById('tbSize').addEventListener('keydown', e => { if (e.key === 'Enter') rxTbFontSize(); });
}

function _rxShowToolbar(cell) {
  _tbActiveCell = cell;
  _rxCreateToolbar();
  document.getElementById('rxFloatToolbar')?.classList.add('show');
  _tbSyncState();
}

function _rxHideToolbar() {
  document.getElementById('rxFloatToolbar')?.classList.remove('show');
  _tbActiveCell = null;
}

function _tbSyncState() {
  if (!_tbActiveCell) return;
  try {
    document.getElementById('tbBold')?.classList.toggle('active', document.queryCommandState('bold'));
    document.getElementById('tbItalic')?.classList.toggle('active', document.queryCommandState('italic'));
    document.getElementById('tbUnder')?.classList.toggle('active', document.queryCommandState('underline'));
    const fs = parseFloat(getComputedStyle(_tbActiveCell).fontSize);
    if (fs) { const el = document.getElementById('tbSize'); if (el) el.value = Math.round(fs); }
  } catch(e) {}
}

function rxTbExec(cmd) {
  if (!_tbActiveCell) return;
  _rxHistoryCapture();
  _tbActiveCell.focus(); // 포커스 복원 후 execCommand
  document.execCommand(cmd, false, null);
  _tbSyncState();
}

function rxTbFontSize() {
  const size = document.getElementById('tbSize')?.value;
  if (!size || !_tbActiveCell) return;
  _rxHistoryCapture();
  _tbActiveCell.focus();
  const sel = window.getSelection();
  if (sel && sel.rangeCount > 0 && !sel.isCollapsed) {
    document.execCommand('fontSize', false, '7');
    _tbActiveCell.querySelectorAll('font[size="7"]').forEach(f => {
      f.removeAttribute('size'); f.style.fontSize = size + 'px';
    });
  } else {
    _tbActiveCell.style.fontSize = size + 'px';
  }
}

function rxTbFontFamily() {
  const font = document.getElementById('tbFont')?.value;
  if (!font || !_tbActiveCell) return;
  _rxHistoryCapture();
  _tbActiveCell.focus();
  const sel = window.getSelection();
  if (sel && sel.rangeCount > 0 && !sel.isCollapsed) {
    document.execCommand('fontName', false, font);
  } else {
    _tbActiveCell.style.fontFamily = font;
  }
}

function rxTbColor(cmd, color) {
  if (!color || !_tbActiveCell) return;
  _rxHistoryCapture();
  _tbActiveCell.focus();
  const sel = window.getSelection();
  if (sel && sel.rangeCount > 0 && !sel.isCollapsed) {
    document.execCommand(cmd, false, color);
  } else {
    if (cmd === 'foreColor') _tbActiveCell.style.color = color;
    else _tbActiveCell.style.backgroundColor = color;
  }
}

// ── 드래그 하이라이트 — data-row/data-col 바운딩 박스 ──────────────
function _rxUpdateDragHighlight() {
  _rxClearDragHighlight();
  const r1 = Math.min(_rxDrag.startRow, _rxDrag.endRow);
  const r2 = Math.max(_rxDrag.startRow, _rxDrag.endRow);
  const c1 = Math.min(_rxDrag.startCol, _rxDrag.endCol);
  const c2 = Math.max(_rxDrag.startCol, _rxDrag.endCol);
  (_rxDrag.tbody || document).querySelectorAll('td[data-row]').forEach(td => {
    const r = parseInt(td.dataset.row), c = parseInt(td.dataset.col || '0');
    if (r >= r1 && r <= r2 && c >= c1 && c <= c2) td.classList.add('drag-selecting');
  });
}
function _rxClearDragHighlight() {
  document.querySelectorAll('.rx-table .drag-selecting')
    .forEach(td => td.classList.remove('drag-selecting'));
}

// ── 드래그 확정 — 바운딩 박스 내 모든 td 선택 ──────────────────────
function _rxFinalizeDragSel() {
  _rxClearDragHighlight();
  const r1 = Math.min(_rxDrag.startRow, _rxDrag.endRow);
  const r2 = Math.max(_rxDrag.startRow, _rxDrag.endRow);
  const c1 = Math.min(_rxDrag.startCol, _rxDrag.endCol);
  const c2 = Math.max(_rxDrag.startCol, _rxDrag.endCol);
  _rxSelSi.clear(); selectedCells = [];
  const seen = new Set();
  (_rxDrag.tbody || document).querySelectorAll('td[data-row]').forEach(td => {
    const r = parseInt(td.dataset.row), c = parseInt(td.dataset.col || '0');
    if (r >= r1 && r <= r2 && c >= c1 && c <= c2 && !seen.has(td)) {
      seen.add(td); selectedCells.push(td);
      if (td.classList.contains('stage-td')) {
        const si = _rxGetSi(td);
        if (si !== null) _rxSelSi.add(si);
      }
    }
  });
  _rxRefreshSelUI();
}

// ── Ctrl/Shift+click 처리 ─────────────────────────────────────────
function _rxCellSelect(el, e) {
  const si = _rxGetSi(el);
  if (si === null) return;
  if (e && e.shiftKey && _rxLastSelSi !== null) {
    const lo = Math.min(_rxLastSelSi, si), hi = Math.max(_rxLastSelSi, si);
    for (let i = lo; i <= hi; i++) _rxSelSi.add(i);
  } else {
    if (_rxSelSi.has(si)) _rxSelSi.delete(si); else _rxSelSi.add(si);
    _rxLastSelSi = si;
  }
  selectedCells = [];
  _rxSelSi.forEach(s => {
    const td = document.querySelector(`.stage-td[data-si="${s}"]`);
    if (td) selectedCells.push(td);
  });
  _rxRefreshSelUI();
}

// ── UI 갱신: 하이라이트 + 툴바 합치기/분할 버튼 활성화 ────────────────
function _rxRefreshSelUI() {
  const selSet = new Set(selectedCells);
  document.querySelectorAll('.rx-editable, .rx-table tbody td[data-row]').forEach(el => {
    const inSel = selSet.has(el);
    el.classList.toggle('rx-cell-selected', inSel);
    el.classList.toggle('selected', inSel);
  });
  const n = selectedCells.length;

  // 툴바 합치기/분할 버튼 활성화 — 선택 없으면 disabled
  _rxCreateToolbar();
  const tbMerge = document.getElementById('tbMerge');
  const tbSplit  = document.getElementById('tbSplit');
  const hasMerged = selectedCells.some(td =>
    (parseInt(td.getAttribute('rowspan')) || 1) > 1 ||
    (parseInt(td.getAttribute('colspan')) || 1) > 1 ||
    (() => { const si = _rxGetSi(td); return si !== null && stages[si]?._vis?.mergedSis?.length > 0; })()
  );
  if (tbMerge) tbMerge.disabled = n < 2;
  if (tbSplit)  tbSplit.disabled = n === 0 || !hasMerged;

  // 셀이 선택된 경우 툴바 자동 표시
  if (n > 0) document.getElementById('rxFloatToolbar')?.classList.add('show');
}

// (컨텍스트 메뉴 제거 — 툴바 합치기/분할 버튼으로 대체됨)

// ── 합치기 — 바운딩 박스 Top-Left 셀 유지, 나머지 display:none ──────
// 분할 후 완벽 복구를 위해 stage._vis 에도 상태 저장 (renderStages 재실행 대비)
function _rxMergeSel() {
  const cells = selectedCells.length ? selectedCells
    : [..._rxSelSi].map(s => document.querySelector(`.stage-td[data-si="${s}"]`)).filter(Boolean);
  if (cells.length < 2) return;

  // ── 바운딩 박스 계산 ──────────────────────────────────────────────
  let r1=Infinity, r2=-Infinity, c1=Infinity, c2=-Infinity;
  cells.forEach(td => {
    const r = parseInt(td.dataset.row ?? 0);
    const c = parseInt(td.dataset.col ?? 0);
    if (r < r1) r1 = r; if (r > r2) r2 = r;
    if (c < c1) c1 = c; if (c > c2) c2 = c;
  });
  const totalRowspan = r2 - r1 + 1;
  const totalColspan = c2 - c1 + 1;

  // ── Top-Left 셀 찾기 ─────────────────────────────────────────────
  const topLeft = cells.find(td =>
    parseInt(td.dataset.row ?? 0) === r1 && parseInt(td.dataset.col ?? 0) === c1
  );
  if (!topLeft) return;

  // ── Top-Left 에 span 설정 ─────────────────────────────────────────
  topLeft.setAttribute('rowspan', totalRowspan);
  if (totalColspan > 1) topLeft.setAttribute('colspan', totalColspan);

  // ── 나머지 셀: display:none ───────────────────────────────────────
  cells.forEach(td => { if (td !== topLeft) td.style.display = 'none'; });

  // ── 데이터 모델 동기화 (renderStages 재실행 후에도 복구 가능) ──────
  // stage-td 열(col=0) 처리: _vis 상태 기록
  const stageTds = cells.filter(td => td.classList.contains('stage-td'));
  const topLeftStageTd = stageTds.find(td =>
    parseInt(td.dataset.row ?? 0) === r1 && parseInt(td.dataset.col ?? 0) === c1
  );
  if (topLeftStageTd) {
    const anchorSi = _rxGetSi(topLeftStageTd);
    if (anchorSi !== null && stages[anchorSi]) {
      const anchor = stages[anchorSi];
      const ownRows = (anchor.products || []).filter(p => p.key).length || 1;
      if (!anchor._vis) anchor._vis = {};
      anchor._vis.rowspanBonus = totalRowspan - ownRows;
      anchor._vis.colspanBonus = totalColspan - 1;
      anchor._vis.mergedSis = stageTds
        .filter(td => td !== topLeftStageTd)
        .map(td => _rxGetSi(td))
        .filter(si => si !== null);
      // 피흡수 단계에 hidden 플래그
      anchor._vis.mergedSis.forEach(si => {
        if (!stages[si]) return;
        if (!stages[si]._vis) stages[si]._vis = {};
        stages[si]._vis.hidden = true;
        stages[si]._vis.mergedParent = anchorSi;
      });
    }
  }
  _rxClearSel();
}

// ── 분할 — 숨겨진 셀 전부 복구, rowspan/colspan 1로 초기화 ──────────
function _rxSplitSel() {
  // 선택된 셀이 있으면 그것, 없으면 _rxSelSi 기준
  const cells = selectedCells.length ? selectedCells
    : [..._rxSelSi].map(s => document.querySelector(`.stage-td[data-si="${s}"]`)).filter(Boolean);

  if (!cells.length) return;

  // 기준 셀 (merged rowspan/colspan 가진 셀, 또는 첫 번째)
  const anchor = cells.find(td =>
    (parseInt(td.getAttribute('rowspan')) || 1) > 1 ||
    (parseInt(td.getAttribute('colspan')) || 1) > 1
  ) || cells[0];

  // anchor 의 span 초기화
  anchor.removeAttribute('rowspan');
  anchor.removeAttribute('colspan');

  // 같은 tbody 내 숨겨진 td 전부 복구 (display:none → '')
  const tbody = anchor.closest('tbody');
  if (tbody) {
    tbody.querySelectorAll('td').forEach(td => {
      if (td.style.display === 'none') {
        td.style.display = '';
        // 해당 셀의 rowspan/colspan도 초기화 (병합 전 원래 값인 1로)
        td.removeAttribute('rowspan');
        td.removeAttribute('colspan');
      }
    });
  }

  // ── 데이터 모델 동기화 ────────────────────────────────────────────
  const anchorSi = _rxGetSi(anchor);
  if (anchorSi !== null && stages[anchorSi]) {
    const st = stages[anchorSi];
    const vis = st._vis;
    if (vis) {
      // 피흡수 단계 hidden 해제
      (vis.mergedSis || []).forEach(si => {
        if (stages[si] && stages[si]._vis) {
          stages[si]._vis.hidden = false;
          stages[si]._vis.mergedParent = null;
        }
      });
      vis.rowspanBonus  = 0;
      vis.colspanBonus  = 0;
      vis.mergedSis     = [];
    }
  }
  _rxClearSel();
}

// ── 선택 해제 ────────────────────────────────────────────────────────
function _rxClearSel() {
  _rxSelSi.clear(); selectedCells = []; _rxLastSelSi = null;
  _rxRefreshSelUI();
}

// ── 목차 (TOC) ────────────────────────────
let pageOrder = [];
let tocDragKey = null;
let pageThumbnails = {};

function getPageLabel(key) {
  if (key === 'cover') return '📄 표지';
  if (key === 'cost')  return '💰 비용 요약';
  if (key.startsWith('group_')) {
    const month = parseInt(key.replace('group_', ''));
    const fallback = month >= 1001 ? `${month - 1000}페이지 처방` : (month ? `${month}월 처방` : '기본 처방');
    const lbl = groupLabels[month] || fallback;
    return lbl.slice(0, 14);
  }
  return key;
}

function syncPageOrder() {
  const current = ['cover'];
  const seen = {};
  stages.forEach(st => {
    const k = 'group_' + getStageGroupKey(st);
    if (!seen[k]) { seen[k] = true; current.push(k); }
  });
  if (costVisible) current.push('cost');
  // 기존 순서 유지하되 신규 추가/삭제 반영
  const kept = pageOrder.filter(k => current.includes(k));
  current.forEach(k => { if (!kept.includes(k)) kept.push(k); });
  pageOrder = kept;
}

function getTocPreview(key) {
  if (key === 'cover') {
    const region = document.getElementById('bRegion')?.value.trim() || '';
    const crop   = document.getElementById('bCrop')?.value.trim()   || '';
    const name   = document.getElementById('bName')?.value.trim()   || '';
    const area   = document.getElementById('bArea')?.value.trim()   || '';
    const lines = [
      region || null,
      crop ? crop + (area ? ` (${area}평)` : '') + (rxData.areaType||'농사') : null,
      name  ? `처방전: ${name}` : null,
    ].filter(Boolean);
    if (!lines.length) return '';
    return '<div class="toc-preview">' + lines.map(l => `<div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${l}</div>`).join('') + '</div>';
  }
  if (key.startsWith('group_')) {
    const month = parseInt(key.replace('group_', ''));
    const grp = stages.filter(s => getStageGroupKey(s) === month);
    if (!grp.length) return '';
    const rows = grp.map(st => {
      const prods = (st.products || []).filter(p => p.key);
      const label = getStageLabel(st).replace('\n', ' ');
      return `<div class="toc-preview-row">
        <span class="toc-preview-stage">${label}</span>
        <span class="toc-preview-cnt">${prods.length}개</span>
      </div>`;
    }).join('');
    return `<div class="toc-preview">${rows}</div>`;
  }
  if (key === 'cost') {
    const inv = getInventory();
    const cart = rxData.cart || [];
    let grand = 0;
    cart.forEach(item => {
      const k2 = item.name + '||' + item.size;
      const used = inv[k2] ? inv[k2].used : 0;
      const sp = priceOverrides[k2]?.sp ?? (item.sp || 0);
      grand += sp * used;
    });
    const area = parseInt(document.getElementById('bArea')?.value) || 0;
    const per  = area ? Math.round(grand / area) : 0;
    if (!grand) return '';
    return `<div class="toc-preview">
      <div>합계: ${grand.toLocaleString()}원</div>
      ${per ? `<div>평당: ${per.toLocaleString()}원</div>` : ''}
    </div>`;
  }
  return '';
}

function createPageThumbnail(pageEl) {
  const SCALE = 0.17;
  const W = 840;
  const H = pageEl.scrollHeight || 595;
  const thumbW = Math.round(W * SCALE);
  const thumbH = Math.round(H * SCALE);
  const clone = pageEl.cloneNode(true);
  clone.removeAttribute('data-pagekey');
  clone.style.cssText = `transform:scale(${SCALE});transform-origin:top left;position:absolute;top:0;left:0;width:${W}px;pointer-events:none;`;
  return `<div style="width:${thumbW}px;height:${thumbH}px;overflow:hidden;position:relative;pointer-events:none;border:1px solid #ccc;border-radius:3px;background:#fff;margin-top:5px;">${clone.outerHTML}</div>`;
}

function updateTocThumbnails() {
  pageThumbnails = {};
  const pages = document.querySelectorAll('#printPages [data-pagekey]');
  pages.forEach(pageEl => {
    pageThumbnails[pageEl.dataset.pagekey] = createPageThumbnail(pageEl);
  });
  renderToc();
}

function renderToc() {
  syncPageOrder();
  const list = document.getElementById('tocList');
  if (!list) return;
  if (pageOrder.length <= 1 && !costVisible) {
    list.innerHTML = '<div style="color:#bbb;font-size:11px;text-align:center;padding:20px 8px;">단계를 추가하면<br>목차가 생성됩니다</div>';
    return;
  }
  list.innerHTML = pageOrder.map(k => {
    const extraClass = k === 'cost' ? 'toc-cost' : k === 'cover' ? 'toc-cover' : '';
    return `
    <div class="toc-item ${extraClass}" draggable="true"
      id="tocItem_${k}"
      ondragstart="tocDragStart(event,'${k}')"
      ondragover="tocDragOver(event,'${k}')"
      ondrop="tocDrop(event,'${k}')"
      ondragend="tocDragEnd()">
      <div class="toc-item-head">
        <span class="toc-drag">⠿</span>
        <span class="toc-label">${getPageLabel(k)}</span>
      </div>
      ${pageThumbnails[k] || getTocPreview(k)}
    </div>`;
  }).join('');
}

function tocDragStart(e, key) {
  tocDragKey = key;
  e.dataTransfer.effectAllowed = 'move';
}
function tocDragOver(e, key) {
  e.preventDefault();
  document.querySelectorAll('.toc-item').forEach(el => el.classList.remove('toc-drag-over'));
  const el = document.getElementById('tocItem_' + key);
  if (el) el.classList.add('toc-drag-over');
}
function tocDrop(e, targetKey) {
  e.preventDefault();
  document.querySelectorAll('.toc-item').forEach(el => el.classList.remove('toc-drag-over'));
  if (!tocDragKey || tocDragKey === targetKey) return;
  const fi = pageOrder.indexOf(tocDragKey), ti = pageOrder.indexOf(targetKey);
  if (fi === -1 || ti === -1) return;
  pageOrder.splice(fi, 1);
  pageOrder.splice(ti, 0, tocDragKey);
  renderToc();
  schedulePreview();
}
function tocDragEnd() {
  document.querySelectorAll('.toc-item').forEach(el => el.classList.remove('toc-drag-over'));
  tocDragKey = null;
}

// ── TOC 패널 리사이즈 ──────────────────────
(function() {
  let resizing = false, startX = 0, startW = 0;
  document.addEventListener('DOMContentLoaded', () => {
    const handle = document.getElementById('tocResizeHandle');
    if (!handle) return;
    handle.addEventListener('mousedown', e => {
      resizing = true;
      startX = e.clientX;
      startW = document.getElementById('tocPanel').offsetWidth;
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
      e.preventDefault();
    });
    document.addEventListener('mousemove', e => {
      if (!resizing) return;
      const delta = startX - e.clientX; // 왼쪽으로 드래그 = 넓어짐
      const newW = Math.min(400, Math.max(100, startW + delta));
      const layout = document.getElementById('mainLayout');
      if (layout) layout.style.gridTemplateColumns = `400px 1fr ${newW}px`;
    });
    document.addEventListener('mouseup', () => {
      if (!resizing) return;
      resizing = false;
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
    });
  });
})();

// ── 비용 요약 ──────────────────────────────
let costVisible = false;
let priceOverrides = {}; // key → {retail, sp}
const COST_ITEM_RE = /^(운송비|지게차|운반비|하차비|상차비|배송비|포장비)$/;

function openCostModal() {
  const inv = getInventory();
  const cart = rxData.cart || [];
  const area = parseInt(document.getElementById('bArea').value) || 0;

  // 사용된 제품만 표시
  const rows = cart.map(item => {
    const key = item.name + '||' + item.size;
    const used = inv[key] ? inv[key].used : 0;
    if (!used) return null;
    const retail = priceOverrides[key]?.retail ?? (item.retail || 0);
    const sp     = priceOverrides[key]?.sp     ?? (item.sp     || 0);
    return { key, name: item.name, size: item.size, retail, sp, used };
  }).filter(Boolean);

  if (!rows.length) {
    alert('처방 단계에 제품을 먼저 추가해주세요.');
    return;
  }

  // 열자마자 미리보기에 즉시 반영
  if (!costVisible) {
    costVisible = true;
    renderToc();
    schedulePreview();
  }

  const areaLabel = area ? `표지 평수 기준 (${area}평)` : '⚠️ 표지 평수 미입력';
  let tableHtml = `<table class="cost-table">

      <th>사용수량</th><th>계</th>
    </tr></thead><tbody>`;
  rows.forEach(r => {

    const discBadge = discPct > 0
      ? `<span style="font-size:10px;color:#e53935;font-weight:700;margin-left:3px;">-${discPct}%</span>` : '';

function setPriceOverride(key, field, val) {
  if (!priceOverrides[key]) priceOverrides[key] = {};
  priceOverrides[key][field] = parseFloat(val) || 0;
}

function updateCostModal() {
  const inv = getInventory();
  const cart = rxData.cart || [];
  const area = parseInt(document.getElementById('bArea').value) || 0;
  let grand = 0;
  (cart || []).forEach(item => {
    const key = item.name + '||' + item.size;
    const used = inv[key] ? inv[key].used : 0;
    if (!used) return;
    const sp = priceOverrides[key]?.sp ?? (item.sp || 0);
    const total = sp * used;
    grand += total;
    const el = document.getElementById('costRow_' + key.replace(/\|/g,'_'));
    if (el) el.textContent = total.toLocaleString() + '원';
  });
  const el1 = document.getElementById('costGrandTotal');
  const el2 = document.getElementById('costPerPyeong');
  if (el1) el1.textContent = grand.toLocaleString() + '원';
  if (el2) el2.textContent = area ? Math.round(grand/area).toLocaleString()+'원' : '표지 평수 미입력';
  schedulePreview();
}

function generateSummaryCardHtml(areaNum) {
  const region = document.getElementById('bRegion').value.trim();
  const area   = document.getElementById('bArea').value.trim();
  const crop   = document.getElementById('bCrop').value.trim();
  const name   = document.getElementById('bName').value.trim();
  const phone  = rxData.phone || '';
  const addr   = rxData.addr  || '';
  areaNum = areaNum || parseInt(area) || 0;

  function getSpAmt(key) {
    if (priceOverrides[key]?.sp !== undefined) return priceOverrides[key].sp;
    const c = (rxData.cart||[]).find(c => c.name+'||'+c.size === key);
    return c ? (c.sp || 0) : 0;
  }

  const groups = {};
  stages.forEach(st => {
    const k = getStageGroupKey(st);
    if (!groups[k]) groups[k] = [];
    groups[k].push(st);
  });

  const orderedMks = pageOrder
    .filter(k => k.startsWith('group_'))
    .map(k => parseInt(k.replace('group_', '')));

  if (!orderedMks.length) return '';

  // 그룹 레이블 스마트 추출
  // 우선순위: 기비타입 → realMonth → st.month → purpose/stageLabel 텍스트 → groupLabel 텍스트 → 기비용
  function getMonthLabel(mk) {
    const stagesInGroup = groups[mk] || [];

    // 0. 기비 타입 단계는 레이블에 "N월" 패턴이 있어도 기비용으로 분류
    //    (예: "감사비료 수확 후 및 3월-4월" → 기비 시기 표기이지 월별 추비 아님)
    if (stagesInGroup.some(st => st.type === '기비' || st.type === '감사비료')) return '기비용';

    // 1. realMonth (PDF 파싱 시 가짜 월 부여 전 보존된 진짜 월) 우선
    //    그 다음 st.month (1-12 범위 직접)
    const realMonths = stagesInGroup.map(st => {
      const rm = parseInt(st.realMonth);
      if (rm >= 1 && rm <= 12) return rm;
      const m = parseInt(st.month);
      if (m  >= 1 && m  <= 12) return m;
      return null;
    }).filter(Boolean);
    if (realMonths.length) {
      const freq = {};
      realMonths.forEach(m => { freq[m] = (freq[m]||0)+1; });
      const top = parseInt(Object.entries(freq).sort((a,b)=>b[1]-a[1])[0][0]);
      return top + '월';
    }

    // 2. stage 필드(purpose·stageLabel·stageLabelOverride)에서 "N월" 패턴
    for (const st of stagesInGroup) {
      for (const text of [st.purpose||'', st.stageLabel||'', st.stageLabelOverride||'']) {
        const pm = text.match(/(\d{1,2})\s*월/);
        if (pm) return parseInt(pm[1]) + '월';
      }
    }

    // 3. groupLabel에서 "N월" 패턴
    const lbl = groupLabels[mk] || '';
    const mMatch = lbl.match(/(\d{1,2})\s*월/);
    if (mMatch) return parseInt(mMatch[1]) + '월';

    // 4. mk 자체가 월 번호 (1-12)
    if (mk >= 1 && mk <= 12) return mk + '월';

    // 5. 기비용: month=0 이거나 기비/경운/토양 키워드
    const hasBase = stagesInGroup.some(st =>
      parseInt(st.month) === 0 ||
      /기비|밑거름|경운|토양/.test((st.stageLabel||'')+(st.purpose||''))
    );
    if (hasBase || mk === 0 || !stagesInGroup.length) return '기비용';

    // 6. 짧은 레이블 그대로 (기타 케이스)
    if (lbl && lbl.length <= 6) return lbl;
    return '기비용';
  }

  function groupTotal(mk) {
    return (groups[mk]||[]).reduce((s, st) =>
      s + (st.products||[]).reduce((ss, p) => {
        if (!p.key) return ss;
        return ss + getSpAmt(p.key) * (parseFloat(p.qty) || 0);
      }, 0), 0);
  }

  const calcGrand = orderedMks.reduce((s, mk) => s + groupTotal(mk), 0);
  // 계산값이 없으면 PDF 추출값 폴백
  const grand     = calcGrand || rxData.extractedTotalCost || 0;
  const calcPP    = areaNum ? Math.round(calcGrand / areaNum) : 0;
  const perPyeong = calcPP  || rxData.extractedUnitPrice   || 0;
  const hasPrices = calcGrand > 0;

  // 같은 월 레이블의 그룹을 병합 (5월 2페이지 → 5월 1행으로 합산)
  // pageOrder 순서를 유지하면서 중복 레이블을 병합
  const mergedRows = [];
  const labelSeen  = {};
  orderedMks.forEach(mk => {
    const lbl = getMonthLabel(mk);
    const tot = groupTotal(mk);
    if (labelSeen[lbl] !== undefined) {
      mergedRows[labelSeen[lbl]].tot += tot;
    } else {
      labelSeen[lbl] = mergedRows.length;
      mergedRows.push({ lbl, tot });
    }
  });

  // 행 높이 균등 분배: 월행수 + 고객행 + 푸터행 + 헤더행 = 총 행수
  // height:1px 로 설정하면 브라우저가 테이블 전체 높이를 균등 분배
  const pdfBreakdown = rxData.extractedBreakdown || [];
  const monthRows = mergedRows.map(({ lbl, tot }) => {
    const pp = areaNum ? Math.round(tot / areaNum) : 0;
    // 가격 미입력 시 PDF 추출 비용 데이터로 폴백
    const pdfRow = !hasPrices && pdfBreakdown.length
      ? pdfBreakdown.find(r => r.label === lbl) : null;
    const dispTot = hasPrices ? tot : (pdfRow ? pdfRow.cost : 0);
    const dispPp  = hasPrices ? pp : (pdfRow ? (pdfRow.unitPrice || (areaNum ? Math.round(pdfRow.cost / areaNum) : 0)) : 0);
    return `<tr style="height:1px;">
      <td class="sc-month">${lbl}</td>
      <td class="sc-amt">${dispTot ? dispTot.toLocaleString() + '원' : '-'}</td>
      <td class="sc-pp">${dispPp ? '평당(' + dispPp.toLocaleString() + '원)' : '-'}</td>
    </tr>`;
  }).join('');

  const title = `${region||''}지역 ${crop||''}${area ? '(' + area + '평)' : ''}농사 ${name||''}님 처방전`;
  const grandDisp = grand ? grand.toLocaleString() + '원' : '-';
  const ppDisp    = perPyeong ? perPyeong.toLocaleString() + '원' : '-';

  // content-page 안쪽: 595px - padding(14px*2) = 567px, border(3px*2) 제외 → 561px
  return `<div class="page-card" data-pagekey="cost">
    <div class="content-page">
      <div class="content-inner" style="overflow:hidden;box-sizing:border-box;">
        <table class="sc-table" style="height:561px;">
          <thead>
            <tr class="sc-title-row" style="height:1px;"><td colspan="3">${title}</td></tr>
          </thead>
          <tbody style="height:100%;">
            ${monthRows}
            <tr class="sc-cust-row" style="height:1px;">
              <td colspan="3">${name||''}님${phone ? '&nbsp;&nbsp;전화:' + phone : ''}${addr ? '&nbsp;&nbsp;' + addr : ''}</td>
            </tr>
          </tbody>
          <tfoot>
            <tr class="sc-footer-row" style="height:1px;">
              <td colspan="2"><img src="logo.png" style="height:20px;vertical-align:middle;"> 담당자:${managerPhone}&nbsp;&nbsp;합계=${grandDisp}</td>
              <td>평당(${ppDisp})</td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>
  </div>`;
}

// ── 처방전 생성 ───────────────────────────
function generatePreview() {
  // 인라인 편집 중이면 re-render 보류
  if (_inlineEditing) { _pendingPreview = true; return; }
  // 렌더링 전 항상 typeNum 재계산 — 관주(1번)/관주(2번) 등 자동 라벨 보장
  recalcTypeNums();

  const region = document.getElementById('bRegion').value.trim();
  const area = document.getElementById('bArea').value.trim();
  const crop = document.getElementById('bCrop').value.trim();
  const name = document.getElementById('bName').value.trim();
  const areaType = getBAreaType();

  // ── 월별 그룹 미리 빌드 ──
  const groups = {};
  stages.forEach(st => {
    const k = getStageGroupKey(st);
    if (!groups[k]) groups[k] = [];
    groups[k].push(st);
  });

  // 페이지별 최대 행 수 → 자동 폰트 크기 (전체 합계가 아닌 한 페이지 기준)
  let maxPageRows = 0;
  Object.values(groups).forEach(stagesInGroup => {
    const rows = stagesInGroup.reduce((s, st) => s + ((st.products||[]).filter(p=>p.key).length || 1), 0);
    if (rows > maxPageRows) maxPageRows = rows;
  });
  const fs = maxPageRows <= 5 ? 18 : maxPageRows <= 8 ? 16 : maxPageRows <= 11 ? 14 : maxPageRows <= 15 ? 12 : maxPageRows <= 19 ? 10 : 9;
  const thfs = Math.max(fs - 1, 9);

  function buildGroupPage(monthKey) {
    const stagesInGroup = groups[monthKey] || [];
    // ?? 사용: 빈 문자열('')이면 그대로 공란, undefined/null일 때만 폴백
    const pageTitle = groupLabels[monthKey] ?? '';
    let rows = '';
    let rowOffset = 0; // 논리 행 인덱스 (data-row 부여 기준)

    // ── v19: flat-row 방식 — 병합 로직 완전 재작성 ──
    // Step 1: 모든 행을 flat list로 펼쳐 rowNum 사전 계산
    const _flatRows = [];
    {
      let _absRow = 0;
      stagesInGroup.forEach(st => {
        const si   = stages.indexOf(st);
        const prods = (st.products||[]).map((p,idx)=>({p,idx})).filter(({p})=>p.key);
        // ★ getStageLabelRaw: stageDisplayText/stageRawCell 원문 우선 사용
        //   → getStageLabel은 관주/엽면에서 날짜를 무시하므로 사용 금지
        const label = getStageLabelRaw(st);
        const labelHtml = label.replace(/\n/g,'<br>'); // innerHTML 삽입용 줄바꿈 변환
        const vis  = st._vis || {};
        const isMD = st.type === '관주' || st.type === '엽면'; // isMergedDesc
        if (!prods.length) {
          _flatRows.push({ empty:true, si, label, labelHtml, hidden:!!vis.hidden, rowNum:_absRow });
          _absRow++;
        } else {
          prods.forEach(({p, idx:pi}, rowIdx) => {
            _flatRows.push({ empty:false, si, label, labelHtml, p, pi, rowIdx, prods, isMD, rowNum:_absRow });
            _absRow++;
          });
        }
      });
    }

    // Step 2: 각 행에 "label-group start 여부 + stage rowspan" 정보 주입
    for (let _i = 0; _i < _flatRows.length; _i++) {
      const _prev = _i > 0 ? _flatRows[_i-1].label : null;
      _flatRows[_i].isLabelStart = (_flatRows[_i].label !== _prev);
      if (_flatRows[_i].isLabelStart) {
        // 이 라벨 그룹이 몇 tr을 차지하는지 (= stage-td rowspan)
        let _span = 0;
        for (let _j = _i; _j < _flatRows.length && _flatRows[_j].label === _flatRows[_i].label; _j++) _span++;
        _flatRows[_i].labelSpan = _span;
        // 그룹 내 non-empty 행의 desc가 모두 같은지 확인 (desc 자동 병합용)
        const _gd = _flatRows.slice(_i, _i + _span)
          .filter(r => !r.empty && !r.isMD)
          .map(r => r.p.detailCellDisplayOverride || r.p.detailCellRaw || r.p.usageDisplayText || r.p.desc || '');
        _flatRows[_i].descAllSame = _gd.length > 1 && _gd.every(d => d === _gd[0]);
      }
    }

    // Step 3: 행 렌더 — stage-td는 isLabelStart&&rowIdx===0 일 때만, 그 외 완전 생략
    const _wd  = html => `<div class="desc-inner">${html}</div>`;
    const _emp = '<span style="color:#ccc;font-size:11px;">+</span>';
    let _descSkipUntil = -1; // desc 병합 중인 경우, 이 인덱스까지 descTd 생략

    _flatRows.forEach((row, _i) => {
      const isFirst = row.isLabelStart && (row.empty || row.rowIdx === 0);

      if (row.empty) {
        const hd = row.hidden ? ' style="display:none"' : '';
        if (isFirst) {
          const sTd = `<td class="stage-td rx-editable" data-edit="stage-date" data-si="${row.si}" data-monthkey="${monthKey}" ` +
            `rowspan="${row.labelSpan}" data-row="${row.rowNum}" data-col="0" ` +
            `style="vertical-align:middle;text-align:center;" onclick="openRxEdit(this,event)">` +
            `<strong>${row.labelHtml}</strong></td>`;
          rows += `<tr>${sTd}<td colspan="4" data-row="${row.rowNum}" data-col="1"${hd} style="color:#bbb;text-align:center;font-size:12px;">제품 없음</td></tr>`;
        } else {
          rows += `<tr><td colspan="4" data-row="${row.rowNum}" data-col="1"${hd} style="color:#bbb;text-align:center;font-size:12px;">제품 없음</td></tr>`;
        }
        rowOffset++;
        return;
      }

      const { si, p, pi, rowIdx, prods, isMD, labelHtml, rowNum } = row;
      const lSpan = row.isLabelStart ? row.labelSpan : null;

      const cartItem = (rxData.cart||[]).find(c => c.name+'||'+c.size === p.key);
      const prodName = cartItem ? cartItem.name : p.key.split('||')[0];
      const prodSize = p.capacity || (cartItem ? cartItem.size : p.key.split('||')[1] || '');
      const qtyCell  = p.qty ? formatQty(p.qty, p.unit) : '';
      const areaLine = p.prodArea ? ` <span style="font-size:0.85em;color:#555;font-weight:normal;">(${p.prodArea}평)</span>` : '';

      const nameTd = `<td class="product-td rx-editable" data-edit="prod-name" data-si="${si}" data-pi="${pi}" data-row="${rowNum}" data-col="1" onclick="openRxEdit(this,event)">${prodName}${areaLine}</td>`;
      const sizeTd = `<td class="size-td rx-editable" data-edit="prod-size" data-si="${si}" data-pi="${pi}" data-row="${rowNum}" data-col="2" onclick="openRxEdit(this,event)">${prodSize}</td>`;
      const qtyTd  = `<td class="qty-td rx-editable" data-edit="prod-qty" data-si="${si}" data-pi="${pi}" data-row="${rowNum}" data-col="3" onclick="openRxEdit(this,event)">${qtyCell||'—'}</td>`;

      // ── desc 열 병합 ─────────────────────────────────────────────
      let descTd = '';
      const skipDesc = _i <= _descSkipUntil;
      if (!skipDesc) {
        const descText = p.detailCellDisplayOverride || p.detailCellRaw || p.usageDisplayText || p.desc || '';
        const inner    = descText ? descText.replace(/\n/g,'<br>') : _emp;
        if (isMD && rowIdx === 0) {
          // 관주/엽면: 이 stage의 모든 제품 desc를 하나로 병합
          const allD = [...new Set(prods.map(({p:pp}) =>
            pp.detailCellDisplayOverride || pp.detailCellRaw || pp.usageDisplayText || pp.desc || '').filter(Boolean))];
          const mInner = allD.length ? allD.map(d => d.replace(/\n/g,'<br>')).join('<br>') : _emp;
          descTd = `<td class="desc-td desc-td-merged rx-editable" data-edit="prod-desc" data-si="${si}" data-pi="${pi}" data-row="${rowNum}" data-col="4" onclick="openRxEdit(this,event)" rowspan="${prods.length}">${_wd(mInner)}</td>`;
          _descSkipUntil = _i + prods.length - 1;
        } else if (!isMD && isFirst && row.descAllSame && row.labelSpan > 1) {
          // 같은 라벨 그룹이고 desc가 모두 동일: 그룹 전체 병합
          descTd = `<td class="desc-td desc-td-merged rx-editable" data-edit="prod-desc" data-si="${si}" data-pi="${pi}" data-row="${rowNum}" data-col="4" onclick="openRxEdit(this,event)" rowspan="${row.labelSpan}">${_wd(inner)}</td>`;
          _descSkipUntil = _i + row.labelSpan - 1;
        } else if (!isMD) {
          // 개별 desc
          descTd = `<td class="desc-td rx-editable" data-edit="prod-desc" data-si="${si}" data-pi="${pi}" data-row="${rowNum}" data-col="4" onclick="openRxEdit(this,event)">${_wd(inner)}</td>`;
        }
        // isMD && rowIdx > 0: 이미 _descSkipUntil 처리됨 → descTd = ''
      }

      // ── stage-td: 라벨 그룹의 첫 행에만 렌더, 나머지는 완전 생략 ──
      if (isFirst) {
        const sTd = `<td class="stage-td rx-editable" data-edit="stage-date" data-si="${si}" data-monthkey="${monthKey}" ` +
          `rowspan="${lSpan}" data-row="${rowNum}" data-col="0" ` +
          `style="vertical-align:middle;text-align:center;" onclick="openRxEdit(this,event)">` +
          `<strong>${labelHtml}</strong></td>`;
        rows += `<tr>${sTd}${nameTd}${sizeTd}${qtyTd}${descTd}</tr>`;
      } else {
        rows += `<tr>${nameTd}${sizeTd}${qtyTd}${descTd}</tr>`;
      }

      if (rowIdx === prods.length - 1) rowOffset += prods.length;
    });
    const allFuncRows = stagesInGroup.filter(s=>s.funcTags&&s.funcTags.length)
      .map(s=>({tags:s.funcTags,color:s.funcColor||'#ffffff',si:stages.indexOf(s)}));
    const funcHeadHtml = allFuncRows.map(r=>
      `<tr class="rx-funchead-tr"><th colspan="5" class="rx-editable" data-edit="func-tags" data-si="${r.si}" onclick="openRxEdit(this,event)"
        style="background:${r.color};color:#111;font-size:22px;font-weight:700;
        text-align:center;padding:0 16px;height:49px;border:3.5px solid var(--teal);letter-spacing:.5px;cursor:pointer;vertical-align:middle;">
        ${r.tags.join('&nbsp;&nbsp;·&nbsp;&nbsp;')}
      </th></tr>`).join('');
    return `<div class="page-card" data-pagekey="group_${monthKey}">
      <div class="content-page"><div class="content-inner">
        <table class="rx-table">
          <colgroup>
            <col style="width:15%;">
            <col style="width:35%;">
            <col style="width:10%;">
            <col style="width:10%;">
            <col style="width:30%;">
          </colgroup>
          <tbody>
            <tr class="rx-title-tr">
              <td colspan="5" class="page-purpose rx-editable" data-edit="page-title" data-monthkey="${monthKey}" onclick="openRxEdit(this,event)">${pageTitle}</td>
            </tr>
            ${funcHeadHtml}
            <tr class="rx-header-row">
              <th>시기/단계</th>
              <th>제품명</th>
              <th>용량</th>
              <th>사용량</th>
              <th>물량/평수 (사용법)</th>
            </tr>
            ${rows}
            ${showBottomNote && monthKey === lastGroupKey ? `<tr class="rx-bottom-note-tr">
              <td colspan="5">※ 세균성+바이러스 예방을 위하여 첫 물줄 때 <strong>엘쎄로닥터 CK-1</strong>을
              50~80℃ 뜨거운 물에 녹여서 큰 통에 혼합 관주합니다.<br>
              관주 시 물25말 : 1000평 &nbsp;—&nbsp; 뿌리발근 · 뿌리활착 · 뿌리활력 · 작물활성</td>
            </tr>` : ''}
            <tr class="rx-footer-tr">
              <td colspan="5" class="page-footer-bar"><div class="footer-inner"><img src="logo.png" style="height:34px;vertical-align:middle;"> 천연바이오:1577-5963 &nbsp;&nbsp; 담당자:${managerPhone}</div></td>
            </tr>
          </tbody>
        </table>
      </div></div>
    </div>`;
  }

  // ── 정식+엘세로닥터 하단 안내문 감지 ──
  const _has정식 = stages.some(st => st.type === '정식당일' || st.type === '정식후');
  const _has엘세로닥터 = stages.some(st => (st.products||[]).some(p => p.key && p.key.includes('엘세로닥터')));
  const showBottomNote = _has정식 && _has엘세로닥터;
  const groupPageKeys = pageOrder.filter(k => k.startsWith('group_')).map(k => parseInt(k.replace('group_','')));
  const lastGroupKey = groupPageKeys[groupPageKeys.length - 1];

  // ── 표지 HTML ──
  const ccText = rxData.coverCustomText || {};
  const ccFs   = rxData.coverCustomFs   || {};
  const cropText    = ccText.cropArea !== undefined ? ccText.cropArea
                    : (crop ? crop + (area ? `(${area}평)` : '') + areaType : '');
  const regionText  = ccText.region  !== undefined ? ccText.region  : region;
  const rxSuffix    = ccText.rx      !== undefined ? ccText.rx      : (name || '고객명');
  const rxText      = '처방전:' + rxSuffix;
  // 세 줄 중 가장 긴 텍스트 기준으로 폰트 크기 통일 (커스텀 없는 경우)
  const allLines = [regionText, cropText, rxText].filter(Boolean);
  const autoFS   = allLines.length ? Math.min(...allLines.map(t => coverFontSize(t))) : 46;
  const lineFs = {
    region:   ccFs.region   || autoFS,
    cropArea: ccFs.cropArea || autoFS,
    rx:       ccFs.rx       || autoFS
  };
  const coverHtml = `<div class="page-card" data-pagekey="cover">
    <div class="cover-page">
      <div class="cover-naturebio">N &nbsp; A &nbsp; T &nbsp; U &nbsp; R &nbsp; E &nbsp; B &nbsp; I &nbsp; O</div>
      <div class="cover-box">
        ${regionText ? `<div class="cover-region cover-editable" style="font-size:${lineFs.region}px;" onclick="editCoverLine('region')">${regionText.replace(/\n/g,'<br>')}</div>` : ''}
        ${cropText ? `<div class="cover-crop-area cover-editable" style="font-size:${lineFs.cropArea}px;" onclick="editCoverLine('cropArea')">${cropText.replace(/\n/g,'<br>')}</div>` : ''}
        <div class="cover-rx cover-editable" style="font-size:${lineFs.rx}px;" onclick="editCoverLine('rx')">${rxText.replace(/\n/g,'<br>')}</div>
      </div>
      <div class="cover-logo-area">
        <div class="cover-logo-top">
          <img class="leaf-icon" src="logo.png" alt="천연바이오">
          <div class="cover-logo-texts">
            <span class="cover-logo-sub">미 래 농 업 의 선 두 기 업</span>
            <span class="cover-logo-name">천 연 바 이 오</span>
          </div>
        </div>
        <div class="cover-tagline-bar">Top-ranking company of agricultural future</div>
      </div>
    </div>
  </div>`;

  // ── pageOrder 순서로 조합 ──
  syncPageOrder();
  renderToc();
  let html = '';
  pageOrder.forEach(key => {
    if (key === 'cover') { html += coverHtml; return; }
    if (key === 'cost')  { html += generateSummaryCardHtml(parseInt(area)||0); return; }
    if (key.startsWith('group_')) {
      const monthKey = parseInt(key.replace('group_',''));
      if (groups[monthKey]) html += buildGroupPage(monthKey);
    }
  });

  // ── ##RX## 데이터 내장 (PDF 텍스트 레이어용) ──
  try {
    const rxEmbed = {
      n: name, rg: region, ar: area, cr: crop, at: areaType,
      cart: (() => {
        // 단계별 실사용량 집계 (rxData.cart의 주문수량 대신 처방 단계 총 사용량 사용)
        const agg = {};
        stages.forEach(s => (s.products||[]).forEach(p => {
          if (!p.key) return;
          const [nm, sz] = p.key.split('||');
          if (!agg[p.key]) agg[p.key] = { name: nm||'', size: sz||'', qty: 0 };
          agg[p.key].qty += (p.qty || 0);
        }));
        const aggList = Object.values(agg).filter(v => v.qty > 0);
        if (aggList.length > 0) {
          return aggList.map(v => {
            const key = v.name + '||' + v.size;
            const override = priceOverrides[key] || {};
            const cartItem = (rxData.cart||[]).find(c => (c.name+'||'+(c.size||'')) === key);
            const retail = override.retail ?? (cartItem?.retail || 0);
            const sp = override.sp ?? (cartItem?.sp || 0);
            return [v.name, v.size, v.qty, retail, sp];
          });
        }
        // 단계 미설정 시 rxData.cart 그대로 사용
        return (rxData.cart||[]).map(c => [c.name, c.size, c.qty, c.retail, c.sp]);
      })(),
      st: stages.map(s => ({
        m: s.month, pg: s.pageGroup ?? undefined, sp: s.sourcePage ?? undefined, pt: s.pageType || undefined, t: s.type, d: s.days, dr: s.dateRange, p: s.purpose,
        ft: s.funcTags, fc: s.funcColor,
        pr: (s.products||[]).map(p => [p.key, p.qty, p.unit, p.desc, p.prodArea||0, p.capacity||'']),
        a: s.area||0, to: s.typeNumOverride||0, tw: s.typeNumWord||'',
        sl: s.stageLabelOverride||'', lb: s.stageLabel||'',
        // v18: 표시 텍스트 3종 — 어떤 경로로 불러와도 자동번호 동작 보장
        sdt: s.stageDisplayText||'', src: s.stageRawCell||'', sdo: s.stageDisplayOverride||''
      })),
      po: pageOrder, cv: costVisible,
      po2: Object.keys(priceOverrides).length ? priceOverrides : undefined,
      gl: Object.keys(groupLabels).length ? groupLabels : undefined,
      go: stageGroupOrder.length ? stageGroupOrder : undefined
    };
    const rxB64 = btoa(encodeURIComponent(JSON.stringify(rxEmbed)));
    // Chrome print-to-PDF 텍스트 레이어 보장:
    // 페이지 맨 끝에 6pt 검정 텍스트로 삽입 — Chrome Skia는 색깔·크기 무관하게 텍스트 레이어에 포함
    // word-break:break-all 로 base64 긴 문자열이 잘리지 않게 처리
    html += `<div class="rx-embed-data">##RX##${rxB64}##RX##</div>`;
  } catch(e) { console.warn('RX embed error:', e); }

  const preview = document.getElementById('previewArea');
  preview.innerHTML = `<div class="print-pages" id="printPages" style="--rx-fs:${fs}px;--rx-th:${thfs}px;">${html}</div>`;
  // 리사이즈 저장 값 즉시 복원 (DOM 재생성 후 보존된 너비/높이 재적용)
  _rxRestoreResize();
  // 행(가로선) 리사이즈 핸들 자동 삽입
  _rxInjectRowHandles();
  setTimeout(updateTocThumbnails, 80);
  if (window.innerWidth <= 768) setTimeout(applyMobilePreviewScale, 120);
  // v18: 화면 미리보기 자동 축소 — DOM 렌더링 후 실행
  setTimeout(applyPreviewAutoFit, 150);
  // autofit 완료 후 모든 col/tr에 px 고정값 삽입 (리사이즈 기준점 확립)
  setTimeout(_rxInitTableSizes, 230);
  // 헤더 텍스트 1줄 맞춤 (autofit 후 실제 width 확정된 시점)
  setTimeout(fitPagePurposeText, 280);
}

// ── 헤더(page-purpose) 텍스트 자동 축소 — 1줄 고정 ──────────────────────
function fitPagePurposeText() {
  document.querySelectorAll('.page-purpose').forEach(el => {
    el.style.fontSize = ''; // CSS 기본값(22px)으로 리셋
    const w = el.offsetWidth || el.parentElement?.offsetWidth || 0;
    if (!w) return;
    let fs = parseFloat(getComputedStyle(el).fontSize) || 22;
    while (el.scrollWidth > w && fs > 9) {
      fs -= 0.5;
      el.style.fontSize = fs + 'px';
    }
  });
}

function doPrint() {
  generatePreview();
  setTimeout(() => {
    fitPagePurposeText();
    // ── document.title 트릭: ##RX## 데이터를 PDF Title 메타데이터에 삽입 ──
    // Chrome print-to-PDF 는 document.title 을 PDF의 Title 필드에 저장하므로
    // index.html 에서 getMetadata().info.Title 로 읽어낼 수 있다.
    const embedEl = document.querySelector('.rx-embed-data');
    const embedText = embedEl ? embedEl.textContent.trim() : '';
    const rxm = embedText.match(/##RX##([A-Za-z0-9+/=]+)##RX##/);
    const _origTitle = document.title;
    if (rxm) {
      document.title = '##RX##' + rxm[1] + '##RX##';
    }
    window.addEventListener('afterprint', function restoreTitle() {
      document.title = _origTitle;
      window.removeEventListener('afterprint', restoreTitle);
    });
    window.print();
  }, 200);
}

// ── 인쇄 자동 축소 (A4 landscape 한 페이지 잘림 방지) ─────────────────────────
// A4 landscape 에서 content-page 안전 높이 = 페이지(595px) - 상하 여백
const PRINT_SAFE_H   = 553;  // px — 초과 시 축소 시작
const PRINT_MIN_ZOOM = 0.88; // 최소 축소 한도 (가독성 하한)

function applyPrintAutoFit() {
  document.querySelectorAll('.page-card').forEach(card => {
    const cp = card.querySelector('.content-page');
    const ci = card.querySelector('.content-inner');
    if (!cp || !ci) return;

    // 이전 축소 리셋
    cp.style.removeProperty('--rx-fs');
    cp.style.removeProperty('zoom');
    cp.classList.remove('print-compact');

    const _needsFit = () =>
      ci.scrollHeight > ci.clientHeight * 1.05 ||
      ci.scrollWidth  > ci.clientWidth  * 1.02;

    if (!_needsFit()) return;  // 축소 불필요

    // Step 1: 폰트 2px 축소
    const curFs = parseInt(getComputedStyle(cp).getPropertyValue('--rx-fs')) || 17;
    const newFs = Math.max(9, curFs - 2);
    cp.style.setProperty('--rx-fs', newFs + 'px');
    if (!_needsFit()) { card.dataset.printScaled = '1'; return; }

    // Step 2: 셀 padding / line-height 축소
    cp.classList.add('print-compact');
    if (!_needsFit()) { card.dataset.printScaled = '1'; return; }

    // Step 3: 전체 zoom 축소 — 세로·가로 중 더 큰 초과 비율 기준
    const scaleH = ci.clientHeight / ci.scrollHeight;
    const scaleW = ci.clientWidth  / ci.scrollWidth;
    const scale  = Math.max(PRINT_MIN_ZOOM, Math.min(scaleH, scaleW));
    cp.style.zoom = scale;
    card.dataset.printScaled = '1';
  });
}

function removePrintAutoFit() {
  document.querySelectorAll('[data-print-scaled]').forEach(card => {
    const cp = card.querySelector('.content-page');
    if (cp) {
      cp.style.removeProperty('--rx-fs');
      cp.style.removeProperty('zoom');
      cp.classList.remove('print-compact');
    }
    delete card.dataset.printScaled;
  });
}

window.addEventListener('beforeprint', () => {
  // 사용자 조절 resize 값을 인라인 스타일로 재적용 → @media print에서도 동일하게 유지
  _rxRestoreResize();
  applyPrintAutoFit();
});
window.addEventListener('afterprint',  removePrintAutoFit);

// ── 화면 미리보기 자동 축소 (실시간 미리보기 잘림 방지) ──────────────────────
// content-inner overflow:hidden 때문에 내용이 길면 화면에서 잘림
// generatePreview() 후 자동 실행해서 각 페이지를 축소 적용
const PREVIEW_SAFE_H   = 563;  // px — content-page(595) - padding(14*2) - border 여유
const PREVIEW_MIN_ZOOM = 0.80; // 화면 미리보기 최소 zoom (인쇄보다 더 축소 허용)

function applyPreviewAutoFit() {
  document.querySelectorAll('.page-card').forEach(card => {
    const cp = card.querySelector('.content-page');
    const ci = card.querySelector('.content-inner');
    if (!cp || !ci) return;

    // 이전 미리보기 축소 리셋
    cp.style.removeProperty('--rx-fs');
    cp.style.removeProperty('zoom');
    cp.classList.remove('print-compact');
    delete card.dataset.previewScaled;

    // 세로·가로 모두 체크 (table-layout:fixed 여도 scrollWidth 가 넘칠 수 있음)
    const _needsFit = () =>
      ci.scrollHeight > ci.clientHeight * 1.05 ||
      ci.scrollWidth  > ci.clientWidth  * 1.02;

    if (!_needsFit()) return;  // 축소 불필요

    // Step 1: 폰트 점진적 축소 (최대 3px)
    const baseFs = parseInt(getComputedStyle(cp).getPropertyValue('--rx-fs')) || 17;
    const newFs  = Math.max(9, baseFs - 3);
    cp.style.setProperty('--rx-fs', newFs + 'px');
    if (!_needsFit()) { card.dataset.previewScaled = '1'; return; }

    // Step 2: 셀 padding / line-height 축소 (.print-compact 재사용)
    cp.classList.add('print-compact');
    if (!_needsFit()) { card.dataset.previewScaled = '1'; return; }

    // Step 3: 전체 zoom 축소 — 세로·가로 중 더 큰 초과 비율 기준
    const scaleH = ci.clientHeight / ci.scrollHeight;
    const scaleW = ci.clientWidth  / ci.scrollWidth;
    const scale  = Math.max(PREVIEW_MIN_ZOOM, Math.min(scaleH, scaleW));
    cp.style.zoom = scale;
    card.dataset.previewScaled = '1';
  });
}

// ══ 모바일 탭 전환 ══
let _mobileTab = 'builder';

function switchMobileTab(tab) {
  _mobileTab = tab;
  const layout = document.getElementById('mainLayout');
  layout.classList.remove('m-preview', 'm-toc');
  if (tab === 'preview') layout.classList.add('m-preview');
  if (tab === 'toc')     layout.classList.add('m-toc');

  document.querySelectorAll('.mobile-tab').forEach(el => el.classList.remove('active'));
  const tabEl = document.getElementById('mTab-' + tab);
  if (tabEl) tabEl.classList.add('active');

  if (tab === 'preview') {
    // 미리보기 탭 전환 시 렌더링 + 스케일 적용
    schedulePreview();
    setTimeout(applyMobilePreviewScale, 350);
  }
}

function applyMobilePreviewScale() {
  if (window.innerWidth > 768) return;
  const pp = document.getElementById('printPages');
  if (!pp) return;
  const previewArea = document.getElementById('previewArea');
  const availW = (previewArea.clientWidth || window.innerWidth) - 20;
  const scale = Math.min(1, availW / 840);
  pp.style.transform = `scale(${scale})`;
  pp.style.transformOrigin = 'top left';
  // 스케일 후 높이 보정 (transform은 레이아웃 공간 유지됨)
  const origH = pp.scrollHeight;
  pp.style.marginBottom = `${Math.round(origH * scale - origH)}px`;
}

// 창 크기 변경 시 스케일 재적용 / 초기화
window.addEventListener('resize', () => {
  if (window.innerWidth <= 768) {
    if (_mobileTab === 'preview') applyMobilePreviewScale();
  } else {
    const pp = document.getElementById('printPages');
    if (pp) { pp.style.transform = ''; pp.style.marginBottom = ''; }
  }
