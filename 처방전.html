<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>천연비료 처방전 작성</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#3AACAA; --teal-dark:#2A8A88; --teal-light:#E0F5F5;
  --g-dark:#1B5E20; --g-btn:#388E3C;
  --orange:#E65100; --red:#C62828;
  --border:#DCEDC8; --bg:#F4F6F4; --text:#1A1A1A; --muted:#666;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);}

/* ── 헤더 ── */
.app-header{background:var(--teal-dark);padding:12px 20px;display:flex;
  align-items:center;gap:12px;position:sticky;top:0;z-index:100;
  box-shadow:0 2px 8px rgba(0,0,0,.3);}
.app-header h1{font-size:17px;font-weight:700;color:#fff;}
.back-btn{background:rgba(255,255,255,.2);border:none;color:#fff;padding:6px 12px;
  border-radius:6px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;}
.back-btn:hover{background:rgba(255,255,255,.3);}

/* ── 레이아웃 ── */
.layout{display:grid;grid-template-columns:400px 1fr 170px;height:calc(100vh - 48px);}
.builder{overflow-y:auto;border-right:2px solid var(--border);background:#fff;
  display:flex;flex-direction:column;}
.preview-area{overflow-y:auto;padding:20px;background:#e8e8e8;display:flex;
  flex-direction:column;gap:20px;align-items:center;}
.toc-panel{overflow-y:auto;border-left:2px solid var(--border);background:#fafafa;
  display:flex;flex-direction:column;position:relative;min-width:100px;max-width:400px;}
.toc-resize-handle{position:absolute;left:0;top:0;bottom:0;width:5px;cursor:col-resize;
  background:transparent;z-index:10;}
.toc-resize-handle:hover{background:rgba(26,138,136,.25);}
.toc-head{padding:10px 12px 6px;font-size:11px;font-weight:700;color:var(--teal-dark);
  letter-spacing:1px;text-transform:uppercase;border-bottom:1px solid #eee;}
.toc-list{display:flex;flex-direction:column;padding:6px 8px;gap:6px;flex:1;}
.toc-item{display:flex;flex-direction:column;gap:4px;padding:7px 8px;border-radius:6px;
  background:#fff;border:1.5px solid #e0e0e0;cursor:grab;align-items:center;
  color:#333;user-select:none;transition:border-color .15s;}
.toc-item:hover{border-color:var(--teal);}
.toc-item.toc-drag-over{border-color:var(--teal);background:#E0F5F5;}
.toc-item-head{display:flex;align-items:center;gap:5px;width:100%;}
.toc-drag{color:#bbb;font-size:14px;flex-shrink:0;}
.toc-label{flex:1;line-height:1.3;font-size:12px;font-weight:700;}
.toc-preview{border-top:1px solid #eee;margin-top:2px;padding-top:5px;
  font-size:10px;color:#555;line-height:1.6;font-weight:500;}
.toc-preview-row{display:flex;justify-content:space-between;gap:4px;
  white-space:nowrap;overflow:hidden;}
.toc-preview-stage{overflow:hidden;text-overflow:ellipsis;flex:1;}
.toc-preview-cnt{color:var(--teal-dark);font-weight:700;flex-shrink:0;}
.toc-cover{background:#F3F8FF;border-color:#90CAF9;}
.toc-cost{background:#FFFDE7;border-color:#FFE082;}
/* 비용 모달 */
.cost-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;
  display:none;align-items:center;justify-content:center;}
.cost-modal-overlay.on{display:flex;}
.cost-modal{background:#fff;border-radius:12px;width:600px;max-height:80vh;
  overflow-y:auto;padding:24px;box-shadow:0 8px 40px rgba(0,0,0,.3);}
.cost-modal h2{margin:0 0 16px;font-size:16px;color:var(--teal-dark);}
.cost-table{width:100%;border-collapse:collapse;font-size:12px;}
.cost-table th{background:var(--teal);color:#fff;padding:7px 8px;text-align:center;border:1px solid rgba(255,255,255,.3);}
.cost-table td{padding:6px 8px;border:1px solid #ddd;text-align:center;vertical-align:middle;}
.cost-table input{width:80px;padding:3px 5px;border:1px solid #ccc;border-radius:4px;text-align:right;font-size:12px;}
.cost-total-row td{background:#E0F5F5;font-weight:700;}

/* ── 처방전 요약 카드 (summary card) ── */
.sc-table{width:100%;border-collapse:collapse;font-size:15px;}
.sc-table td{border:2px solid var(--teal);padding:10px 16px;}
.sc-title-row td{background:#fff;color:#111;text-align:center;font-size:19px;font-weight:900;padding:14px 16px;}
.sc-month{font-size:16px;font-weight:700;text-align:center;background:#E0F5F5;white-space:nowrap;width:80px;}
.sc-amt{font-size:16px;font-weight:900;text-align:center;}
.sc-pp{font-size:15px;font-weight:700;text-align:center;color:var(--teal-dark);}
.sc-stage{font-size:13px;font-weight:700;text-align:center;background:#f5fbfb;white-space:nowrap;vertical-align:middle;width:110px;}
.sc-prod-detail{font-size:13px;padding:7px 14px;}
.sc-cust-row td{background:#fff;text-align:center;font-weight:700;font-size:18px;padding:8px;}
.sc-footer-row td{background:#fff;color:var(--text);font-weight:700;font-size:18px;text-align:center;padding:12px;}

/* ── 빌더 섹션 ── */
.b-section{border-bottom:1px solid #f0f0f0;padding:14px 16px;}
.b-title{font-size:11px;font-weight:700;color:var(--teal-dark);letter-spacing:1px;
  text-transform:uppercase;margin-bottom:10px;}

/* ── 입력 공통 ── */
.f-row{display:grid;gap:8px;margin-bottom:8px;}
.f-row.col2{grid-template-columns:1fr 1fr;}
.f-row.col3{grid-template-columns:1fr 70px 1fr;}
.f-row.col4{grid-template-columns:1fr 70px 72px 1fr;}
.fg label{display:block;font-size:10px;font-weight:700;color:var(--muted);margin-bottom:3px;}
.fg input,.fg select{width:100%;padding:7px 10px;border:1.5px solid #ddd;border-radius:6px;
  font-family:inherit;font-size:13px;font-weight:500;background:#fafafa;outline:none;
  transition:border-color .2s;}
.fg input:focus,.fg select:focus{border-color:var(--teal);}
.fg select{appearance:none;cursor:pointer;padding-right:26px;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'%3E%3Cpath fill='%23666' d='M5 7L0 2h10z'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 8px center;}

/* ── 재고 현황 ── */
.inv-list{display:flex;flex-direction:column;gap:5px;}
.inv-item{display:flex;justify-content:space-between;align-items:center;
  background:#f8f8f8;border-radius:6px;padding:6px 10px;font-size:12px;}
.inv-name{font-weight:700;color:var(--text);}
.inv-size{color:var(--muted);font-size:11px;}
.inv-stock{display:flex;gap:6px;align-items:center;}
.inv-total{color:var(--muted);font-size:11px;}
.inv-remain{font-weight:700;font-size:12px;padding:2px 7px;border-radius:9px;}
.inv-remain.ok{background:#E8F5E9;color:#2E7D32;}
.inv-remain.warn{background:#FFF3E0;color:#E65100;}
.inv-remain.over{background:#FFEBEE;color:#C62828;}
.inv-empty{color:#bbb;font-size:12px;text-align:center;padding:8px 0;}

/* ── 월 그룹 ── */
.stages-list{display:flex;flex-direction:column;gap:12px;}
.month-group{border:2px solid var(--teal);border-radius:10px;overflow:hidden;}
.month-group-header{background:var(--teal-dark);color:#fff;padding:6px 10px;
  display:flex;align-items:center;gap:6px;user-select:none;}
.month-group.dragging{opacity:.45;border-style:dashed;}
.month-group.drag-over{border-color:#fff;background:rgba(255,255,255,.07);}
.group-drag-handle{cursor:grab;font-size:17px;opacity:.7;line-height:1;flex-shrink:0;}
.group-drag-handle:active{cursor:grabbing;}
.group-label-input{flex:1;background:transparent;border:none;
  border-bottom:1.5px solid rgba(255,255,255,.4);color:#fff;
  font-size:14px;font-weight:900;padding:2px 4px;outline:none;
  min-width:60px;font-family:inherit;letter-spacing:.3px;}
.group-label-input:focus{border-bottom-color:#fff;background:rgba(255,255,255,.15);border-radius:3px 3px 0 0;}
.month-group-count{font-size:11px;opacity:.7;background:rgba(255,255,255,.2);
  border-radius:10px;padding:1px 7px;flex-shrink:0;}
.group-copy-btn{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);
  color:#fff;border-radius:4px;padding:2px 8px;cursor:pointer;
  font-size:11px;font-weight:700;font-family:inherit;flex-shrink:0;}
.group-copy-btn:hover{background:rgba(255,255,255,.35);}
.group-delete-btn{background:rgba(220,60,60,.25);border:1px solid rgba(255,120,120,.5);
  color:#fff;border-radius:4px;padding:2px 8px;cursor:pointer;
  font-size:11px;font-weight:700;font-family:inherit;flex-shrink:0;}
.group-delete-btn:hover{background:rgba(220,60,60,.55);}
.group-toggle-btn{background:none;border:none;color:#fff;cursor:pointer;
  font-size:13px;padding:2px 5px;border-radius:3px;flex-shrink:0;}
.group-toggle-btn:hover{background:rgba(255,255,255,.2);}
.month-group-body{background:#f4fbfb;display:flex;flex-direction:column;gap:8px;padding:8px;}
.month-group-body.collapsed{display:none;}
.stage-body.collapsed{display:none;}
/* ── 단계 카드 ── */
.stage-card{border:1.5px solid #e0e0e0;border-radius:8px;overflow:hidden;}
.stage-head{background:var(--teal);color:#fff;padding:8px 12px;
  display:flex;align-items:center;justify-content:space-between;
  cursor:pointer;user-select:none;}
.stage-head .slabel{font-size:13px;font-weight:700;}
.stage-head .sdate{font-size:11px;opacity:.85;}
.stage-del{background:rgba(255,255,255,.25);border:none;color:#fff;
  width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:13px;
  display:flex;align-items:center;justify-content:center;}
.stage-del:hover{background:rgba(255,255,255,.4);}
.stage-body{padding:8px 10px;}
.prod-row{display:grid;grid-template-columns:1fr 50px 1fr 22px;gap:5px;
  align-items:center;margin-bottom:5px;}
/* ── 제품 행 ── */
.prod-item{background:#f0f8f8;border:1.5px solid #c8e6e6;border-radius:8px;
  padding:8px 10px;margin-bottom:6px;}
.prod-item-head{display:flex;align-items:center;justify-content:space-between;
  margin-bottom:6px;}
.prod-item-name{font-size:13px;font-weight:700;color:var(--teal-dark);}
.prod-item-size{font-size:11px;color:var(--muted);margin-left:4px;}
.prod-del-btn{border:1.5px solid #ddd;border-radius:4px;background:#fff;
  cursor:pointer;color:#bbb;font-size:12px;padding:2px 6px;line-height:1;}
.prod-del-btn:hover{border-color:var(--red);color:var(--red);}
.prod-item-inputs{display:flex;flex-direction:column;gap:5px;}
.prod-item-top-row{display:grid;grid-template-columns:80px 1fr;gap:6px;}
.prod-item-inputs label{display:block;font-size:10px;font-weight:700;
  color:var(--muted);margin-bottom:2px;}
.prod-item-inputs input{width:100%;padding:5px 8px;border:1.5px solid #ddd;
  border-radius:5px;font-family:inherit;font-size:13px;font-weight:700;
  background:#fff;outline:none;}
.prod-item-inputs input:focus{border-color:var(--teal);}
.qty-input{text-align:center;font-size:15px;font-weight:900;color:var(--teal-dark);}
.prod-area-select{width:100%;padding:4px 22px 4px 6px;border:1.5px solid var(--teal);
  border-radius:5px;font-family:inherit;font-size:11px;font-weight:700;
  background:#fff;outline:none;appearance:none;cursor:pointer;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'%3E%3Cpath fill='%23666' d='M5 7L0 2h10z'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 5px center;}
.prod-desc-row{display:block;}
.prod-desc-row input{width:100%;padding:5px 8px;border:1.5px solid #ddd;
  border-radius:5px;font-family:inherit;font-size:12px;font-weight:500;
  background:#fff;outline:none;}
.prod-desc-row input:focus{border-color:var(--teal);}
.foliar-presets{display:flex;gap:5px;margin-bottom:5px;flex-wrap:wrap;}
.foliar-presets button{font-size:10px;padding:3px 9px;border-radius:12px;
  background:#e0f5f5;border:1.5px solid var(--teal);color:var(--teal-dark);
  cursor:pointer;font-weight:700;font-family:inherit;line-height:1.4;}
.foliar-presets button:hover{background:var(--teal);color:#fff;}
.rx-bottom-note{margin-top:12px;padding:9px 13px;border-left:3px solid var(--teal);
  background:#f0fbfb;font-size:12px;color:#2A5050;line-height:1.75;border-radius:4px;}
.over-badge{background:#FFEBEE;color:var(--red);font-size:10px;font-weight:700;
  padding:2px 6px;border-radius:8px;margin-left:6px;}

/* ── 제품 기능 태그 ── */
.func-row{display:flex;flex-direction:column;gap:5px;margin-bottom:8px;
  background:#f5f0ff;border-radius:7px;padding:8px 10px;}
.func-row > label{font-size:11px;font-weight:700;color:#5c3d9e;}
.func-select{width:100%;padding:5px 24px 5px 8px;border:1.5px solid #8e68d8;
  border-radius:6px;font-family:inherit;font-size:12px;font-weight:600;
  background:#fff;outline:none;appearance:none;cursor:pointer;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'%3E%3Cpath fill='%23666' d='M5 7L0 2h10z'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 6px center;}
.func-tags-area{min-height:28px;border:1.5px dashed #b09ede;border-radius:6px;
  padding:5px 6px;display:flex;flex-wrap:wrap;gap:4px;background:#faf7ff;}
.func-tag{display:inline-flex;align-items:center;gap:3px;background:#7c5cbf;
  color:#fff;padding:3px 8px;border-radius:12px;font-size:11px;font-weight:700;
  cursor:grab;user-select:none;transition:opacity .15s;}
.func-tag:hover{background:#6a4aad;}
.func-tag.tag-dragging{opacity:.4;cursor:grabbing;}
.func-tag-del{background:none;border:none;color:rgba(255,255,255,.75);
  cursor:pointer;font-size:12px;padding:0 0 0 2px;line-height:1;font-family:inherit;}
.func-tag-del:hover{color:#fff;}
.func-empty-hint{color:#b9a8e0;font-size:10px;align-self:center;}
.func-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:2px;}
.func-reset-btn{font-size:10px;color:#999;background:none;border:1px solid #ddd;
  border-radius:4px;padding:2px 8px;cursor:pointer;font-family:inherit;}
.func-reset-btn:hover{color:#c62828;border-color:#c62828;}
.color-palette{display:flex;gap:3px;align-items:center;}
.c-swatch{width:16px;height:16px;border-radius:3px;border:2px solid transparent;
  cursor:pointer;transition:border-color .1s;flex-shrink:0;}
.c-swatch:hover{border-color:#555!important;}
.c-swatch.active{border-color:#333!important;}

/* ── 평수 선택 ── */
.area-row{display:flex;align-items:center;gap:6px;margin-bottom:10px;
  background:#f0fbfb;border-radius:7px;padding:7px 10px;flex-wrap:wrap;}
.area-label{font-size:11px;font-weight:700;color:var(--teal-dark);white-space:nowrap;}
.area-select{flex:1;min-width:120px;padding:5px 24px 5px 8px;border:1.5px solid var(--teal);
  border-radius:6px;font-family:inherit;font-size:12px;font-weight:700;
  background:#fff;outline:none;appearance:none;cursor:pointer;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'%3E%3Cpath fill='%23666' d='M5 7L0 2h10z'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 6px center;}
.area-custom{width:100px;padding:5px 8px;border:1.5px solid var(--teal);
  border-radius:6px;font-family:inherit;font-size:13px;font-weight:700;
  background:#fff;outline:none;}
.area-custom:focus{border-color:var(--teal-dark);}
.area-badge{background:var(--teal);color:#fff;font-size:11px;font-weight:700;
  padding:3px 8px;border-radius:9px;white-space:nowrap;}

/* ── 제품 추가 섹션 ── */
.add-prod-section{margin-top:8px;border-top:1px dashed #ddd;padding-top:8px;}
.add-prod-row{display:grid;grid-template-columns:1fr 52px;gap:6px;margin-bottom:6px;}
.add-prod-select{width:100%;padding:7px 24px 7px 8px;border:1.5px solid var(--teal);
  border-radius:6px;font-family:inherit;font-size:12px;font-weight:500;
  background:#fff;outline:none;appearance:none;cursor:pointer;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'%3E%3Cpath fill='%23666' d='M5 7L0 2h10z'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 6px center;}
.add-prod-btn{background:var(--teal);color:#fff;border:none;border-radius:6px;
  font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;}
.add-prod-btn:hover{background:var(--teal-dark);}

/* ── 버튼들 ── */
.add-stage-btn{width:100%;padding:10px;border:2px dashed var(--teal);border-radius:8px;
  background:var(--teal-light);cursor:pointer;font-family:inherit;font-size:13px;
  font-weight:700;color:var(--teal-dark);transition:all .15s;}
.add-stage-btn:hover{background:#c5ecec;}
.gen-btn{background:var(--teal-dark);color:#fff;border:none;border-radius:8px;
  padding:14px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;
  transition:background .15s;}
.gen-btn:hover{background:#1a6a68;}

/* ── 모달 ── */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;
  align-items:center;justify-content:center;backdrop-filter:blur(2px);}
.overlay.on{display:flex;}
.modal{background:#fff;border-radius:12px;width:360px;max-width:94vw;
  box-shadow:0 20px 60px rgba(0,0,0,.2);overflow:hidden;}
.modal-hdr{background:var(--teal-dark);padding:14px 16px;display:flex;
  align-items:center;justify-content:space-between;}
.modal-hdr h2{color:#fff;font-size:15px;font-weight:700;}
.modal-x{background:none;border:none;color:rgba(255,255,255,.8);font-size:18px;
  cursor:pointer;padding:0 4px;}
.modal-x:hover{color:#fff;}
.modal-body{padding:16px;}
.modal-body .f-row{margin-bottom:10px;}
.modal-ok{width:100%;padding:12px;background:var(--teal);color:#fff;border:none;
  border-radius:8px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;}
.modal-ok:hover{background:var(--teal-dark);}
.days-row{display:grid;grid-template-columns:1fr 60px;gap:8px;align-items:end;}
.days-unit{font-size:13px;font-weight:700;color:var(--muted);padding-bottom:8px;}

/* ── 재고 초과 경고 ── */
.over-warning{background:#FFEBEE;border:1.5px solid #FFCDD2;border-radius:6px;
  padding:6px 10px;font-size:11px;color:var(--red);font-weight:700;margin-top:4px;
  display:none;}
.over-warning.show{display:block;}

/* ── 드래그앤드롭 ── */
.inv-item{cursor:grab;transition:box-shadow .15s,transform .15s;}
.inv-item:hover{box-shadow:0 2px 8px rgba(0,0,0,.12);transform:translateX(2px);}
.inv-item.dragging{opacity:.5;cursor:grabbing;}
.drag-handle{font-size:13px;color:#bbb;margin-right:6px;user-select:none;}
.drop-zone{border:2px dashed #ccc;border-radius:6px;padding:8px;
  text-align:center;font-size:11px;color:#aaa;margin-top:6px;
  transition:all .15s;}
.drop-zone.drag-over{border-color:var(--teal);background:var(--teal-light);
  color:var(--teal-dark);font-weight:700;}
.prod-row-wrap{background:#f9f9f9;border-radius:6px;padding:6px 8px;margin-bottom:4px;
  border:1.5px solid #eee;}

/* ════════════════════
   처방전 페이지 (인쇄용)
════════════════════ */
.page-card{background:white;box-shadow:0 4px 20px rgba(0,0,0,.15);
  border-radius:6px;overflow:hidden;}

/* A4 landscape 비율 (297:210) 화면 미리보기 */
.page-card{width:840px;min-height:595px;}

/* ── 표지 ── */
.cover-page{background:var(--teal);padding:40px;display:flex;
  flex-direction:column;align-items:center;justify-content:space-between;
  min-height:595px;}
.cover-naturebio{color:rgba(255,255,255,.9);font-size:26px;letter-spacing:10px;

<div class="overlay" id="stageOverlay" onclick="closeStageOut(event)">

            <option value="관주">관주</option>
            <option value="엽면">엽면</option>
          </select></div>
      </div>
      <!-- 관주/엽면 선택 시: 자동 번호 안내 -->
      <div class="f-row" id="typeNumRow" style="display:none;">
        <div class="fg">
          <div style="background:var(--teal-light);border:1.5px solid var(--teal);border-radius:6px;padding:8px 12px;font-size:13px;color:var(--teal-dark);">
            <strong id="mAutoLabelPreview">관주(1번)</strong>
            <span style="font-size:11px;color:#888;margin-left:6px;">으로 자동 추가됩니다</span>

          <label>정식 후 며칠?</label>

            <span class="days-unit">일 후</span>

          <label>직접 입력 <span style="font-size:10px;color:#999;">(비워두면 자동 라벨 사용)</span></label>
          <input id="mStageLabel" type="text" placeholder="예) 감사비료 수확:후 및 3월 4월">
        </div>
      </div>

        <div class="fg"><label>날짜 간격 <span style="font-size:10px;color:#999;">(선택)</span></label>
          <input id="mDateRange" placeholder="예) 7-10일 간격"></div>
      </div>
      <button class="modal-ok" onclick="confirmStage()">✓ 단계 추가</button>

<script>
// ── 데이터 로드 ──────────────────────────
let rxData = {};
let stages = [];
let stagesHistory = [];
let redoStack = [];
const HISTORY_MAX = 30;
let managerPhone = localStorage.getItem('managerPhone') || '010-3704-5963';
let stageIdCnt = 0;
let groupLabels = {};      // { mk: '커스텀 레이블' }
let stageGroupOrder = [];  // 그룹 표시 순서 (mk 배열)

function getStageGroupKey(st) {
  if (st && st.pageGroup !== undefined && st.pageGroup !== null && st.pageGroup !== '') return Number(st.pageGroup);
  if (st && st.sourcePage !== undefined && st.sourcePage !== null && st.sourcePage !== '') return 1000 + Number(st.sourcePage);
  return Number((st && st.month) || 0);
}
let _dragGroupMk = null;

// 거래명세표(index.html)의 초기화 신호 수신 → 처방전 단계·고객정보 초기화
window.addEventListener('storage', e => {
  if (e.key !== 'rxReset') return;
  stages = []; groupLabels = {}; stageGroupOrder = [];
  rxData.cart = []; rxData.name = ''; rxData.region = ''; rxData.area = ''; rxData.crop = ''; rxData.areaType = '';
  rxData.extractedTotalCost = null; rxData.extractedUnitPrice = null; rxData.extractedBreakdown = null;
  ['bName','bRegion','bArea'].forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
  const bc = document.getElementById('bCrop'); if (bc) bc.selectedIndex = 0;
  recalcTypeNums(); renderStages(); renderInventory(); schedulePreview();
  showRxToast('처방전과 거래명세표가 초기화되었습니다.');
  localStorage.removeItem('rxReset');
});

window.addEventListener('DOMContentLoaded', () => {
  // ══════════════════════════════════════════════════════════════════════
  //  초기화 우선순위:
  //  1순위 — rxStages (처방전 전용 영속 저장소, 항상 최신 상태)
  //  2순위 — rxData  (index.html 일회성 전달, cart·고객정보만 병합)
  //  ※ rxData 가 와도 이미 복원된 stages 는 절대 건드리지 않음
  // ══════════════════════════════════════════════════════════════════════

  // ── 1순위: rxStages 최우선 복원 ──────────────────────────────────────
  let hadSavedWork = false;
  const rawStages = localStorage.getItem('rxStages');
  if (rawStages) {
    try {
      const saved = JSON.parse(rawStages);
      if (saved.stages && saved.stages.length > 0) {
        hadSavedWork = true;
        stageIdCnt = 0;
        stages = saved.stages.map(s => {
          const base = {
            ...s, id: ++stageIdCnt,
            pageGroup: s.pageGroup ?? null, sourcePage: s.sourcePage ?? null, pageType: s.pageType || '',
            stageDisplayText:    s.stageDisplayText    || '',
            stageRawCell:        s.stageRawCell        || '',
            stageDisplayOverride: s.stageDisplayOverride || ''
          };
          // v17 migration: stageDisplayText 누락 보정
          if (!base.stageDisplayText && base.stageRawCell) base.stageDisplayText = base.stageRawCell;
          if (base.stageLabelOverride && base.stageLabelOverride === base.stageRawCell && base.stageDisplayText)
            base.stageLabelOverride = base.stageDisplayText;
          return base;
        });
        pageOrder       = saved.pageOrder       || [];
        costVisible     = saved.costVisible     || false;
        groupLabels     = saved.groupLabels     || {};
        stageGroupOrder = saved.stageGroupOrder || [];
        priceOverrides  = saved.priceOverrides  || {};
        if (saved.coverCustomFs)   rxData.coverCustomFs   = saved.coverCustomFs;
        if (saved.coverCustomText) {
          const ct = { ...saved.coverCustomText };
          delete ct.rx; // 이전 고객명은 복원 금지
          rxData.coverCustomText = ct;
        }
      }
      // rxData 핵심 필드 복원 (아직 index.html 데이터 미도착 상태에서 기본값 설정)
      if (saved.rxCart     && saved.rxCart.length > 0) rxData.cart     = saved.rxCart;
      if (saved.rxName)     rxData.name     = saved.rxName;
      if (saved.rxRegion)   rxData.region   = saved.rxRegion;
      if (saved.rxArea)     rxData.area     = saved.rxArea;
      if (saved.rxCrop)     rxData.crop     = saved.rxCrop;
      if (saved.rxAreaType) rxData.areaType = saved.rxAreaType;
      if (saved.rxPhone)    rxData.phone    = saved.rxPhone;
      if (saved.rxAddr)     rxData.addr     = saved.rxAddr;
      // PDF 비용 페이지 추출 데이터 복원
      if (saved.extractedTotalCost != null) rxData.extractedTotalCost = saved.extractedTotalCost;
      if (saved.extractedUnitPrice != null) rxData.extractedUnitPrice = saved.extractedUnitPrice;
      if (saved.extractedBreakdown != null) rxData.extractedBreakdown = saved.extractedBreakdown;
    } catch(e) {}
  }

  // ── 2순위: index.html 전달 rxData — cart·고객정보만 병합, stages 절대 불변 ──
  const rawRxData = localStorage.getItem('rxData');
  if (rawRxData) {
    try {
      const incoming = JSON.parse(rawRxData);
      const isNewCustomer = !!incoming._newPrescription; // index.html 이 다른 고객임을 알림

      // 기존 처방 단계가 있고 '다른 고객' 플래그가 온 경우 → 사용자에게 선택권 부여
      if (isNewCustomer && stages.length > 0) {
        const keep = confirm(
          `⚠️ 기존 처방 단계 (${stages.length}개) 가 저장되어 있습니다.\n\n` +
          `[확인]  → 기존 단계를 유지하면서 새 고객 정보만 적용\n` +
          `[취소]  → 기존 단계를 지우고 새 고객 처방전으로 시작`
        );
        if (!keep) {
          stages = [];
          stageIdCnt = 0;
          groupLabels = {};
          stageGroupOrder = [];
          pageOrder = [];
        }
        // keep=true 면 stages 유지, cart·고객정보만 아래에서 덮어씀
      }

      // cart: index.html 의 최신 cart 반영 (재고 수량·가격)
      if (incoming.cart && incoming.cart.length > 0) {
        rxData.cart = incoming.cart;
        // retail/sp → priceOverrides 병합 (index.html 가격 수정 반영)
        incoming.cart.forEach(c => {
          const key = c.name + '||' + (c.size || '');
          if (c.retail || c.sp) {
            priceOverrides[key] = priceOverrides[key] || {};
            if (c.retail) priceOverrides[key].retail = c.retail;
            if (c.sp)     priceOverrides[key].sp     = c.sp;
          }
        });
      }
      // 고객정보 업데이트
      if (incoming.name)     rxData.name     = incoming.name;
      if (incoming.region)   rxData.region   = incoming.region;
      if (incoming.area)     rxData.area     = incoming.area;
      if (incoming.crop)     rxData.crop     = incoming.crop;
      if (incoming.areaType) rxData.areaType = incoming.areaType;
      // 전화번호·주소 연동
      if (incoming.phone || incoming.phone2)
        rxData.phone = [incoming.phone, incoming.phone2].filter(Boolean).join(' / ');
      if (incoming.addr)     rxData.addr     = incoming.addr;
      // ★★★ stages 는 위의 isNewCustomer 분기 외에는 절대 건드리지 않음 ★★★
    } catch(e) {}
    localStorage.removeItem('rxData'); // 일회성 전달 소비
  }

  // ── 3단계: 폼 채우기 ─────────────────────────────────────────────────
  document.getElementById('bName').value   = rxData.name   || '';
  document.getElementById('bRegion').value = rxData.region || '';
  document.getElementById('bArea').value   = rxData.area   || '';
  if (rxData.crop) {
    const sel = document.getElementById('bCrop');
    for (let i = 0; i < sel.options.length; i++) {
      if (sel.options[i].value === rxData.crop) { sel.selectedIndex = i; break; }
    }
  }
  {
    const stdTypes = ['농사','하우스','노지'];
    const at  = rxData.areaType || '농사';
    const sel = document.getElementById('bAreaType');
    if (stdTypes.includes(at)) {
      sel.value = at;
    } else if (at) {
      sel.value = '직접입력';
      document.getElementById('bAreaTypeDirect').style.display = 'block';
      document.getElementById('bAreaTypeDirect').value = at;
    }
  }
  // 구버전 처방전 PDF: rxPdfRawText에서 단계 파싱 (rxStages가 비어있을 때만)
  if (stages.length === 0) {
    const rawPdfText = localStorage.getItem('rxPdfRawText');
    if (rawPdfText) {
      localStorage.removeItem('rxPdfRawText');
      try {
        const parsedRx = parseRxPdfText(rawPdfText.split('\n').filter(Boolean));
        if (parsedRx.stages && parsedRx.stages.length > 0) {
          // 제품 키 정규화: 공백·특수문자·괄호 형태 차이 보정
          _normalizeStageProductKeys(parsedRx.stages);
          stageIdCnt = 0;
          stages = parsedRx.stages.map(s => ({
            ...s,
            id: ++stageIdCnt,
            // 구버전 경로: 페이지 메타데이터 기본값 보장
            pageGroup:  s.pageGroup  ?? null,
            sourcePage: s.sourcePage ?? null,
            pageType:   s.pageType   || '',
            stageLabelOverride: s.stageLabelOverride || '',
            stageLabel: s.stageLabel || ''
          }));
        }
      } catch(e) {}
    }
  }
  document.getElementById('bManagerPhone').value = managerPhone;
  recalcTypeNums();
  renderInventory();
  renderStages();
  // 로드 완료 → 즉시 저장 (stages 가 있을 때만 — 빈 상태로 덮어쓰기 방지)
  if (stages.length > 0 || (rxData.cart && rxData.cart.length > 0)) {
    _saveRxStages();
  }
  // 이전 작업 복원 알림
  if (hadSavedWork) {
    setTimeout(() => showRxToast('이전 작업을 자동으로 불러왔습니다.'), 600);
  }
  // 입력 변경시 실시간 처방전 업데이트 + 자동 저장
  ['bName','bRegion','bArea','bCrop','bAreaType','bAreaTypeDirect'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('input',  () => { schedulePreview(); _scheduleAutoSave(); });
    el.addEventListener('change', () => { schedulePreview(); _scheduleAutoSave(); });
  });
  schedulePreview();
  // rxPendingPdf: index.html에서 업로드한 처방전 PDF → 좌표 기반 파싱으로 단계 자동 복원
  // ※ stages 유무와 무관하게 실행 — rxPendingPdf가 있으면 새 PDF로 덮어쓴다
  ;(async () => {
      const b64 = localStorage.getItem('rxPendingPdf');
      if (!b64) return;
      localStorage.removeItem('rxPendingPdf');
      try {
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        const pdfDoc = await pdfjsLib.getDocument({ data: bytes }).promise;
        // 1순위: ##RX## 임베드 확인
        const pageTxts = [];
        for (let i = 1; i <= pdfDoc.numPages; i++) {
          const page = await pdfDoc.getPage(i);
          const tc = await page.getTextContent();
          pageTxts.push(tc.items.map(it => it.str).join(' '));
        }
        const compact = pageTxts.join(' ').replace(/\s+/g, '');
        const rxm = compact.match(/##RX##([A-Za-z0-9+/=%]+)##RX##/);
        if (rxm) {
          const d = JSON.parse(decodeURIComponent(atob(rxm[1])));
          applyRxData(d);
          showRxToast('처방전 불러오기 완료 ✓ (거래명세표 연동)');
          return;
        }
        // 2순위: 좌표 기반 파싱 (Hwp 외부 처방전)
        const items = await extractRxPdfCoords(pdfDoc);
        const parsedArr = parseRxPdfCoords(items);  // returns array directly
        if (parsedArr && parsedArr.length > 0) {
          _normalizeStageProductKeys(parsedArr);
          stageIdCnt = 0;
          stages = parsedArr.map(s => ({
            ...s, id: ++stageIdCnt,
            pageGroup: s.pageGroup ?? null, sourcePage: s.sourcePage ?? null,
            pageType: s.pageType || '',
            stageLabelOverride: s.stageLabelOverride || '',
            stageLabel: s.stageLabel || '',
            stageDisplayText: s.stageDisplayText || '',
            stageRawCell: s.stageRawCell || '',
            stageDisplayOverride: s.stageDisplayOverride || ''
          }));
          recalcTypeNums();
          renderStages();
          // 비용 페이지에서 평당가 추출
          const costData = await extractCostFromPdfDoc(pdfDoc);
          if (costData) {
            rxData.extractedTotalCost  = costData.totalCost;
            rxData.extractedUnitPrice  = costData.unitPricePerPyeong;
            rxData.extractedBreakdown  = costData.breakdown || [];
          }
          _saveRxStages();
          const priceNote = costData && costData.unitPricePerPyeong
            ? ` | 평당 ${costData.unitPricePerPyeong.toLocaleString()}원` : '';
          showRxToast(`처방전 불러오기 완료 ✓ — ${stages.length}단계${priceNote} (거래명세표 연동)`);
          if (costData) schedulePreview();
        } else {
          showRxToast('처방전에서 단계를 인식하지 못했습니다. 처방전 탭에서 직접 PDF를 업로드해 주세요.', 5000);
        }
      } catch(e) { console.warn('[rxPendingPdf 파싱 실패]:', e); }
  })();
  // Ctrl+Z 되돌리기 / Ctrl+Y·Ctrl+Shift+Z 다시하기
  document.addEventListener('keydown', e => {
    const active = document.activeElement;
    const isInput = active && (active.tagName==='INPUT'||active.tagName==='TEXTAREA'||active.tagName==='SELECT');
    if ((e.ctrlKey||e.metaKey) && e.key==='z' && !e.shiftKey) {
      if (!isInput) { e.preventDefault(); undoStages(); }
    }
    if ((e.ctrlKey||e.metaKey) && (e.key==='y' || (e.key==='z' && e.shiftKey))) {
      if (!isInput) { e.preventDefault(); redoStages(); }
    }
    if (e.key === 'Escape' && _rxSelSi.size > 0) { _rxClearSel(); }
  });
  // 바깥 클릭 시 rx 셀 선택 해제 (툴바/편집 셀 제외)
  document.addEventListener('click', e => {
    if (!_rxSelSi.size && !selectedCells.length) return;
    if (e.target.closest('#rxFloatToolbar') || e.target.closest('.rx-editable')) return;
    _rxClearSel();
  });
  // 드래그 다중 선택 + 우클릭 컨텍스트 메뉴 이벤트 바인딩
  _rxBindTableEvents();
  // 플로팅 재고 패널 항상 표시
  openInvFloat();
});

// 표지 텍스트 길이에 따라 폰트 자동 축소 (최대 46px, 최소 20px)
// 12자까지는 46px 유지, 초과 시 비례 축소
function coverFontSize(text, base=46, min=20) {
  if (!text) return base;
  const len = text.length;
  if (len <= 12) return base;
  return Math.max(min, Math.round(base * 12 / len));
}

// ── 재고 계산 ────────────────────────────
// ── 제품 키 정규화 헬퍼 ───────────────────────────────────────────────────────
// PDF에서 읽어온 키와 cart 키의 공백·괄호·특수문자 차이를 제거한 뒤 비교
function _normProdKey(key) {
  return (key || '')
    .replace(/\s+/g, '')                        // 공백 전체 제거
    .replace(/[（）]/g, m => m === '（' ? '(' : ')') // 전각 괄호 → 반각
    .replace(/[ㆍ·•]/g, '·');                   // 가운뎃점 통일
}

// cart 항목들의 정규화 키 → 원본 키 매핑 (빠른 조회용)
function _buildCartNormMap() {
  const map = new Map();
  (rxData.cart || []).forEach(c => {
    const orig = c.name + '||' + (c.size || '');
    map.set(_normProdKey(orig), orig);
    // name(size)|| 형태도 등록
    if (c.size) map.set(_normProdKey(c.name + '(' + c.size + ')||'), orig);
  });
  return map;
}

// stage 배열의 제품 key를 cart에 있는 정확한 key로 교정
function _normalizeStageProductKeys(stageList) {
  const normMap = _buildCartNormMap();
  stageList.forEach(st => {
    (st.products || []).forEach(p => {
      if (!p.key) return;
      // 이미 cart에 exact match 존재하면 통과
      const cartKeys = new Set((rxData.cart || []).map(c => c.name + '||' + (c.size || '')));
      if (cartKeys.has(p.key)) return;
      // 정규화 후 매핑 시도
      const norm = _normProdKey(p.key);
      if (normMap.has(norm)) { p.key = normMap.get(norm); return; }
      // name||size → name(size)|| 형태 변환 후 재시도
      const [nm, sz] = p.key.split('||');
      if (sz) {
        const alt = nm + '(' + sz + ')||';
        const altNorm = _normProdKey(alt);
        if (normMap.has(altNorm)) { p.key = normMap.get(altNorm); }
      }
    });
  });
}

// cart가 비어 있을 때 stage 제품 목록에서 cart 자동 생성
// (외부 PDF 파싱처럼 cart 정보가 없는 경우 재고 현황에 즉시 표시)
// ※ localStorage.rxData 에는 저장하지 않음 — 영속은 _saveRxStages() 가 담당
function _autoCartFromStages(stageList) {
  if ((rxData.cart || []).length > 0) return; // cart가 이미 있으면 건드리지 않음
  const seen = new Set();
  const auto = [];
  stageList.forEach(st => {
    (st.products || []).forEach(p => {
      if (!p.key || seen.has(p.key)) return;
      seen.add(p.key);
      const [nm, sz] = p.key.split('||');
      auto.push({ name: nm || p.key, size: sz || '', qty: 1, retail: 0, sp: 0 });
    });
  });
  if (auto.length) rxData.cart = auto; // 메모리만 업데이트, 저장은 호출부에서 _saveRxStages()
}

function getInventory() {
  const inv = {};
  (rxData.cart || []).forEach(item => {
    const key = item.name + '||' + item.size;
    inv[key] = { name: item.name, size: item.size, total: item.qty, used: 0 };
  });
  stages.forEach(st => {
    (st.products || []).forEach(p => {
      if (inv[p.key]) inv[p.key].used += (p.qty || 0);
    });
  });
  return inv;
}

function buildInvHTML(inv) {
  const keys = Object.keys(inv);
  if (!keys.length) return '<div class="inv-empty">거래명세표에서 제품을 담아주세요</div>';
  return keys.map(k => {
    const it = inv[k];
    const rem = it.total - it.used;
    const cls = rem < 0 ? 'over' : rem === 0 ? 'warn' : 'ok';
    return `<div class="inv-item" draggable="true"
        ondragstart="onDragStart(event,'${k}')"
        ondragend="onDragEnd(event)">
      <span class="drag-handle">⠿</span>
      <div style="flex:1"><span class="inv-name">${it.name}</span>
        <span class="inv-size"> (${it.size})</span></div>
      <div class="inv-stock">
        <span class="inv-total">총 ${it.total}</span>
        <span class="inv-remain ${cls}">잔여 ${rem}</span>
      </div>
    </div>`;
  }).join('');
}

function recalcTypeNums() {
  const counts = {};
  stages.forEach(st => {
    if (st.type === '관주' || st.type === '엽면') {
      if (st.typeNumOverride) {
        st.typeNum = st.typeNumOverride; // 수동 설정 우선
      } else {
        const k = `${getStageGroupKey(st)}_${st.type}`;
        counts[k] = (counts[k] || 0) + 1;
        st.typeNum = counts[k];
      }
    }
  });
}

function previewTypeNum(groupKey, type) {
  let count = 0;
  stages.forEach(st => {
    if (getStageGroupKey(st) === groupKey && st.type === type) count++;
  });

}

/**
 * stageLabel 원문에서 화면 표시용 텍스트를 정제한다.
 *  - "\n(" → "("  : 괄호 줄바꿈 재결합  ("옥토팜\n(발효계분)" → "옥토팜(발효계분)")
 *  - 연속 개행 → 단일 개행
 * ※ 날짜 패턴(N월-N일, N:N-N 등)은 절대 삭제하지 않음 — 처방 핵심 정보
 */
function _cleanStageLabel(raw) {
  if (!raw) return raw;
  return raw
    .replace(/\n\(/g, '(')            // 괄호 줄바꿈 결합
    .replace(/[ \t]*\n[ \t]*/g, '\n') // 개행 주변 공백 정리
    .replace(/\n{2,}/g, '\n')         // 연속 개행 → 1개
    .trim();
}

/**
 * 날짜 포함 원문 그대로 반환 — stage-td 표시·편집에 사용
 *
 * getStageLabel()은 관주/엽면에서 stageDisplayText를 완전히 무시하고
 * 자동번호만 반환하므로, PDF에서 파싱된 날짜("3월:15일-20일" 등)가 손실됨.
 * 이 함수는 stageDisplayText/stageRawCell 원문을 최우선으로 사용해 날짜를 보존한다.
 *
 * 우선순위:
 *   1. stageDisplayOverride (사용자 직접 입력)
 *   2. stageDisplayText     (PDF 파싱 원문 — 날짜 포함)
 *   3. stageRawCell         (PDF 좌측 셀 원문)
 *   4. getStageLabel()      (폴백 — 자동번호 라벨)
 */
function getStageLabelRaw(st) {
  if (!st) return '';
  if (st.stageDisplayOverride) return st.stageDisplayOverride;
  // 원문 우선: 날짜가 포함된 전체 텍스트를 _cleanStageLabel로 경량 정제만 수행
  if (st.stageDisplayText) return _cleanStageLabel(st.stageDisplayText);
  if (st.stageRawCell)     return _cleanStageLabel(st.stageRawCell);
  // 폴백: 원문이 없을 때만 getStageLabel 사용 (관주/엽면 자동번호 등)
  return getStageLabel(st);
}

function getStageLabel(st) {
  // v18 우선순위:
  //   1. stageDisplayOverride (사용자 직접 입력) — 항상 최우선
  //   2. 관주/엽면이면 자동번호 라벨 즉시 사용 (raw text보다 앞)
  //      → raw text(stageDisplayText/stageRawCell/...)가 있어도 무시
  //   3. 관주/엽면이 아닌 경우: stageDisplayText → stageRawCell → stageLabelOverride → stageLabel → type 폴백
  // pageTitle / groupLabels 는 절대 사용 금지
  if (st.stageDisplayOverride)  return _cleanStageLabel(st.stageDisplayOverride);
  // ★ v18 핵심: 관주/엽면은 raw text 무시하고 자동번호 라벨 사용
  if (st.type === '관주')    return `관주(${st.typeNum || 1}${st.typeNumWord || '번'})`;
  if (st.type === '엽면')    return `엽면(${st.typeNum || 1}${st.typeNumWord || '번'})`;
  // 관주/엽면이 아닌 단계: 기존 raw text 우선순위 유지
  if (st.stageDisplayText)      return _cleanStageLabel(st.stageDisplayText);
  if (st.stageRawCell)          return _cleanStageLabel(st.stageRawCell);
  if (st.stageLabelOverride)    return _cleanStageLabel(st.stageLabelOverride);
  if (st.stageLabel)            return _cleanStageLabel(st.stageLabel);
  if (st.type === '경운전')  return '경운 "전"';
  if (st.type === '경운후')  return '경운 "후"';
  if (st.type === '정식당일') return '정식+당일';
  if (st.type === '정식후')  return `정식 "후" ${st.days || ''}일`;
  return st.type || '(단계명 입력)';
}

function getStageLabelHtml(st) {
  // ★ getStageLabelRaw: 날짜 포함 원문 그대로 → \n → <br> 변환
  const label = getStageLabelRaw(st).replace(/\n/g, '<br>');
  return `<strong>${label}</strong>`;
}

function getStageBadge(st) {
  // 줄바꿈을 공백으로 치환해 뱃지 한 줄 표시
  const label = getStageLabel(st).replace(/\n/g, ' ');
  const date  = st.dateRange ? ` · ${st.dateRange}` : '';
  // 의미있는 라벨이 있으면 페이지/월 접두어 생략
  // v18: 관주/엽면은 자동번호 라벨이 있으므로 항상 meaningful로 처리
  const hasMeaningfulLabel = !!(st.stageDisplayOverride || st.type === '관주' || st.type === '엽면' ||
    st.stageDisplayText || st.stageRawCell || st.stageLabelOverride || st.stageLabel);
  const month = hasMeaningfulLabel
    ? (st.month ? `${st.month}월 ` : '')
    : (st.pageGroup && st.pageGroup >= 1001 ? `${st.pageGroup - 1000}페이지 ` : (st.month ? `${st.month}월 ` : ''));
  return month + label + date;
}

// ── 단계 렌더링 ───────────────────────────
function renderStages() {
  recalcTypeNums();
  const inv = getInventory();
  const list = document.getElementById('stagesList');
  if (!stages.length) {
    list.innerHTML = '<div class="inv-empty">아래 버튼으로 단계를 추가해주세요</div>';
    renderToc();
    return;
  }

  // UX-01: 첫 렌더 시 isOpen 초기화 — isOpen이 아직 없는 stages만 기본값 적용
  if (stages.length > 0 && stages[0].isOpen === undefined) {
    stages[0].isOpen = true;
    // 나머지는 undefined → makeCard에서 collapsed 처리
  }

  renderToc();
  schedulePreview();

  // 그룹 순서 동기화
  syncGroupOrder();

  // 월별 그룹으로 묶기
  const groupMap = {};
  stages.forEach((st, si) => {
    const mk = getStageGroupKey(st);
    if (!groupMap[mk]) groupMap[mk] = [];
    groupMap[mk].push(si);
  });

  // 닫힌 그룹 상태 유지
  if (!window._monthGroupCollapsed) window._monthGroupCollapsed = {};

  const makeCard = (st, si) => {
    // 추가된 제품 행
    const prods = (st.products || []).map((p, pi) => {
      const cartItem = (rxData.cart||[]).find(c => c.name+'||'+c.size === p.key);
      const prodName = cartItem ? cartItem.name : (p.key ? p.key.split('||')[0] : '?');
      const prodSize = cartItem ? cartItem.size : (p.key ? p.key.split('||')[1] : '');
      const invItem = inv[p.key];
      const isOver = invItem ? (invItem.used > invItem.total) : false;
      const isCustomProdArea = p.prodArea && ![100,200,300,400,600,800].includes(Number(p.prodArea));
      const UNITS = ['개','포','병'];
      const unitVal = p.unit || '개';
      const isCustomUnit = p.unit && !UNITS.includes(p.unit);
      return `<div class="prod-item">
        <div class="prod-item-head">
          <div>
            <div style="display:flex;align-items:center;flex-wrap:wrap;gap:3px;">
              <span class="prod-item-name">${prodName}</span>
              <span class="prod-item-size">(${prodSize})</span>
              ${isOver ? `<span class="over-badge">⚠️ 재고초과</span>` : ''}
            </div>
            ${st.area ? `<div style="font-size:11px;color:var(--teal-dark);font-weight:700;margin-top:2px;">(${st.area}평)</div>` : ''}
          </div>
          <div style="display:flex;gap:3px;flex-shrink:0;">
            ${pi > 0 ? `<button class="prod-split-btn" onclick="splitStage(${si},${pi})" title="여기서 단계 나누기" style="font-size:10px;padding:2px 6px;border:1.5px solid #9b7fd4;border-radius:4px;background:#f3eeff;color:#7b5ea7;cursor:pointer;white-space:nowrap;">↕ 나누기</button>` : ''}
            <button class="prod-del-btn" onclick="delProd(${si},${pi})">✕ 삭제</button>
          </div>
        </div>
        <div class="prod-item-inputs">
          <div class="prod-item-top-row" style="grid-template-columns:70px 90px 1fr;">
            <div>
              <label>사용량</label>
              <input class="qty-input" type="number" value="${p.qty||0}" min="0" step="1"
                placeholder="0"
                oninput="onQtyInput(${si},${pi},this.value)"
                onblur="onQtyBlur(${si},${pi},this.value)">
            </div>
            <div>
              <label>단위</label>
              <select class="prod-area-select" id="unitSel_${si}_${pi}"
                onchange="onUnitChange(${si},${pi},this.value)">

                oninput="onUnitCustom(${si},${pi},this.value)">

            <div>
              <label>평수 (선택)</label>
              <select class="prod-area-select"
                id="prodAreaSel_${si}_${pi}"
                onchange="onProdAreaChange(${si},${pi},this.value)">

              </select>

                type="number" placeholder="직접입력" min="1" step="50"
                value="${isCustomProdArea ? p.prodArea : ''}"
                style="display:${isCustomProdArea?'block':'none'};margin-top:3px;font-size:11px;width:100%;"

              <button type="button" onclick="setFoliarDesc(${si},${pi},'물+15말 잎+왁스층+강화 잎+줄기+열매+뿌리+동시')">15말</button>

    const isCustomArea = st.area && !AREA_VALS.includes(Number(st.area));

    const tags = st.funcTags || [];
    const funcColor = st.funcColor || '#ffffff';
    const SWATCHES = ['#ffffff','#E0F5F5','#FFF9C4','#FFE0B2','#FCE4EC','#EDE7F6','#DCEDC8','#B3E5FC'];
    const tagsHtml = tags.length
      ? tags.map((tag,ti) => `<div class="func-tag" draggable="true"
            ondragstart="tagDragStart(event,${si},${ti})"
            ondragend="tagDragEnd(event)">

      : '<span class="func-empty-hint">선택하여 추가</span>';
    const swatchHtml = SWATCHES.map(c => {
      const active = funcColor === c;
      return `<div class="c-swatch ${active?'active':''}"
        style="background:${c};border-color:${active?'#333':'rgba(0,0,0,.15)'};"
        onclick="setFuncColor(${si},'${c}')"></div>`;

    const hasNext = si + 1 < stages.length;
    const isCollapsed = !st.isOpen;
    return `<div class="stage-card" id="stageCard_${st.id}">
      <div class="stage-head" onclick="toggleStageCard(${si})">
        <span class="slabel">${getStageBadge(st)}</span>
        <div style="display:flex;gap:4px;align-items:center;flex-shrink:0;">
          ${hasNext ? `<button class="stage-merge-btn" onclick="event.stopPropagation();mergeStages(${si})" title="아래 단계와 합치기" style="font-size:11px;padding:2px 7px;border:1.5px solid var(--teal);border-radius:4px;background:var(--teal-light);color:var(--teal-dark);cursor:pointer;white-space:nowrap;">⊕ 합치기</button>` : ''}
          <button class="stage-del" onclick="event.stopPropagation();delStage(${si})" title="삭제">✕</button>
        </div>
      </div>
      <div class="stage-body${isCollapsed ? ' collapsed' : ''}">
        <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;">
          <div style="flex:2;min-width:140px;">
            <label style="font-size:12px;color:#888;font-weight:700;">🕐 시기/단계명
              <span style="font-size:10px;font-weight:400;color:#aaa;"> (줄바꿈 자유 · 비우면 자동)</span>
            </label>
            <textarea id="stageNameArea_${si}" rows="2"
              style="width:100%;font-size:13px;padding:6px 8px;border:1.5px solid var(--teal);border-radius:5px;resize:vertical;font-family:inherit;color:var(--teal-dark);font-weight:700;"
              placeholder="${getStageLabel(st)}"
              oninput="onStageLabelOverride(${si},this.value)"
            >${st.stageDisplayOverride || st.stageDisplayText || st.stageRawCell || ''}</textarea>
          </div>
          <div style="flex:1;min-width:80px;">
            <label style="font-size:12px;color:#888;font-weight:700;">📅 날짜 간격</label>
            <input style="width:100%;font-size:13px;padding:5px 7px;border:1.5px solid #ddd;border-radius:5px;"
              placeholder="예) 7-10일 간격"
              value="${st.dateRange||''}"
              oninput="onDateRangeChange(${si},this.value)">
          </div>
        </div>

        <div class="func-row">
          <label>📋 제품 기능 <span style="font-size:9px;color:#9b7fd4;font-weight:500;">(복수 선택 가능)</span></label>
          <select class="func-select" onchange="addFuncTag(${si},this.value);this.value='';">
            <option value="">── 선택하여 추가 ──</option>
            <option>세균성+바이러스+시들음+예방</option>
            <option>가스제거+뿌리발근+뿌리활착</option>
            <option>가스제거+염류제거</option>
            <option>작물활성</option>
            <option>광합성촉진</option>
            <option>냉해+저온+예방</option>
            <option>잎+두껍게 잎+왁스층+강화</option>
            <option value="__direct__">✏️ 직접입력...</option>
          </select>
          <div class="func-tags-area" id="funcTags_${si}"
            ondragover="tagDragOver(event,${si})"
            ondrop="tagDrop(event,${si})">
            ${tagsHtml}
          </div>
          <div class="func-bottom">
            <div class="color-palette">${swatchHtml}</div>
            <button class="func-reset-btn" onclick="resetFuncTags(${si})">초기화</button>
          </div>
        </div>

        <div class="area-row">
          <label class="area-label">📐 적용 평수</label>
          <select class="area-select" id="areaSel_${si}" onchange="onAreaChange(${si},this.value)">
            <option value="">-- 선택 --</option>
            ${areaOptions}
            <option value="직접입력" ${isCustomArea?'selected':''}>✏️ 직접입력</option>
          </select>
          <input class="area-custom" id="areaCustom_${si}"
            type="number" placeholder="평수 입력" min="1" step="50"
            value="${isCustomArea ? st.area : ''}"
            style="display:${isCustomArea ? 'block' : 'none'}"
            oninput="onAreaCustom(${si},this.value)">
          ${st.area ? `<span class="area-badge">${st.area}평</span>` : ''}
        </div>

        ${prods}
        <div class="add-prod-section">
          <div class="add-prod-row">
            <select class="add-prod-select" id="prodSel_${si}">
              <option value="">── 제품 선택 (거래명세표 기준) ──</option>
              ${prodOptions}
            </select>
            <button class="add-prod-btn" onclick="addProdFromSelect(${si})">+ 추가</button>
          </div>
        </div>
      </div>
    </div>`;
  }; // makeCard 끝

  list.innerHTML = stageGroupOrder.filter(mk => groupMap[mk]).map(mk => {
    const siList = groupMap[mk];
    const label = groupLabels[mk] ?? '';
    const isCollapsed = !!window._monthGroupCollapsed[mk];
    const cardsHtml = siList.map(si => makeCard(stages[si], si)).join('');
    return `<div class="month-group" id="monthGrp_${mk}"
        ondragover="groupDragOver(event,${mk})"
        ondrop="groupDrop(event,${mk})">
      <div class="month-group-header" draggable="true"
          ondragstart="groupDragStart(event,${mk})"
          ondragend="groupDragEnd(event)">
        <span class="group-drag-handle" ondragstart="event.stopPropagation()" style="pointer-events:none;">⠿</span>
        <input class="group-label-input" value="${label.replace(/"/g,'&quot;')}"
          placeholder="카테고리 이름"
          oninput="setGroupLabel(${mk},this.value)"
          onclick="event.stopPropagation()"
          ondragstart="event.stopPropagation()">
        <span class="month-group-count">${siList.length}단계</span>
        <button class="group-copy-btn" onclick="event.stopPropagation();copyGroup(${mk})" title="그룹 복사">⎘ 복사</button>
        <button class="group-delete-btn" onclick="event.stopPropagation();deleteGroup(${mk})" title="그룹 삭제">✕ 삭제</button>
        <button class="group-toggle-btn" onclick="event.stopPropagation();toggleMonthGroup(${mk})">${isCollapsed ? '▼' : '▲'}</button>
      </div>
      <div class="month-group-body${isCollapsed ? ' collapsed' : ''}">
        <div style="padding:6px 10px 2px;border-bottom:1px solid rgba(58,172,170,.15);">
          <label style="font-size:11px;color:#888;font-weight:700;display:block;margin-bottom:3px;">📋 페이지 제목 <span style="font-weight:400;">(비워두면 공란)</span></label>
          <textarea id="groupTitleArea_${mk}" rows="1"
            style="width:100%;font-size:13px;padding:5px 8px;border:1.5px solid var(--teal);border-radius:5px;resize:none;font-family:inherit;color:var(--teal-dark);font-weight:700;box-sizing:border-box;"
            placeholder=""
            oninput="setGroupLabel(${mk},this.value)"
          >${groupLabels[mk]??''}</textarea>
        </div>
        ${cardsHtml}
      </div>
    </div>`;
  }).join('');
}

function toggleMonthGroup(mk) {
  if (!window._monthGroupCollapsed) window._monthGroupCollapsed = {};
  window._monthGroupCollapsed[mk] = !window._monthGroupCollapsed[mk];
  renderStages();
}

// UX-01: 단계 카드 헤더 클릭 시 접힘/펼침 토글 (DOM 직접 조작 — 포커스 유지)
function toggleStageCard(si) {
  if (si < 0 || si >= stages.length) return;
  stages[si].isOpen = !stages[si].isOpen;
  // 전체 재렌더 대신 직접 DOM 조작 (포커스·스크롤 유지)
  const body = document.querySelector(`#stageCard_${stages[si].id} .stage-body`);
  if (body) body.classList.toggle('collapsed', !stages[si].isOpen);
}

// ── 그룹 순서 동기화 ─────────────────────
function syncGroupOrder() {
  const seen = [];
  stages.forEach(st => {
    const mk = getStageGroupKey(st);
    if (!seen.includes(mk)) seen.push(mk);
  });
  // 신규 그룹 추가 (뒤에 붙이기)
  seen.forEach(mk => {
    if (!stageGroupOrder.includes(mk)) stageGroupOrder.push(mk);
    // v16: undefined 뿐만 아니라 이전 코드가 자동 생성한 stale fallback 값도 교체
    // ("2페이지 처방", "3월 처방" 등 localStorage에 남아있는 기본값)
    const isStaleDefault = groupLabels[mk] === undefined ||
      /^\d+페이지 처방$|^\d+월 처방$|^기본 처방$/.test(groupLabels[mk]);
    if (isStaleDefault) {
      // 그룹 제목(pageTitle) 초기값 우선순위: pageTitle → purpose(구형 호환) → ''(공란)
      // ⚠ stageLabelOverride / stageLabel 은 시기/단계명 데이터 → groupHeader에 절대 복사 금지
      const groupStages = stages.filter(s => getStageGroupKey(s) === mk);
      const firstPageTitle = groupStages.map(s => s.pageTitle).filter(Boolean)[0];
      const firstPurpose   = groupStages.map(s => s.purpose).filter(Boolean)[0];
      groupLabels[mk] = firstPageTitle || firstPurpose || '';
    }
  });
  // 없어진 그룹 제거
  stageGroupOrder = stageGroupOrder.filter(mk => seen.includes(mk));
}

// ── 그룹 레이블 수정 ─────────────────────
function setGroupLabel(mk, val) {
  groupLabels[mk] = val;
  // 그룹 페이지 제목 textarea 동기화
  const ta = document.getElementById(`groupTitleArea_${mk}`);
  if (ta) ta.value = val;
  // 그룹 헤더 입력란 동기화
  const inp = document.querySelector(`#monthGrp_${mk} .group-label-input`);
  if (inp) inp.value = val;
  schedulePreview();
  _saveRxStages();
}

// ── 그룹 복사 ────────────────────────────
function copyGroup(mk) {
  const newMk = Math.max(0, ...stages.map(s => getStageGroupKey(s)), ...stageGroupOrder) + 1;
  const srcStages = stages.filter(st => getStageGroupKey(st) === mk);
  if (!srcStages.length) return;
  const copies = srcStages.map(st => ({
    ...st,
    id: ++stageIdCnt,
    month: newMk,
    pageGroup: newMk,
    sourcePage: st.sourcePage ?? null,
    pageType: st.pageType || '',
    products: (st.products || []).map(p => ({...p})),
    funcTags: [...(st.funcTags || [])],
  }));
  // 원본 그룹의 마지막 stage 바로 뒤에 삽입
  let insertIdx = stages.length;
  for (let i = stages.length - 1; i >= 0; i--) {
    if (getStageGroupKey(stages[i]) === mk) { insertIdx = i + 1; break; }
  }
  stages.splice(insertIdx, 0, ...copies);
  const mkIdx = stageGroupOrder.indexOf(mk);
  stageGroupOrder.splice(mkIdx + 1, 0, newMk);
  groupLabels[newMk] = (groupLabels[mk] || `${mk}월`) + ' (복사)';
  renderStages();
  schedulePreview();
  _saveRxStages();
}

// ── 그룹 삭제 ────────────────────────────
function deleteGroup(mk) {
  const label = groupLabels[mk] || `${mk}월`;
  const count = stages.filter(st => getStageGroupKey(st) === mk).length;
  if (!confirm(`"${label}" 카테고리(${count}단계)를 삭제할까요?`)) return;
  _pushHistory();
  stages = stages.filter(st => getStageGroupKey(st) !== mk);
  stageGroupOrder = stageGroupOrder.filter(k => k !== mk);
  delete groupLabels[mk];
  renderStages();
  schedulePreview();
  _saveRxStages();
}

// ── 그룹 드래그 ──────────────────────────
function groupDragStart(e, mk) {
  _dragGroupMk = mk;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', String(mk));
  setTimeout(() => {
    const el = document.getElementById(`monthGrp_${mk}`);
    if (el) el.classList.add('dragging');
  }, 0);
}
function groupDragEnd(e) {
  document.querySelectorAll('.month-group').forEach(el => {
    el.classList.remove('dragging','drag-over');
  });
  _dragGroupMk = null;
}
function groupDragOver(e, mk) {
  if (_dragGroupMk === null || _dragGroupMk === mk) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('.month-group').forEach(el => el.classList.remove('drag-over'));
  const el = document.getElementById(`monthGrp_${mk}`);
  if (el) el.classList.add('drag-over');
}
function groupDrop(e, mk) {
  e.preventDefault();
  if (_dragGroupMk === null || _dragGroupMk === mk) return;
  const fromIdx = stageGroupOrder.indexOf(_dragGroupMk);
  const toIdx   = stageGroupOrder.indexOf(mk);
  if (fromIdx < 0 || toIdx < 0) return;
  stageGroupOrder.splice(fromIdx, 1);
  stageGroupOrder.splice(toIdx, 0, _dragGroupMk);
  // stages 배열도 그룹 순서에 맞춰 재정렬
  const newStages = [];
  stageGroupOrder.forEach(gmk => {
    stages.forEach(st => { if (getStageGroupKey(st) === gmk) newStages.push(st); });
  });
  stages = newStages;
  // pageOrder의 group_ 키도 stageGroupOrder 순서에 맞춰 재정렬
  const reorderedGroupKeys = stageGroupOrder.map(gmk => `group_${gmk}`).filter(k => pageOrder.includes(k));
  let gi = 0;
  pageOrder = pageOrder.map(k => k.startsWith('group_') ? reorderedGroupKeys[gi++] : k);
  _dragGroupMk = null;
  renderStages();
  schedulePreview();
  _saveRxStages();
}

// ── 평수 선택 ─────────────────────────────
function onAreaChange(si, val) {
  if (val === '직접입력') {
    const custom = document.getElementById(`areaCustom_${si}`);
    if (custom) { custom.style.display = 'block'; custom.focus(); }
    stages[si].area = '';
  } else {
    const custom = document.getElementById(`areaCustom_${si}`);
    if (custom) custom.style.display = 'none';
    stages[si].area = val ? Number(val) : '';
    renderStages();
  }
}

// ── 제품 기능 태그 ──────────────────────────
function addFuncTag(si, val) {
  if (!val) return;
  if (!stages[si].funcTags) stages[si].funcTags = [];
  if (val === '__direct__') {
    const text = prompt('직접 입력:');
    if (!text || !text.trim()) return;
    stages[si].funcTags.push(text.trim());
  } else {
    if (!stages[si].funcTags.includes(val)) stages[si].funcTags.push(val);
  }
  renderStages();
}
function delFuncTag(si, ti) {
  stages[si].funcTags.splice(ti, 1);
  renderStages();
}
function resetFuncTags(si) {
  stages[si].funcTags = [];
  stages[si].funcColor = '#ffffff';
  renderStages();
}
function setFuncColor(si, color) {
  stages[si].funcColor = color;
  renderStages();
}

// 태그 드래그앤드롭
let tagDragSi = null, tagDragTi = null;
function tagDragStart(e, si, ti) {
  tagDragSi = si; tagDragTi = ti;
  e.dataTransfer.effectAllowed = 'move';
  e.currentTarget.classList.add('tag-dragging');
}
function tagDragEnd(e) { e.currentTarget.classList.remove('tag-dragging'); }
function tagDragOver(e, si) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; }
function tagDrop(e, si) {
  e.preventDefault();
  if (tagDragSi !== si || tagDragTi === null) return;
  const tags = stages[si].funcTags;
  const container = document.getElementById(`funcTags_${si}`);
  const tagEls = [...container.querySelectorAll('.func-tag')];
  let dropIdx = tags.length;
  tagEls.forEach((el, i) => {
    const rect = el.getBoundingClientRect();
    if (e.clientX < rect.left + rect.width / 2 && i < dropIdx) dropIdx = i;
  });
  const [moved] = tags.splice(tagDragTi, 1);
  const insertAt = dropIdx > tagDragTi ? dropIdx - 1 : dropIdx;
  tags.splice(insertAt, 0, moved);
  tagDragSi = null; tagDragTi = null;
  renderStages();
}

function onUnitChange(si, pi, val) {
  if (val === '__direct__') {
    const c = document.getElementById(`unitCustom_${si}_${pi}`);
    if (c) { c.style.display = 'block'; c.focus(); }
    stages[si].products[pi].unit = '';
  } else {
    const c = document.getElementById(`unitCustom_${si}_${pi}`);
    if (c) c.style.display = 'none';
    stages[si].products[pi].unit = val;
    schedulePreview();
  }
}

let dragKey = null;

function onDragStart(e, key) {
  dragKey = key;
  e.dataTransfer.effectAllowed = 'copy';
  e.currentTarget.classList.add('dragging');
}
function onDragEnd(e) {
  e.currentTarget.classList.remove('dragging');
}
function onDragOver(e, si) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'copy';
  const zone = document.getElementById(`dropZone_${si}`);
  if (zone) zone.classList.add('drag-over');
}
function onDragLeave(si) {
  const zone = document.getElementById(`dropZone_${si}`);
  if (zone) zone.classList.remove('drag-over');
}
function onDrop(e, si) {
  e.preventDefault();
  const zone = document.getElementById(`dropZone_${si}`);
  if (zone) zone.classList.remove('drag-over');
  if (!dragKey) return;
  if (!stages[si].products) stages[si].products = [];
  // 이미 같은 제품이 있으면 수량만 증가
  const existing = stages[si].products.find(p => p.key === dragKey);
  if (existing) {
    existing.qty = (existing.qty || 0) + 1;
  } else {
    stages[si].products.push({ key: dragKey, qty: 1, desc: '', unit: '개' });
  }
  const droppedKey = dragKey;
  dragKey = null;
  checkOverStock(si, droppedKey);
  renderStages();
  renderInventory();
}

function addProdFromSelect(si) {
  const sel = document.getElementById(`prodSel_${si}`);
  const key = sel ? sel.value : '';
  if (!key) { alert('제품을 선택해주세요.'); return; }
  if (!stages[si].products) stages[si].products = [];
  const existing = stages[si].products.find(p => p.key === key);
  if (existing) {
    existing.qty = (existing.qty || 0) + 1;
  } else {
    const prodName = key.split('||')[0];
    const isYeopMyeon = stages[si].type === '엽면';
    const matchedKey = !isYeopMyeon && Object.keys(PRODUCT_DEFAULT_DESCS).find(k => prodName.includes(k));
    const defaultDesc = matchedKey ? PRODUCT_DEFAULT_DESCS[matchedKey] : '';
    stages[si].products.push({ key, qty: 1, desc: defaultDesc, unit: '개' });
  }
  checkOverStock(si, key);
  renderStages();
  renderInventory();
}

function setFoliarDesc(si, pi, text) {

  renderStages();

function checkOverStock(si, key) {
  const inv = getInventory();
  if (inv[key] && inv[key].used > inv[key].total) {
    if (overCooldown > 0) { overCooldown--; return; }
    const it = inv[key];
    alert(`⚠️ "${it.name}" 재고를 초과했습니다!\n총 재고: ${it.total} / 현재 배정: ${it.used}\n\n앞으로 5번 더 초과 시 다시 알려드립니다.`);
    overCooldown = 5;
  }
}

  const key = stages[si].products[pi].key;
